{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ site.title }}{% endblock %}
{% block description %}{{ page.description }}{% endblock %}
{% block content %}
<section class="page-hero compact"><div class="section-wrap"><p class="eyebrow">{{ page.eyebrow }}</p><h1>{{ page.title }}</h1><p>{{ page.description }}</p></div></section>
<article class="prose section-wrap">{{ page.body|safe }}</article>
{% endblock %}
