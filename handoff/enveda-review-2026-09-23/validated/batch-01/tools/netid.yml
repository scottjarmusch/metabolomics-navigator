$schema: ../../../../../schemas/tool.schema.json
slug: netid
name: NetID
summary: An R-based global network-optimization method for annotating untargeted LC-MS features using measured masses, retention times, known chemical relationships, and optional MS/MS evidence.
links:
  primary: https://github.com/LiChenPU/NetID
  repository: https://github.com/LiChenPU/NetID
resource_types:
  - programming_package
functions:
  primary: annotation_identification
  secondary:
    - molecular_networking
  capabilities:
    - adduct_isotope_grouping
    - library_matching
    - structure_database_search
platforms:
  - lc_ms
analysis_types:
  - untargeted
interfaces:
  - r_package
access:
  model: open_source
  license: GPL-3.0
technical:
  operating_systems:
    - windows
    - macos
    - linux
  programming_languages:
    - R
    - C
data:
  input_types:
    - raw_instrument_data
    - feature_table
    - spectra
    - spectral_library
  output_types:
    - compound_list
    - feature_table
  input_formats:
    - mzxml
    - csv_tsv
    - mgf
  output_formats:
    - csv_tsv
publications:
  - doi: 10.1038/s41592-021-01303-3
    type: primary
common_uses:
  - Improve annotation coverage by optimizing assignments across a connected LC-MS feature network.
  - Use adduct, isotope, fragmentation, and biochemical-transformation relationships to constrain candidate assignments.
maintenance:
  status: limited
  repository_last_activity: '2023-08-28'
  last_checked: '2026-10-06'
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Validated against the official repository and primary publication; software execution was not assessed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-06'
  updated_at: '2026-10-06'
  last_verified: '2026-10-06'
  last_editorial_review: '2026-10-06'
scope:
  designed_for:
    - Global annotation of untargeted LC-MS feature tables using network constraints.
  requirements:
    - A peak table, mzXML data, reference compound information, and transformation rules; MS/MS evidence is optional.
  considerations:
    - Network-consistent annotations remain hypotheses whose confidence depends on the reference information and constraints supplied.
acquisition:
  ms_levels:
    - ms1
    - ms2
  strategies:
    - full_scan
    - dda
    - unspecified
  ion_mobility: not_required
