slug: dreams
name: DreaMS
summary: A transformer-based framework for learning molecular representations from tandem mass spectra, supporting spectral similarity, clustering, molecular networking, and downstream prediction tasks.
links:
  primary: https://dreams-docs.readthedocs.io/
  homepage: https://dreams-docs.readthedocs.io/
  repository: https://github.com/pluskal-lab/DreaMS
  documentation: https://dreams-docs.readthedocs.io/
  web_app: https://huggingface.co/spaces/anton-bushuiev/DreaMS
resource_types:
  - programming_package
  - web_service
functions:
  primary: spectral_analysis
  secondary:
    - machine_learning
    - molecular_networking
    - annotation_identification
  capabilities:
    - ms2_processing
    - library_matching
    - network_visualization
platforms:
  - platform_independent
analysis_types:
  - untargeted
interfaces:
  - python_package
  - web_app
  - notebook
access:
  model: open_source
  license: MIT
technical:
  operating_systems:
    - linux
    - macos
    - cross_platform
  programming_languages:
    - Python
data:
  input_types:
    - spectra
  output_types:
    - spectra
    - statistical_results
  input_formats:
    - mgf
    - hdf5
  output_formats:
    - hdf5
publications:
  - doi: 10.1038/s41587-025-02663-3
    type: primary
