$schema: ../../../../../schemas/tool.schema.json
slug: metabonaut
name: Metabonaut
summary: An open educational and reproducible workflow resource for script-based untargeted LC-MS/MS metabolomics using R and Bioconductor packages across preprocessing, QC, statistics, and annotation.
links:
  primary: https://rformassspectrometry.github.io/Metabonaut/
  homepage: https://rformassspectrometry.github.io/Metabonaut/
  repository: https://github.com/rformassspectrometry/Metabonaut
  documentation: https://rformassspectrometry.github.io/Metabonaut/
resource_types:
  - workflow_pipeline
functions:
  primary: workflow_reproducibility
  secondary:
    - preprocessing
    - quality_control
    - statistics
    - annotation_identification
  capabilities:
    - provenance_tracking
    - chromatogram_building
    - peak_detection
    - retention_time_alignment
    - gap_filling
    - library_matching
platforms:
  - lc_ms
analysis_types:
  - untargeted
  - metabolite_profiling
interfaces:
  - r_package
  - notebook
access:
  model: open_source
  license: CC-BY-SA-4.0
technical:
  operating_systems:
    - linux
    - macos
    - windows
    - containers
  programming_languages:
    - R
  containers:
    - Docker
data:
  input_types:
    - raw_instrument_data
    - spectra
    - sample_metadata
  output_types:
    - feature_table
    - statistical_results
    - compound_list
    - report
  input_formats:
    - mzml
    - csv_tsv
publications:
  - doi: 10.1007/s11306-026-02538-x
    type: primary
