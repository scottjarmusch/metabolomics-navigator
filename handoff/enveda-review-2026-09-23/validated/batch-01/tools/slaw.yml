$schema: ../../../../../schemas/tool.schema.json
slug: slaw
name: SLAW
summary: A scalable, containerized workflow for untargeted LC-MS preprocessing with automated parameter optimization, feature detection, alignment, gap filling, isotope/adduct grouping, and DDA MS/MS consolidation.
links:
  primary: https://github.com/zamboni-lab/SLAW
  repository: https://github.com/zamboni-lab/SLAW
resource_types:
  - workflow_pipeline
functions:
  primary: preprocessing
  secondary:
    - workflow_reproducibility
    - quality_control
    - spectral_analysis
  capabilities:
    - peak_detection
    - retention_time_alignment
    - gap_filling
    - adduct_isotope_grouping
    - ms2_processing
    - container_support
platforms:
  - lc_ms
analysis_types:
  - untargeted
interfaces:
  - command_line
access:
  model: open_source
  license: GPL-2.0
technical:
  operating_systems:
    - linux
    - windows
    - containers
  programming_languages:
    - R
    - Python
  containers:
    - Docker
data:
  input_types:
    - raw_instrument_data
    - sample_metadata
  output_types:
    - feature_table
    - spectra
  input_formats:
    - mzml
    - csv_tsv
  output_formats:
    - csv_tsv
    - mgf
publications:
  - doi: 10.1021/acs.analchem.1c02687
    type: primary
common_uses:
  - Run reproducible preprocessing of large untargeted LC-MS studies.
  - Optimize peak picking, alignment, and gap-filling parameters using QC samples.
  - Produce feature tables and consolidated DDA MS/MS spectra for downstream analysis.
maintenance:
  status: active
  repository_last_activity: '2024-08-03'
  last_checked: '2026-10-06'
  notes: The original Enveda-linked repository points users to the maintained zamboni-lab/SLAW repository.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Validated against the maintained project repository and primary publication; software execution was not assessed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-06'
  updated_at: '2026-10-06'
  last_verified: '2026-10-06'
  last_editorial_review: '2026-10-06'
scope:
  designed_for:
    - Scalable untargeted LC-MS preprocessing from centroided mzML files.
  requirements:
    - Centroided, single-polarity mzML input and a container runtime.
  considerations:
    - DDA MS/MS is supported, but DIA-MS2 spectra are skipped by the documented workflow.
    - Automated optimization depends on representative QC or selected reference samples.
acquisition:
  ms_levels:
    - ms1
    - ms2
  strategies:
    - full_scan
    - dda
  ion_mobility: unspecified
