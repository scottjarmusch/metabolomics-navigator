  primary: https://github.com/Katherine00689/RapidMass
  repository: https://github.com/Katherine00689/RapidMass
resource_types:
  - software_application
functions:
  primary: annotation_identification
  secondary:
    - preprocessing
    - machine_learning
    - visualization_reporting
  capabilities:
    - structure_database_search
    - feature_selection
    - interactive_dashboard
platforms:
  - direct_infusion_ms
  - multi_platform
analysis_types:
  - metabolite_profiling
interfaces:
  - desktop_gui
access:
  model: source_available
data:
  input_types:
    - spectra
  output_types:
    - statistical_results
    - report
publications:
