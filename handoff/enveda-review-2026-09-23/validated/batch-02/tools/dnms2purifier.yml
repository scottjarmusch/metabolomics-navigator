slug: dnms2purifier
name: DNMS2Purifier
summary: An R-based method for purifying chimeric tandem mass spectra from data-dependent untargeted LC-MS/MS experiments before downstream spectral interpretation.
links:
  primary: https://github.com/HuanLab/DNMS2Purifier
  repository: https://github.com/HuanLab/DNMS2Purifier
resource_types:
  - programming_package
functions:
  primary: spectral_analysis
  secondary:
    - preprocessing
  capabilities:
    - spectral_deconvolution
    - ms2_processing
platforms:
  - lc_ms
analysis_types:
  - untargeted
interfaces:
  - r_package
access:
  model: open_source
technical:
  operating_systems:
    - cross_platform
  programming_languages:
    - R
data:
  input_types:
    - spectra
  output_types:
    - spectra
publications:
  - doi: 10.1021/acs.analchem.3c00736
    type: primary
common_uses:
  - Reduce precursor co-isolation effects in DDA MS/MS spectra before library matching or annotation.
maintenance:
  status: limited
  repository_last_activity: '2023-06-19'
