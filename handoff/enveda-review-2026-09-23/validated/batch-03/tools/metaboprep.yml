status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-06'
  updated_at: '2026-10-06'
  last_verified: '2026-10-06'
  last_editorial_review: '2026-10-06'
scope:
  designed_for:
    - Quality control and filtering of already quantified metabolomics tables.
  not_designed_for:
    - Raw LC-MS chromatographic peak detection or feature extraction.
