  secondary: []
  capabilities:
    - retention_time_alignment
platforms:
  - lc_ms
analysis_types:
  - untargeted
interfaces:
  - python_package
  - command_line
access:
  model: open_source
  license: MulanPSL-2.0
technical:
  operating_systems:
    - linux
    - macos
    - windows
  programming_languages:
    - Python
data:
  input_types:
    - feature_table
  output_types:
    - feature_table
  input_formats:
    - csv_tsv
  output_formats:
    - csv_tsv
publications:
  - doi: 10.1186/s12859-023-05525-4
    type: primary
common_uses:
