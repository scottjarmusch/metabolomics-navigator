  secondary: [annotation_identification]
  capabilities: [blank_filtering, adduct_isotope_grouping, structure_database_search]
platforms: [lc_ms]
analysis_types: [lipidomics, untargeted]
interfaces: [python_package]
access:
  model: open_source
  license: MIT
