slug: molnotator
name: MolNotator
summary: A Python package that interprets LC-MS/MS ion relationships and spectral evidence to infer molecule-centric networks rather than networks of individual ion signals.
links:
  primary: https://github.com/ZzakB/MolNotator
  repository: https://github.com/ZzakB/MolNotator
resource_types:
  - programming_package
functions:
  primary: molecular_networking
  secondary:
    - annotation_identification
  capabilities:
    - ion_identity_networking
    - library_matching
    - network_visualization
platforms:
  - lc_ms
analysis_types:
  - untargeted
interfaces:
  - python_package
access:
  model: open_source
  license: MIT
technical:
  operating_systems:
    - cross_platform
  programming_languages:
    - Python
data:
  input_types:
    - feature_table
    - spectra
  output_types:
    - compound_list
    - statistical_results
common_uses:
  - Collapse ion-level evidence into predicted molecule nodes.
  - Dereplicate candidates using spectral, exact-mass, retention-time, and adduct information.
