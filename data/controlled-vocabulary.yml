version: 0.1.0
last_updated: 2026-07-31
principles:
  - Use stable machine-readable IDs and editable human-readable labels.
  - Categorize tools across separate dimensions rather than forcing one hierarchy.
  - Keep the researcher submission form short; curators may enrich records later.
  - Allow multiple values where tools genuinely span platforms, interfaces, or functions.
  - Use external standards such as EDAM and SPDX where practical, without requiring submitters to know them.

required_submission_dimensions:
  - resource_types
  - primary_function
  - platforms
  - interfaces
  - access_model

resource_types:
  - id: software_application
    label: Software application
    description: A standalone application or software suite.
  - id: programming_package
    label: Programming package or library
    description: A package intended to be called from R, Python, MATLAB, or another programming language.
  - id: web_service
    label: Web application or service
    description: A browser-accessible application or hosted analytical service.
  - id: database_knowledgebase
    label: Database or knowledgebase
    description: A curated or computational resource for metabolite, pathway, reaction, or reference information.
  - id: spectral_library
    label: Spectral library
    description: A reference collection of experimental or predicted spectra.
  - id: data_repository
    label: Data repository
    description: A service primarily used to deposit, preserve, or retrieve metabolomics datasets.
  - id: workflow_pipeline
    label: Workflow or pipeline
    description: A defined sequence of analytical steps distributed as an executable workflow.
  - id: workflow_platform
    label: Workflow platform
    description: An environment used to build, execute, share, or reproduce workflows.
  - id: api_service
    label: API or programmatic service
    description: A service primarily accessed through an application programming interface.
  - id: instrument_vendor_suite
    label: Instrument-vendor suite
    description: Software distributed primarily for use with a vendor's instruments or data ecosystem.

functions:
  - id: experimental_design
    label: Experimental design and study planning
    description: Sample-size planning, randomization, metadata design, or acquisition planning.
  - id: data_acquisition
    label: Data acquisition and instrument control
    description: Instrument control, acquisition methods, or real-time acquisition support.
  - id: data_conversion
    label: Data conversion and import
    description: Conversion between vendor, open, tabular, or exchange formats.
  - id: preprocessing
    label: Preprocessing and feature extraction
    description: Peak detection, deconvolution, alignment, grouping, or gap filling.
  - id: quality_control
    label: Quality control and filtering
    description: QC assessment, contaminant or blank filtering, drift detection, or diagnostic reporting.
  - id: normalization
    label: Normalization and batch correction
    description: Signal normalization, scaling, drift correction, or batch-effect adjustment.
  - id: quantification
    label: Quantification and targeted analysis
    description: Calibration, integration, targeted quantification, or assay processing.
  - id: annotation_identification
    label: Metabolite annotation and identification
    description: Formula assignment, structure elucidation, library matching, or confidence assessment.
  - id: spectral_analysis
    label: Spectral processing and comparison
    description: Spectrum cleaning, similarity scoring, prediction, interpretation, or library generation.
  - id: molecular_networking
    label: Molecular networking and chemical similarity
    description: Network-based organization or exploration of spectra, features, or chemical relationships.
  - id: statistics
    label: Statistical analysis
    description: Univariate or multivariate statistics, hypothesis testing, or exploratory analysis.
  - id: machine_learning
    label: Machine learning and prediction
    description: Classification, regression, feature selection, embedding, or predictive modeling.
  - id: pathway_interpretation
    label: Pathway and biological interpretation
    description: Enrichment, pathway mapping, reaction analysis, or biological interpretation.
  - id: isotope_tracing_flux
    label: Isotope tracing and flux analysis
    description: Stable-isotope correction, isotopologue analysis, flux estimation, or metabolic modeling.
  - id: visualization_reporting
    label: Visualization and reporting
    description: Figures, dashboards, interactive exploration, automated reports, or publication outputs.
  - id: data_management_sharing
    label: Data management and sharing
    description: Metadata handling, deposition, retrieval, interoperability, or FAIR data support.
  - id: workflow_reproducibility
    label: Workflow management and reproducibility
    description: Pipeline execution, provenance, containers, notebooks, or reproducible environments.
  - id: reference_data_search
    label: Reference data and database search
    description: Search and retrieval of metabolite, spectrum, pathway, reaction, or ontology records.
  - id: multiomics_integration
    label: Multi-omics integration
    description: Integration of metabolomics with genomics, transcriptomics, proteomics, microbiome, or other data.

