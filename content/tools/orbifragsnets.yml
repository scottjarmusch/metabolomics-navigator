description: OrbiFragsNets annotates Orbitrap data-dependent MS2 peaks with candidate fragment formulas
  using peak-specific uncertainty and chemical-consistency networks. Its workflow extracts profile-derived
  spectral information before selecting consistent fragment-annotation networks.
scope:
  designed_for:
  - OrbiFragsNets annotates Orbitrap data-dependent MS2 peaks with candidate fragment formulas using peak-specific
    uncertainty and chemical-consistency networks.
  not_designed_for:
  - Universal centroid-spectrum annotation or full molecular-structure confirmation from a selected fragment
    network.
  requirements:
  - Python dependencies and compatible profile-mode Orbitrap mzML data with precursor information and
    appropriate elemental/formula constraints.
  considerations:
  - Profile information used for uncertainty is lost after centroiding. Elemental bounds and precursor
    constraints determine the formula space and must match the experiment.
common_uses:
- OrbiFragsNets annotates Orbitrap data-dependent MS2 peaks with candidate fragment formulas using peak-specific
  uncertainty and chemical-consistency networks.
