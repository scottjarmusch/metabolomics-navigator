description: LipidA-IDER annotates lipid A structures from high-resolution tandem mass spectra using lipid
  A-specific fragmentation interpretation. It provides graphical and command-line workflows with configurable
  analysis parameters and batch processing.
scope:
  designed_for:
  - LipidA-IDER annotates lipid A structures from high-resolution tandem mass spectra using lipid A-specific
    fragmentation interpretation.
  not_designed_for:
  - General lipidomics identification or unambiguous assignment of all lipid A positional and stereochemical
    isomers.
  requirements:
  - The documented Python environment or Windows application, MS2 files prepared with the specified MSConvert
    peak-picking workflow and configured analysis/batch CSV templates.
  considerations:
  - Only Windows operation is documented as tested. Verify fragmentation settings, candidate chemistry
    and annotation evidence for the organism and experiment.
common_uses:
- LipidA-IDER annotates lipid A structures from high-resolution tandem mass spectra using lipid A-specific
  fragmentation interpretation.
publications:
- doi: 10.1021/acs.analchem.1c03566
  type: primary
  citation: LipidA-IDER to Explore the Global Lipid A Repertoire of Drug-Resistant Gram-Negative Bacteria.
    Analytical Chemistry (2023).
