description: MetaboAnnotatoR annotates LC-MS all-ion-fragmentation features using chromatographic information
  and metabolite fragment databases. The R workflow links processed AIF data to candidate metabolites
  and includes guidance for constructing fragment-database entries.
scope:
  designed_for:
  - An R package for annotating LC-MS all-ion-fragmentation metabolomics features using fragment-ion databases
    and centroided chromatographic data.
  not_designed_for:
  - Treating all coeluting fragments as compound-specific evidence or direct transfer of the AIF workflow
    to every DDA/DIA design.
  requirements:
  - R/Bioconductor dependencies, centroided AIF chromatograms, compatible processed feature/group information
    and an appropriate ion-fragment database; follow the xcms/RAMClustR vignette for the documented example.
  considerations:
  - Fragment coverage, chromatographic coelution and upstream grouping affect annotations. Candidate matches
    need assessment of competing explanations and additional evidence.
