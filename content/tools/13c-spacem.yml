$schema: ../../schemas/tool.schema.json
slug: 13c-spacem
name: 13C-SpaceM analysis code
summary: Analyze spatial carbon-13 labeling of fatty acids in single cells and tissue
  imaging experiments.
description: The 13C-SpaceM repository provides scripts and notebooks supporting the
  published spatial isotope-tracing method. It performs isotope correction and single-cell
  or pixel-level analysis using prepared imaging and registration outputs. It is research
  code, not a self-contained replacement for the SpaceM processing pipeline.
links:
  primary: https://github.com/Buglakova/13C-SpaceM
  repository: https://github.com/Buglakova/13C-SpaceM
  documentation: https://github.com/Buglakova/13C-SpaceM
platforms:
- imaging_ms
- maldi_ms
interfaces:
- command_line
- notebook
resource_types:
- workflow_pipeline
functions:
  primary: isotope_tracing_flux
  capabilities:
  - isotopologue_correction
access:
  model: source_available
  notes: Public code; no explicit repository license verified. The README describes
    a separate closed-source SpaceM registration step and supplies its outputs for
    reproduction.
data:
  input_types:
  - imaging_data
  - isotope_tracing_data
  output_types:
  - isotope_tracing_data
  - report
  other_input_formats:
  - imzML ion images and prepared SpaceM registration/segmentation outputs
  other_output_formats:
  - AnnData objects and figure-generation notebooks
common_uses:
- Reproduce or adapt spatial fatty-acid isotope-tracing analysis.
scope:
  designed_for:
  - The published single-cell and tissue isotope-tracing workflow.
  not_designed_for:
  - A turnkey raw-image registration package.
  requirements:
  - Prepared SpaceM outputs for single-cell analysis and the provided Conda environment.
  considerations:
  - The authors flag dependency-version compatibility issues.
publications:
- doi: 10.1038/s42255-024-01118-4
  type: primary
  citation: Spatial single-cell isotope tracing reveals heterogeneity of de novo fatty
    acid synthesis in cancer. Nature Metabolism (2024).
