$schema: ../../schemas/tool.schema.json
slug: autoccs
name: AutoCCS
summary: An open-source Python tool for calculating and calibrating experimental collision cross sections
  from ion-mobility mass-spectrometry data across drift-tube and traveling-wave workflows.
links:
  primary: https://github.com/PNNL-Comp-Mass-Spec/AutoCCS
  repository: https://github.com/PNNL-Comp-Mass-Spec/AutoCCS
  documentation: https://github.com/PNNL-Comp-Mass-Spec/AutoCCS#readme
resource_types:
- programming_package
functions:
  primary: preprocessing
  secondary:
  - annotation_identification
  capabilities:
  - spectral_data_io
platforms:
- multi_platform
analysis_types:
- untargeted
interfaces:
- python_package
- command_line
access:
  model: open_source
  license: BSD-2-Clause
  notes: BSD-2-Clause software with worked examples. Users must supply or generate instrument-compatible
    feature and calibration inputs.
technical:
  operating_systems:
  - linux
  - macos
  - windows
  programming_languages:
  - Python
data:
  input_types:
  - feature_table
  - sample_metadata
  output_types:
  - feature_table
  other_input_formats:
  - Feature/target CSV, XML configuration and acquisition/calibrant metadata
  other_output_formats:
  - Experimental CCS result tables and calibration outputs
publications:
- doi: 10.1093/bioinformatics/btab429
  type: primary
  citation: 'AutoCCS: automated collision cross-section calculation software for ion mobility spectrometry–mass
    spectrometry. Bioinformatics (2021).'
common_uses:
- Calculate CCS values from stepped-field or single-field drift-tube IMS-MS measurements.
- Calibrate traveling-wave or SLIM ion-mobility measurements using reference compounds.
maintenance:
  status: unclear
  repository_last_activity: '2024-12-13'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - Processing ion-mobility measurements into calibrated collision cross sections.
  not_designed_for:
  - CCS prediction directly from a molecular structure or compound identification based on CCS alone.
  requirements:
  - Python environment, feature CSVs, an XML instrument configuration and acquisition metadata; single-field/TWIMS
    modes also require suitable calibrants and sample metadata.
  considerations:
  - Calibration model, reference CCS values and acquisition conditions affect reported values. Check method
    applicability before comparing CCS across platforms.
acquisition:
  ms_levels:
  - ms1
  strategies:
  - unspecified
  ion_mobility: required
description: AutoCCS calculates experimental collision cross sections from ion-mobility measurements using
  stepped-field, single-field and traveling-wave workflows. It applies mode-specific calibration functions
  to prepared feature and instrument metadata.
