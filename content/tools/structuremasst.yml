publications:
- doi: 10.1038/s41587-026-03082-8
  citation: El Abiead Y, Seo JI, Charron-Lamoureux V, et al. Structure-centric searching enables global mapping
    of the public metabolome. Nat Biotechnol (2026).
  type: primary
common_uses:
- Search public metabolomics data starting from a chemical name, SMILES, or SMARTS representation.
- Map a structure or substructure across multiple reference spectra and public datasets rather than relying on one
  query spectrum.
- Explore exact, substructure, and modification-tolerant distributions across harmonized biological and environmental
  metadata.
- Map a chemical family to public datasets and examine the metadata of individual matches.
scope:
  designed_for:
  - Structure-centric and substructure-centric exploration of public MS/MS repositories.
  requirements:
  - A chemical name or structure representation that can be mapped to reference spectra for repository searching.
  considerations:
  - Mass-spectral matching generally does not resolve stereochemistry, and coverage is limited by available reference
    spectra and indexed public data.
  - StructureMASST uses computational spectral matches as evidence of occurrence; important findings should be validated
    with appropriate orthogonal evidence.
  - Inspect the reference spectra behind a structure query and distinguish exact-structure, substructure and analog
    matches.
  not_designed_for:
  - Searching all theoretically possible structures without corresponding reference spectral evidence.
