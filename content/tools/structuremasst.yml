$schema: ../../schemas/tool.schema.json
slug: structuremasst
name: StructureMASST
summary: A GNPS2 web application for structure- and substructure-centric searching across public metabolomics repositories
  using chemical names, SMILES, SMARTS, and matched reference spectra.
description: StructureMASST changes the starting point of repository-scale metabolomics search from one expert-selected
  MS/MS spectrum to a chemical structure or substructure. It retrieves relevant reference spectra, performs multi-spectrum
  MASST searches, and uses precomputed FASST Records with harmonized metadata to map molecules and structural families
  across public repositories, biological contexts, taxonomy, and environmental conditions. Searches can include
  exact structures, substructures, and modification-tolerant relationships.
links:
  primary: https://structure-masst.gnps2.org/
  web_app: https://structure-masst.gnps2.org/
  repository: https://github.com/Wang-Bioinformatics-Lab/Structure_MASST_App
  documentation: https://github.com/Wang-Bioinformatics-Lab/Structure_MASST_App
