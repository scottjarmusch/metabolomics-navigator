$schema: ../../schemas/tool.schema.json
slug: openchrom
name: OpenChrom
summary: Inspect and process chromatographic and mass-spectrometric data in a desktop workbench.
description: OpenChrom provides an extensible graphical environment for chromatogram visualization, signal
  processing and analytical data exchange, with a strong GC-MS heritage.
links:
  primary: https://github.com/Openchrom/openchrom
  documentation: https://github.com/Openchrom/openchrom
  repository: https://github.com/Openchrom/openchrom
resource_types:
- software_application
functions:
  primary: preprocessing
  capabilities:
  - peak_detection
platforms:
- gc_ms
interfaces:
- desktop_gui
access:
  model: open_source
  notes: Open-source core; check separate terms for commercial extensions.
data:
  input_types:
  - raw_instrument_data
  - spectra
  output_types:
  - spectra
  - report
  input_formats:
  - other
  output_formats:
  - other
  other_input_formats:
  - Chromatogram files via installed import plug-ins
  other_output_formats:
  - Processed chromatograms and analysis reports
publications:
- citation: 'Wenig and Odermatt. OpenChrom: a cross-platform open source software for the mass spectrometric
    analysis of chromatographic data. BMC Bioinformatics 11, 405 (2010).'
  type: primary
  doi: 10.1186/1471-2105-11-405
common_uses:
- Review chromatograms interactively.
- Build processing workflows using compatible extensions.
