description: mass2adduct analyzes pairwise mass differences to investigate possible adducts in MSI data.
  Its R functions import processed matrices or mass lists, summarize difference distributions and compare
  them with candidate adduct information.
scope:
  designed_for:
  - mass2adduct analyzes pairwise mass differences to investigate possible adducts in MSI data.
  not_designed_for:
  - Definitive adduct identification from a mass difference alone or automatic raw-imaging preprocessing
    through every import route.
  requirements:
  - R and a mass list, processed MSI CSV matrix or peak-binned Cardinal object; select mass-error/binning
    settings appropriate to the instrument.
  considerations:
  - Pairwise combinations can be numerous and include coincidental differences. Spatial/intensity evidence
    and experimental chemistry help assess candidate adduct assignments.
common_uses:
- mass2adduct analyzes pairwise mass differences to investigate possible adducts in MSI data.
