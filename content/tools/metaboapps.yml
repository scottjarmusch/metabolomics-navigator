access:
  model: free_web_service
  notes: Hosted access and any account or usage requirements should be checked at the linked service. Access to
    a web service does not establish the license of its code or reference data.
publications: []
common_uses:
- Launch modular downstream analyses from GNPS2/molecular-networking outputs without writing custom scripts.
- Explore statistics, chemical pattern queries, drug/food annotations, microbial knowledge, and other specialized
  post-processing applications.
- Provide a discoverable collection for rapidly evolving community analysis modules while keeping core GNPS2 workflows
  separate.
- Apply an appropriate downstream app to a GNPS2 result and retain the underlying feature and sample identifiers.
scope:
  designed_for:
  - Post-processing and interpretation of GNPS2 and related metabolomics analysis outputs using modular web applications.
  requirements:
  - Inputs vary by app and can include GNPS2 task identifiers, feature/network tables, spectra, or metadata.
  considerations:
  - MetaboApps is a collection rather than one analytical algorithm; users should cite and document the specific
    app(s) used.
  - Apps can evolve or be added more rapidly than peer-reviewed methodological publications.
  - Choose the app first, then check its input contract and cited method; record its name, parameters and upstream
    task identifier.
  not_designed_for:
  - One universal workflow with identical input formats, outputs or validation across every app.
