$schema: ../../schemas/tool.schema.json
slug: metaboapps
name: MetaboApps
summary: A modular collection of browser-based downstream analysis applications that extend GNPS2 results with targeted
  interpretation, statistics, metadata, and domain-specific readouts.
description: MetaboApps is a GNPS2 collection of lightweight downstream applications built to make specialized post-processing
  analyses accessible without bespoke scripting. The current collection includes applications for post-network MassQL,
  multi-step MassQL, drug and food readouts, CMMC analysis, FBMN statistics, chemical proportionality, CorrOmics,
  conjugated-metabolome exploration, and reverse-metabolomics-style analyses. Individual apps remain separate scientific
  modules, while this Navigator entry represents the maintained collection as a discovery and launch layer.
links:
  primary: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/metaboapps_overview/
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/metaboapps_overview/
resource_types:
- workflow_platform
- web_service
functions:
  primary: workflow_reproducibility
  secondary:
