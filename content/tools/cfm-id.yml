$schema: ../../schemas/tool.schema.json
slug: cfm-id
name: CFM-ID
summary: Predict tandem mass spectra, annotate fragments and rank candidate structures for small molecules.
description: CFM-ID combines learned fragmentation and rule-based components. The version 4 web workflow focuses
  on ESI-QTOF MS/MS and provides predicted-versus-observed spectral comparisons.
links:
  primary: https://cfmid.wishartlab.com/help
  documentation: https://cfmid.wishartlab.com/help
resource_types:
- web_service
functions:
  primary: annotation_identification
  capabilities:
  - in_silico_spectra
  - structure_database_search
platforms:
- lc_ms
interfaces:
- web_app
- command_line
access:
  model: free_web_service
  notes: Free web access and downloadable components; consult individual code, model and database terms.
data:
  input_types:
  - spectra
  - molecular_structures
  output_types:
  - spectra
  - compound_list
  input_formats:
  - smiles_inchi
  - other
  output_formats:
  - other
  other_output_formats:
  - Predicted peak lists and ranked candidates
  other_input_formats:
  - Structure strings or formatted spectral peak lists
publications:
- citation: Wang F, Allen D, Tian S, et al. CFM-ID 4.0 - a web server for accurate MS-based metabolite identification.
    Nucleic Acids Res 50, W165-W174 (2022).
  type: primary
  doi: 10.1093/nar/gkac383
common_uses:
- Compare an observed spectrum with candidate structures.
- Predict fragmentation for a supplied molecular structure.
scope:
  designed_for:
  - Compare an observed spectrum with candidate structures.
  not_designed_for:
  - Proving stereochemistry or identity from a top-ranked candidate alone.
  requirements:
  - A molecular structure for prediction, or a spectrum with appropriate precursor and collision-energy information
    for annotation.
  considerations:
  - Instrument and collision-energy differences affect agreement. The command-line image does not include all
    web-server spectral databases.
credits: []
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Documentation-based editorial review on 7 September 2026. Scope and limitations summarize the linked
    official sources; software execution and developer verification were not assessed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-07'
  updated_at: '2026-09-08'
  last_editorial_review: '2026-09-07'
related_tools:
