$schema: ../../schemas/tool.schema.json
slug: deimos
name: DEIMoS
summary: An open-source Python and command-line toolkit for high-dimensional mass-spectrometry processing,
  including feature detection and alignment, CCS calibration, isotope detection, and MS/MS spectral deconvolution.
links:
  primary: https://deimos.readthedocs.io/
  homepage: https://deimos.readthedocs.io/
  repository: https://github.com/pnnl/deimos
  documentation: https://deimos.readthedocs.io/
resource_types:
- programming_package
functions:
  primary: preprocessing
  secondary:
  - spectral_analysis
  - annotation_identification
  capabilities:
  - peak_detection
  - retention_time_alignment
  - spectral_deconvolution
  - ms2_processing
platforms:
- multi_platform
analysis_types:
- untargeted
interfaces:
- python_package
- command_line
access:
  model: open_source
  license: BSD-3-Clause
  notes: BSD-3-Clause source distribution; consult the installation and API documentation when composing
    a workflow.
technical:
  operating_systems:
  - linux
  - macos
  programming_languages:
  - Python
data:
  input_types:
  - spectra
  - feature_table
  output_types:
  - feature_table
  - spectra
  input_formats:
  - mzml
  - hdf5
  output_formats:
  - csv_tsv
  - hdf5
publications:
- doi: 10.1021/acs.analchem.1c05017
  type: primary
  citation: 'DEIMoS: An Open-Source Tool for Processing High-Dimensional Mass Spectrometry Data. Analytical
    Chemistry (2022).'
common_uses:
- Process multidimensional MS datasets using multiple measured dimensions simultaneously.
- Detect and align features while retaining ion-mobility or other separation dimensions.
- Perform CCS calibration and MS/MS spectral deconvolution.
maintenance:
  status: unclear
  repository_last_activity: '2026-10-21'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - High-dimensional mass-spectrometry data processing where dimensions such as retention time and ion
    mobility improve separation.
  considerations:
  - DEIMoS is code-oriented and requires users to design or adapt a processing workflow around its API/CLI.
  not_designed_for:
  - Predicting CCS from molecular structures or automatically identifying compounds solely from detected
    features.
  requirements:
  - A Python environment with DEIMoS dependencies and data represented in the dimensions expected by the
    selected processing functions; calibration data are needed for CCS calibration.
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - full_scan
  - dda
  - dia
  - unspecified
  ion_mobility: supported
description: DEIMoS provides an API and command-line components for multidimensional MS processing, including
  feature detection, alignment, isotope detection, CCS calibration and MS/MS deconvolution. Users compose
  these components into workflows appropriate to their acquisition dimensions.
