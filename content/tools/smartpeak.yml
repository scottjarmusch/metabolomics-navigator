$schema: ../../schemas/tool.schema.json
slug: smartpeak
name: SmartPeak
summary: Automate targeted and semi-targeted chromatographic data processing and quantification.
description: Built on OpenMS, SmartPeak combines peak detection, integration, calibration and QC reporting
  with graphical and command-line interfaces.
links:
  primary: https://github.com/AutoFlowResearch/SmartPeak
  documentation: https://github.com/AutoFlowResearch/SmartPeak
  repository: https://github.com/AutoFlowResearch/SmartPeak
resource_types:
- software_application
functions:
  primary: quantification
  capabilities:
  - calibration_curve
  - peak_detection
platforms:
- lc_ms
- gc_ms
- ce_ms
interfaces:
- desktop_gui
- command_line
access:
  model: open_source
  notes: MIT-licensed application; underlying components have their own licenses.
data:
  input_types:
  - spectra
  - sample_metadata
  output_types:
  - feature_table
  - report
  input_formats:
  - mzml
  - csv_tsv
  output_formats:
  - csv_tsv
publications:
- citation: Kutuzova S, Colaianni P, Röst H, et al. SmartPeak Automates Targeted and Quantitative Metabolomics
    Data Processing. Anal Chem 92, 15968-15974 (2020).
  type: primary
  doi: 10.1021/acs.analchem.0c03421
common_uses:
- Process targeted LC-MS batches.
- Review calibration curves and quantitative QC reports.
scope:
  designed_for:
  - Process targeted LC-MS batches.
  not_designed_for:
  - Obtaining defensible concentrations without suitable calibration and assay validation.
  requirements:
  - Compatible measurement files, a sequence table and method-specific configuration.
  considerations:
  - Inspect integration and calibration fits, especially near detection limits or in the presence of interference.
credits: []
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Documentation-based editorial review on 7 September 2026. Scope and limitations summarize the linked
    official sources; software execution and developer verification were not assessed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-07'
  updated_at: '2026-09-08'
  last_editorial_review: '2026-09-07'
related_tools:
- slug: openms
  relationship: complementary
- slug: skyline
  relationship: complementary
