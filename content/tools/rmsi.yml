maintenance:
  status: unclear
  last_checked: '2026-09-10'
description: rMSI provides disk-backed access to imaging spectra and a graphical interface for ion-image exploration. Its data model supports viewing selected pixels without loading every spectrum into memory.
common_uses:
- Inspect ion distributions and selected pixel spectra.
- Access imaging data from R with disk-backed storage.
scope:
  designed_for:
  - Imaging-data handling and interactive visualization.
  not_designed_for:
  - Definitive molecular identification from ion images.
  requirements:
  - Compatible R, RGtk2 and native dependencies; Windows instructions require Rtools.
  - The documented imzML reader supports continuous-mode data; check compatibility before conversion.
  considerations:
  - Disk-backed storage still needs sufficient local disk space.
  - Legacy GUI dependencies may require a carefully configured environment.

