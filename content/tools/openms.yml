  updated_at: '2026-09-06'
  last_verified: '2026-08-21'
  last_editorial_review: '2026-09-06'
scope:
  designed_for:
  - Reproducible LC-MS processing with explicit intermediate files and reusable workflow parameters.
  - Custom pipelines that combine mass-spectrometry algorithms with Python or C++ analysis.
  not_designed_for:
  - A single automatic analysis with universally appropriate parameters for every metabolomics experiment.
  requirements:
  - Install OpenMS or pyOpenMS and the dependencies of the selected workflow; graphical workflow systems are separate
    installations.
  - Convert proprietary data to an accepted open format when the selected tool cannot read the original file.
  considerations:
  - Feature detection, alignment and grouping need parameters appropriate to chromatography, resolution and sample
    complexity.
  - Keep workflow files, parameter files, software versions and reference databases alongside the exported results.
  - Select the metabolomics-specific workflow and inspect its intermediate results rather than applying proteomics
    defaults unchanged.
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - full_scan
  - dda
  - dia
  ion_mobility: unspecified
description: OpenMS is a modular framework for building mass-spectrometry workflows. Researchers can combine TOPP
  command-line tools, inspect data with TOPPView, assemble graphical workflows, or use the C++ library and pyOpenMS
  in their own software. Metabolomics workflows connect feature detection, retention-time alignment, feature grouping
  and annotation; open formats allow intermediate results to move between tools. The selected workflow determines
  the supported acquisition mode and outputs.
