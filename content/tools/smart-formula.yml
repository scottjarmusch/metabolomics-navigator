$schema: ../../schemas/tool.schema.json
slug: smart-formula
name: SMART
summary: Rank molecular-formula candidates for spatial-metabolomics mass features.
description: SMART uses a formula network and regression scoring to prioritize formula assignments from
  accurate mass and polarity.
links:
  primary: https://github.com/bioinfo-ibms-pumc/SMART#readme
  repository: https://github.com/bioinfo-ibms-pumc/SMART
  documentation: https://github.com/bioinfo-ibms-pumc/SMART#readme
platforms:
- imaging_ms
interfaces:
- desktop_gui
- command_line
resource_types:
- software_application
functions:
  primary: annotation_identification
  capabilities:
  - molecular_formula_prediction
access:
  model: source_available
  notes: Public source and release assets are available; no explicit software license was identified.
    Data availability differs between released assets and the larger raw database.
data:
  input_types:
  - feature_table
  output_types:
  - compound_list
  other_input_formats:
  - Single m/z or table of m/z values, polarity and mass tolerance
  other_output_formats:
  - Ranked formula candidates and supporting database evidence
common_uses:
- Rank molecular-formula candidates for spatial-metabolomics mass features.
scope:
  designed_for:
  - SMART uses a formula network and regression scoring to prioritize formula assignments from accurate
    mass and polarity.
  not_designed_for:
  - Unambiguous structure identification or raw imaging-data extraction.
  requirements:
  - Python and documented dependencies; matching SMART database and regression model files.
  - Release v0.1 provides smart_full.db and lr_with_sc.pkl; assets were listed but not downloaded or executed.
  considerations:
  - Formula assignments remain hypotheses requiring additional evidence.
  - The README describes a larger raw database requiring author contact; do not equate it with the smaller
    release asset.
publications:
- doi: 10.1021/acs.analchem.4c06210
  type: primary
  citation: 'SMART: An Approach for Accurate Formula Assignment in Spatially Resolved Metabolomics. Analytical
    Chemistry (2025).'
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake checked against official documentation, license information and primary DOI/title/year
    on 2026-10-23. Editorial review only; no execution or independent benchmark.
maintenance:
  status: unclear
  last_checked: '2026-10-23'
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-23'
  updated_at: '2026-10-23'
  last_verified: '2026-10-23'
  last_editorial_review: '2026-10-23'
analysis_types:
- spatial_metabolomics
