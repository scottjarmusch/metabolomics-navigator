  notes: CSI:FingerID is accessed through the SIRIUS web services; current webservice features are free for academic
    use, with separate non-academic licensing.
publications:
- doi: 10.1073/pnas.1509788112
  citation: Dührkop K, Shen H, Meusel M, Rousu J, Böcker S. Searching molecular structure databases with tandem
    mass spectra using CSI:FingerID. Proceedings of the National Academy of Sciences 112, 12580–12585 (2015).
  type: primary
common_uses:
- Rank molecular-structure database candidates from accurate-mass MS/MS spectra.
- Predict molecular fingerprints that summarize structural properties inferred from fragmentation data.
- Provide structure-candidate rankings used by the SIRIUS COSMIC workflow and downstream interpretation.
scope:
  designed_for:
  - Database-backed candidate structure identification of small molecules from informative, high-accuracy MS/MS
    spectra.
  requirements:
  - SIRIUS-compatible high-resolution MS/MS data, a SIRIUS account/license for the webservice, and a molecular formula
    or formula candidates.
  considerations:
  - CSI:FingerID does not determine stereochemistry and cannot identify structures absent from the searched databases.
  - Ranking accuracy depends on spectral information content, molecular-formula quality, and candidate-database
    composition.
