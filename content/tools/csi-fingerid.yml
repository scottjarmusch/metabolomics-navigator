$schema: ../../schemas/tool.schema.json
slug: csi-fingerid
name: CSI:FingerID
summary: A SIRIUS-integrated machine-learning method and webservice for predicting molecular fingerprints from MS/MS
  data and ranking candidate structures from molecular-structure databases.
description: CSI:FingerID predicts structural fingerprints from fragmentation-tree information and uses those fingerprints
  to search and rank candidate molecular structures in databases. In current SIRIUS releases it is a webservice-backed
  component of the structure-database search workflow rather than a standalone end-user application. It does not
  resolve stereochemistry and should be interpreted as ranked computational structure evidence rather than definitive
  identification.
