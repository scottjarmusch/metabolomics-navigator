description: MS2Lipid predicts lipid subclasses from tandem mass spectra using a trained machine-learning
  model. It provides an orthogonal class-level annotation signal for lipidomics and can be used through
  Python or the supplied Colab example.
scope:
  designed_for:
  - A Python package for machine-learning prediction of lipid subclasses from tandem mass spectra using
    curated lipid MS/MS reference data.
  not_designed_for:
  - Full lipid molecular-species identification, acyl-chain assignment or structural confirmation from
    a subclass label alone.
  requirements:
  - The documented compatible Python environment, trained model and spectra/precursor metadata arranged
    according to the example notebook's input interface.
  considerations:
  - Class coverage and domain differences from the curated training spectra affect results. Inspect mixed/chimeric
    spectra and score interpretation before using labels in downstream networks.
common_uses:
- A Python package for machine-learning prediction of lipid subclasses from tandem mass spectra using
  curated lipid MS/MS reference data.
publications:
