$schema: ../../schemas/tool.schema.json
slug: fasst
name: FASST
summary: Accelerated indexed infrastructure for searching very large collections of tandem mass spectra, enabling
  current GNPS2 repository-scale search services to return results at billion-spectrum scale.
description: FASST provides fast, indexed tandem mass-spectral searching used by the current GNPS2 repository-search
  ecosystem. The underlying fast-search approach was developed to overcome the scaling limits of earlier MASST and
  networking implementations as public metabolomics repositories grew to hundreds of millions and billions of spectra.
  FASST-based indexes now support MASST and domain-specific services, while FASST Records/FASSTrecords links large-scale
  spectral matches with harmonized repository metadata for higher-level search applications such as StructureMASST.
links:
  primary: https://fasst.gnps2.org/fastsearch/
  web_app: https://fasst.gnps2.org/fastsearch/
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/api/
