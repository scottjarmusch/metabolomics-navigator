$schema: ../../schemas/tool.schema.json
slug: ms-dial
name: MS-DIAL
summary: A graphical and command-line workbench for untargeted metabolomics and lipidomics data processing across
  multiple chromatography and mass spectrometry platforms.
links:
  primary: https://systemsomicslab.github.io/compms/msdial/main
  homepage: https://systemsomicslab.github.io/compms/msdial/main
  repository: https://github.com/systemsomicslab/MsdialWorkbench
  documentation: https://systemsomicslab.github.io/msdial5tutorial/
resource_types:
- software_application
functions:
  primary: preprocessing
  secondary:
  - normalization
  - annotation_identification
  - spectral_analysis
  - statistics
  - visualization_reporting
  capabilities:
  - peak_detection
  - spectral_deconvolution
  - retention_time_alignment
  - gap_filling
  - adduct_isotope_grouping
  - library_matching
  - ms2_processing
  - multivariate_statistics
platforms:
- lc_ms
- gc_ms
- ce_ms
- direct_infusion_ms
- maldi_ms
analysis_types:
- untargeted
- lipidomics
- stable_isotope_tracing
- metabolite_profiling
interfaces:
- desktop_gui
- command_line
access:
  model: source_available
  notes: The software, source, and associated libraries are publicly accessible; users should confirm the license
    and terms that apply to the specific component and version they use.
technical:
  operating_systems:
  - windows
  programming_languages:
  - C#
  api_available: false
data:
  input_types:
  - raw_instrument_data
  - spectra
  - spectral_library
  output_types:
  - feature_table
  - spectra
  - compound_list
  - statistical_results
  input_formats:
  - vendor_raw
  - mzml
  - netcdf
  - msp
  output_formats:
  - csv_tsv
  - msp
  - mgf
  - mztab_m
publications:
- doi: 10.1038/s41587-020-0531-2
  type: methods
  citation: Tsugawa H, Ikeda K, Takahashi M, et al. A lipidome atlas in MS-DIAL 4. Nat Biotechnol 38, 1159-1163
    (2020).
  note: Introduces MS-DIAL 4 alongside the lipidome atlas; retained as a direct software update.
- doi: 10.1038/nmeth.3393
  citation: 'Tsugawa H, Cajka T, Kind T, et al. MS-DIAL: data-independent MS/MS deconvolution for comprehensive
    metabolome analysis. Nat Methods 12, 523-526 (2015).'
  type: primary
common_uses:
- Process untargeted LC-MS, GC-MS, and lipidomics datasets through a graphical workflow.
- Deconvolute data-independent MS/MS spectra and match features against spectral libraries.
- Export aligned abundances and representative spectra for downstream analysis while preserving feature IDs.
related_tools:
- slug: mzmine
  relationship: alternative
- slug: gnps
  relationship: integration
maintenance:
  status: active
  last_checked: '2026-08-21'
credits: []
provenance:
  submitted_by: curator
  developer_verified: false
  notes: 'Documentation-based editorial pass on 6 September 2026: scope, interpretation limits and practical use
    reviewed against the linked official documentation and cited literature. Software execution, service availability
    and developer verification were not assessed.'
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-08-04'
  updated_at: '2026-09-08'
  last_verified: '2026-08-21'
  last_editorial_review: '2026-09-06'
scope:
  designed_for:
  - Broad untargeted metabolomics and lipidomics processing through a graphical workflow across several chromatography
    and MS acquisition modes.
  - Datasets requiring deconvolution and interpretation of data-independent or all-ion MS/MS signals.
  requirements:
  - Users should confirm current operating-system support and input-format compatibility for the version they install.
  considerations:
  - Large libraries and highly permissive annotation settings can increase candidate identifications; confidence
    levels and library provenance should be reported.
  - For lipidomics, report the structural level supported by the fragmentation evidence; review deconvolution and
    retention information for ambiguous features.
  not_designed_for:
  - Treating all library annotations as equally resolved molecular structures.
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - full_scan
  - dda
  - dia
  - all_ion
  ion_mobility: supported
description: MS-DIAL is a metabolomics and lipidomics workbench designed for broad-spectrum processing of chromatography–mass-spectrometry
  datasets. It combines peak detection, deconvolution, alignment, spectral annotation, normalization, statistics,
  and visualization, with particular support for data-independent MS/MS processing and lipid annotation.
aliases:
- MSDIAL
- MS Dial
