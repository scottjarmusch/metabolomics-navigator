description: LipiDetective predicts molecular lipid species in standardized shorthand notation from tandem
  spectra using a transformer model. It offers model training with prepared data and inference for supported
  spectra, providing a complementary source of annotation evidence.
scope:
  designed_for:
  - A deep-learning framework for identifying molecular lipid species from tandem mass spectra.
  not_designed_for:
  - Confirming double-bond positions or stereochemistry not resolved by the model, or accepting every
    generated lipid name without checking precursor compatibility.
  requirements:
  - Python environment, YAML configuration and trained checkpoint; the documented training route uses
    HDF5 data and prediction uses mzML files.
  considerations:
  - Training-set lipid/adduct and instrument coverage affect performance. Inspect predictions against
    precursor mass and diagnostic fragments; the current paper discusses training bias and missing hard
    precursor-mass constraints.
common_uses:
- A deep-learning framework for identifying molecular lipid species from tandem mass spectra.
publications:
- doi: 10.1093/bib/bbag378
  type: primary
  citation: 'LipiDetective: a deep learning model for the identification of molecular lipid species in
