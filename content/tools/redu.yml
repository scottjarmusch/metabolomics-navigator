$schema: ../../schemas/tool.schema.json
slug: redu
name: ReDU
acronym: ReDU
summary: A repository-scale interface for finding, filtering, contextualizing, and reusing public tandem mass-spectrometry data through standardized sample metadata.
description: ReDU links standardized sample information with public tandem mass-spectrometry datasets, enabling researchers to locate public files by organism, biospecimen, phenotype, disease state, and other metadata and to select data for reanalysis or co-analysis through GNPS.
links:
  primary: https://redu.ucsd.edu/
  web_app: https://redu.ucsd.edu/
  documentation: https://ccms-ucsd.github.io/GNPSDocumentation/ReDU/
