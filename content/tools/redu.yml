$schema: ../../schemas/tool.schema.json
slug: redu
name: Pan-ReDU
acronym: Pan-ReDU
summary: A pan-repository metadata harmonization and search infrastructure for finding, contextualizing, downloading,
  and reanalyzing public metabolomics data across major repositories.
description: Pan-ReDU is the current expansion of ReDU for harmonizing controlled sample metadata and indexing public
  mass-spectrometry files across repositories including MetaboLights, Metabolomics Workbench/NMDR, and GNPS/MassIVE.
  It links harmonized metadata with persistent run identifiers, raw-file access, and indexed MS/MS searching so
  researchers can discover, download, co-analyze, and contextualize public metabolomics data across repository boundaries.
links:
  primary: https://redu.gnps2.org/
  web_app: https://redu.gnps2.org/
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/ReDU_overview/
