publications:
- doi: 10.1038/s41592-020-0916-7
  citation: 'Jarmusch AK, Wang M, Aceves CM, et al. ReDU: a framework to find and reanalyze public mass spectrometry
    data. Nature Methods 17, 901–904 (2020).'
  type: primary
common_uses:
- Filter public mass-spectrometry data by standardized organism, biospecimen, disease, phenotype, and other metadata.
- Select public datasets for GNPS reanalysis, co-analysis, or repository-scale hypothesis generation.
- Contextualize spectral matches from MASST or other public-data searches.
scope:
  designed_for:
  - Contextualizing and reusing public tandem mass-spectrometry data using standardized metadata.
  requirements:
  - Repository records need sufficiently structured sample information to support the desired query.
  considerations:
  - Metadata completeness varies among historical public datasets.
