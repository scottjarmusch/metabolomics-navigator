    data. Nature Methods 17, 901–904 (2020).'
  type: primary
- doi: 10.1038/s41467-025-60067-y
  citation: El Abiead Y, Strobel M, Payne T, et al. Enabling pan-repository reanalysis for big data science of public
    metabolomics data. Nature Communications 16, 4838 (2025).
  type: primary
common_uses:
- Find public metabolomics files by harmonized organism, biospecimen, disease, phenotype, and other controlled metadata.
- Discover and download files across MetaboLights, Metabolomics Workbench/NMDR, and GNPS/MassIVE using a common
  metadata layer.
- Contextualize MASST/FASST spectral matches across repositories and prepare public datasets for reanalysis or co-analysis.
- Assemble a public-data cohort using sample metadata, then retrieve files for a documented reanalysis.
scope:
  designed_for:
  - Pan-repository discovery, contextualization, and reuse of public mass-spectrometry data using harmonized metadata
    and file identifiers.
  requirements:
  - Repository records need sufficiently structured sample information to support the desired query.
  considerations:
  - Metadata completeness and harmonization quality remain dependent on the information available in the source
    repositories and historical submissions.
  - Repository coverage and indexed file counts evolve as Pan-ReDU is updated.
  - Save the selected file identifiers and harmonized metadata with the analysis; harmonization does not make experimental
    protocols equivalent.
  not_designed_for:
  - Replacing primary repository records or correcting every missing or inconsistent sample annotation.
