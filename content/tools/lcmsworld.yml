description: lcmsWorld is an interactive three-dimensional viewer for LC-MS data. It converts supported
  acquisitions into a streamed visualization file, allowing users to rotate and inspect the mass/retention-time
  landscape and overlay supplied annotations.
scope:
  designed_for:
  - lcmsWorld is an interactive three-dimensional viewer for LC-MS data.
  not_designed_for:
  - Automatic alignment, ion-mobility analysis or metabolite identification; these are not established
    by the displayed data landscape.
  requirements:
  - OpenGL 3.0 or newer, adequate disk space and RAM; Windows releases are supplied, Linux requires compilation
    and macOS builds are documented as needing attention.
  considerations:
  - Initial loading creates an lcms cache file. Thermo RAW reading additionally depends on the 64-bit
    .NET reader and platform compatibility.
common_uses:
- lcmsWorld is an interactive three-dimensional viewer for LC-MS data.
publications:
- doi: 10.1021/acs.jproteome.0c00618
