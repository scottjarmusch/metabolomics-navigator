$schema: ../../schemas/tool.schema.json
slug: mzquality
name: mzQuality
summary: An R package for metabolomics study quality control, including outlier detection, pooled-QC batch
  correction, reliability filtering, diagnostic visualization, and reporting.
links:
  primary: https://github.com/hankemeierlab/mzQuality
  repository: https://github.com/hankemeierlab/mzQuality
  documentation: https://hankemeierlab.github.io/mzQuality/
resource_types:
- programming_package
functions:
  primary: quality_control
  secondary:
  - normalization
  - visualization_reporting
  - quantification
  capabilities:
  - batch_effect_correction
  - qc_drift_correction
  - calibration_curve
platforms:
- platform_independent
analysis_types:
- targeted
- untargeted
interfaces:
- r_package
access:
  model: open_source
  license: GPL-3.0
  notes: GPL-3.0 R package. The companion mzQualityDashboard is a separately installed interactive front
    end; it is not part of every package-only analysis.
technical:
  operating_systems:
  - windows
  - macos
  - linux
  - cross_platform
  programming_languages:
  - R
data:
  input_types:
  - feature_table
  - sample_metadata
  output_types:
  - feature_table
  - report
  - statistical_results
  input_formats:
  - csv_tsv
  other_output_formats:
  - SummarizedExperiment with metrics, selection flags and plot objects
publications:
- doi: 10.1021/jasms.5c00073
  type: primary
  citation: 'mzQuality: An Open-Source Software Tool for Quality Monitoring and Reporting of Targeted
    Mass Spectrometry Measurements. Journal of the American Society for Mass Spectrometry (2025).'
common_uses:
- Flag unreliable compounds and samples before downstream analysis.
- Apply pooled-study-QC-based batch correction and inspect batch behavior.
- Generate QC plots and reporting outputs for processed metabolomics tables.
maintenance:
  status: unclear
  repository_last_activity: '2026-08-11'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - Quality assessment and filtering of processed metabolomics studies represented as tabular abundance
    data.
  considerations:
  - Thresholds and reference-sample design determine which metrics are meaningful; flagged observations
    need experimental context before exclusion.
  not_designed_for:
  - Raw spectral feature extraction or correction of study designs lacking the reference samples required
    by a selected metric.
  requirements:
  - R/Bioconductor dependencies and correctly structured tabular data or a SummarizedExperiment; pooled
    study-QC samples are needed for QC-based correction and calibrants for concentration calculations.
description: mzQuality evaluates processed quantitative MS studies using compound abundances, sample annotations
  and QC information. It computes QC metrics, supports pooled-QC batch correction and calibration-based
  quantification, and flags compounds or samples for inspection.
