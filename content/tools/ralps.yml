- Harmonize multiple metabolomics batches using embedded shared reference samples.
maintenance:
  status: unclear
  repository_last_activity: '2023-06-26'
  last_checked: '2026-10-27'
  notes: Repository state checked; commit recency is not operational validation or proof of ongoing support.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official repository documentation, package/license metadata and
    primary publication identity on 2026-10-27. Editorial source review only; no software execution or
    independent benchmark. See docs/enveda-expansion-review-2026-10-27-batch2.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - An R-based regularized adversarial-learning method for harmonizing metabolomics batches using shared
    reference samples while preserving biological similarity structure.
  not_designed_for:
  - Replacing the preceding within-batch drift correction or inferring batch effects without the required
    reference information.
  requirements:
  - The documented Python/PyTorch environment, an abundance CSV, batch/replicate metadata and configuration
    file; reference replicate arrangements must connect the batches being harmonized.
  considerations:
  - Training and parameter selection affect the reconstructed data. Check reference-sample agreement,
    variance and biological signal preservation; distinguish regularization replicates from evaluation
    benchmarks.
description: RALPS harmonizes batches of quantified metabolomics data using regularized adversarial learning
  and shared reference measurements. It targets inter-batch variation after each batch has first been
  normalized for within-batch problems.
