description: An R package for Taxonomically Informed Metabolite Annotation. The workflow combines processed
  feature information and fragmentation spectra with organism metadata and structure-organism evidence. External
  annotations and custom libraries can supplement the workflow; resulting candidates require interpretation
  rather than being treated as confirmed identities.
data:
  input_types:
  - feature_table
  - spectra
  - sample_metadata
  output_types:
  - compound_list
  - report
  input_formats:
  - csv_tsv
  - mgf
  output_formats:
  - other
  other_output_formats:
  - Workflow files in .tima/data; exact tables depend on the selected workflow.
