description: ISFrag recognizes candidate in-source fragments in LC-MS data by combining feature relationships
  and available MS/MS evidence. Its R workflow accepts XCMS-derived features or a custom peak table and
  supports multiple levels of fragment annotation.
scope:
  designed_for:
  - ISFrag recognizes candidate in-source fragments in LC-MS data by combining feature relationships and
    available MS/MS evidence.
  not_designed_for:
  - Confirming a metabolite structure from a coeluting feature relationship alone or automatically deleting
    all proposed fragments.
  requirements:
  - R and documented XCMS dependencies, mzXML files or correctly ordered CSV peak tables; retention times
    must use seconds and MS/MS evidence must match the selected workflow.
  considerations:
  - Adduct/isotope processing through CAMERA belongs to the XCMS route. Distinguish evidence levels and
    retain ambiguous coeluting alternatives.
common_uses:
- ISFrag recognizes candidate in-source fragments in LC-MS data by combining feature relationships and
  available MS/MS evidence.
publications:
- doi: 10.1021/acs.analchem.1c01644
  type: primary
  citation: 'ISFrag: De Novo Recognition of In-Source Fragments for Liquid Chromatography–Mass Spectrometry
    Data. Analytical Chemistry (2021).'
