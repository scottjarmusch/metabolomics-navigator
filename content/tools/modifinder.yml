publications:
- doi: 10.1021/jasms.4c00061
  citation: 'Zare Shahneh MR, Strobel M, Vitale GA, et al. ModiFinder: Tandem Mass Spectral Alignment Enables Structural
    Modification Site Localization. Journal of the American Society for Mass Spectrometry 35, 2564–2578 (2024).'
  type: primary
common_uses:
- Localize likely atom-level positions of a structural modification between a known molecule and a related unknown
  spectrum.
- Interpret analog-library or molecular-network neighbors with a known reference structure.
- Prioritize structural hypotheses for modified natural products, metabolites, or transformation products.
scope:
  designed_for:
  - MS/MS pairs representing structurally related molecules where one structure is known and the other differs by
    a modification.
  requirements:
  - Paired MS/MS spectra and a known chemical structure for the reference molecule.
  considerations:
  - Localization is computational evidence and does not establish a complete unknown structure or stereochemistry.
  - Performance depends on informative shared/shifted fragments and spectral quality.
