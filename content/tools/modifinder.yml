$schema: ../../schemas/tool.schema.json
slug: modifinder
name: ModiFinder
summary: A GNPS2-associated computational tool for localizing structural modification sites by aligning MS/MS spectra
  of a known compound and a structurally related unknown analogue.
description: ModiFinder compares tandem mass spectra from structurally related known and unknown molecules, focusing
  on shifted fragment peaks that can indicate which part of the known structure contains a modification. It aggregates
  fragment-level evidence into atom-level scores that highlight likely modification sites. Current implementations
  include an interactive GNPS2 web interface, high-throughput workflows, and programmatic components.
links:
  primary: https://apps.gnps2.org/modifinder
  web_app: https://apps.gnps2.org/modifinder
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/api/
