$schema: ../../schemas/tool.schema.json
slug: asari
name: asari
summary: Process high-resolution mass-spectrometry data into aligned feature tables.
description: Asari uses mass alignment and a composite representation of chromatographic signals to extract
  features across samples. Its default workflow focuses on LC-MS feature processing.
links:
  primary: https://github.com/shuzhao-li-lab/asari
  documentation: https://github.com/shuzhao-li-lab/asari
  repository: https://github.com/shuzhao-li-lab/asari
resource_types:
- programming_package
functions:
  primary: preprocessing
  capabilities:
  - peak_detection
  - retention_time_alignment
platforms:
- lc_ms
interfaces:
- python_package
- command_line
access:
  model: source_available
  notes: Source and installation instructions are public; consult the repository license for the version used.
data:
  input_types:
  - spectra
  output_types:
  - feature_table
  input_formats:
  - mzml
  output_formats:
  - csv_tsv
  - json
publications:
- citation: 'Li et al. Asari: a scalable and reproducible workflow for metabolomics data processing. Nature
    Communications 14, 4113 (2023).'
  type: primary
  doi: 10.1038/s41467-023-39889-1
common_uses:
- Build a feature table from centroided LC-MS files.
- Prepare data for downstream quality control and statistics.
scope:
  designed_for:
  - Build a feature table from centroided LC-MS files.
  not_designed_for:
  - Assigning confirmed chemical structures from feature detection alone.
  requirements:
  - Centroided mzML data and a compatible Python environment.
  considerations:
  - Check mass tolerances, chromatography and acquisition mode against the workflow; default processing and
    specialized workflows differ.
credits: []
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Documentation-based editorial review on 7 September 2026. Scope and limitations summarize the linked
    official sources; software execution and developer verification were not assessed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-07'
  updated_at: '2026-09-07'
  last_editorial_review: '2026-09-07'
related_tools:
- slug: xcms
  relationship: complementary
- slug: mzmine
  relationship: complementary
