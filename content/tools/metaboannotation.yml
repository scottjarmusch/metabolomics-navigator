$schema: ../../schemas/tool.schema.json
slug: metaboannotation
name: MetaboAnnotation
summary: Match metabolomics features and spectra against reference values through a unified R interface.
description: MetaboAnnotation supports mass matching, matching with retention times and spectral-library comparisons,
  with data objects that retain query-reference relationships.
links:
  primary: https://bioconductor.org/packages/MetaboAnnotation/
  documentation: https://bioconductor.org/packages/MetaboAnnotation/
resource_types:
- programming_package
functions:
  primary: annotation_identification
  capabilities:
  - library_matching
  - structure_database_search
platforms:
- lc_ms
interfaces:
- r_package
access:
  model: open_source
  notes: Artistic-2.0 package; reference-data licensing is separate.
data:
  input_types:
  - feature_table
  - spectra
  - spectral_library
  output_types:
  - compound_list
  input_formats:
  - other
  output_formats:
  - other
  other_input_formats:
  - R feature tables, Spectra and reference objects
  other_output_formats:
  - Matched query-reference objects
publications:
- citation: 'MetaboAnnotation developers. MetaboAnnotation: Utilities for Annotation of Metabolomics Data.
    Bioconductor package record.'
  type: other
  doi: 10.18129/B9.bioc.MetaboAnnotation
common_uses:
- Create tentative annotations from reference masses.
- Manage spectral matches within a Spectra-based workflow.
scope:
  designed_for:
  - Create tentative annotations from reference masses.
  not_designed_for:
  - Guaranteeing structural identity from a mass match.
  requirements:
  - R/Bioconductor, query features or spectra, and suitable reference data.
  considerations:
  - Use retention information only when analytically comparable; report matching thresholds and evidence levels.
credits: []
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Documentation-based editorial review on 7 September 2026. Scope and limitations summarize the linked
    official sources; software execution and developer verification were not assessed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-07'
  updated_at: '2026-09-07'
  last_editorial_review: '2026-09-07'
related_tools:
- slug: spectra
  relationship: complementary
- slug: metid
  relationship: complementary
