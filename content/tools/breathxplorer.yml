  notes: Repository state checked; commit recency is not operational validation or proof of ongoing support.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official repository documentation, package/license metadata and
    primary publication identity on 2026-10-27. Editorial source review only; no software execution or
    independent benchmark. See docs/enveda-expansion-review-2026-10-27-batch3.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
description: breathXplorer processes high-resolution breath mass-spectrometry data with feature extraction,
  alignment and breath-recognition functions. It produces sample-level or aligned feature tables and can
  export tandem spectra for further annotation.
scope:
  designed_for:
  - breathXplorer processes high-resolution breath mass-spectrometry data with feature extraction, alignment
    and breath-recognition functions.
  not_designed_for:
  - Automatic clinical interpretation of breath biomarkers or a validated replacement for every LC-MS
    processing workflow.
  requirements:
  - Python 3.7-3.10 with the documented dependencies and mzML or mzXML breath-MS files; configure the
    expected breath count for methods that require it.
  considerations:
  - Breath-recognition settings and the selected extraction algorithm affect features and alignment. Review
    breath segmentation and feature quality before biological interpretation.
common_uses:
- breathXplorer processes high-resolution breath mass-spectrometry data with feature extraction, alignment
  and breath-recognition functions.
publications:
- doi: 10.1021/jasms.4c00152
  type: primary
  citation: 'BreathXplorer: Processing Online Breathomics Data Generated from Direct Analysis Using High-Resolution
    Mass Spectrometry. Journal of the American Society for Mass Spectrometry (2024).'
