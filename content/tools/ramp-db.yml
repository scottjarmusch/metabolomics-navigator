  relationship: complementary
  note: Complementary pathway context; identifier coverage and analysis methods differ.
- slug: reactome
  relationship: complementary
  note: Complementary pathway context; identifier coverage and analysis methods differ.
- slug: wikipathways
  relationship: complementary
  note: Complementary pathway context; identifier coverage and analysis methods differ.
