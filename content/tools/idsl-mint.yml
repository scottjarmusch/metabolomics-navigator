description: IDSL_MINT provides transformer-based workflows connecting tandem mass spectra and molecular
  representations. Documented modules include MS/MS-to-fingerprint prediction, structure generation and
  reverse spectrum prediction, with YAML-controlled training and prediction workflows.
scope:
  designed_for:
  - IDSL_MINT provides transformer-based workflows connecting tandem mass spectra and molecular representations.
  not_designed_for:
  - Definitive structure confirmation or evidence that every documented module was evaluated in the original
    fingerprint-prediction paper.
  requirements:
  - Python with PyTorch, RDKit and documented dependencies; prepared MSP/structure data, a module-specific
    YAML configuration and suitable trained weights or training data.
  considerations:
  - Select the representation and model for the task. Fingerprint accuracy, structure generation and predicted
    spectra have different validation needs and chemical-domain limits.
common_uses:
- IDSL_MINT provides transformer-based workflows connecting tandem mass spectra and molecular representations.
