  output_types:
  - spectra
  - feature_table
  input_formats:
  - other
  output_formats:
  - other
  other_input_formats:
  - Spectra and MSnbase quantitative objects
  other_output_formats:
  - MSnbase spectral and quantitative objects
publications:
- doi: 10.1093/bioinformatics/btr645
  citation: Gatto L, Lilley KS. MSnbase-an R/Bioconductor package for isobaric tagged mass spectrometry data
    visualization, processing and quantitation. Bioinformatics 28, 288-289 (2012).
  type: primary
  note: Foundational MSnbase software paper; the original publication focuses on isobaric tagged mass spectrometry.
