slug: msnbase
name: MSnbase
summary: Manipulate, process and visualize mass-spectrometry data within R.
description: MSnbase supplies data classes and functions spanning spectra and quantitative measurements. It
  is infrastructure used in analytical workflows, including metabolomics.
links:
  primary: https://bioconductor.org/packages/MSnbase/
  documentation: https://bioconductor.org/packages/MSnbase/
