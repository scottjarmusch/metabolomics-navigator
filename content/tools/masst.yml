publications:
- doi: 10.1038/s41587-019-0375-9
  citation: Wang M, Jarmusch AK, Vargas F, et al. Mass spectrometry searches using MASST. Nature Biotechnology 38,
    23–26 (2020).
  type: primary
common_uses:
- Search a query MS/MS spectrum across public metabolomics datasets and spectral libraries.
- Identify datasets, files, or sample contexts in which a molecule or close spectral analogue may occur.
- Use repository-scale matches as a starting point for biological, environmental, natural-product, or reverse-metabolomics
  hypotheses.
scope:
  designed_for:
  - Repository-scale contextualization of individual MS/MS spectra.
  requirements:
  - A centroided query MS/MS spectrum with precursor information.
  considerations:
  - Search tolerances, cosine/similarity thresholds, and repository composition affect which matches are returned.
  - A spectral match indicates MS/MS similarity and possible occurrence; it is not by itself definitive structural
    confirmation.
  - The current GNPS2 implementation is substantially faster than the original MASST workflow and also supports
    programmatic access described in the current documentation.
