$schema: ../../schemas/tool.schema.json
slug: masst
name: MASST
acronym: MASST
summary: A GNPS repository-scale spectral search service for finding where a query MS/MS spectrum or related spectra
  occur across public metabolomics data and spectral libraries.
description: MASST (Mass Spectrometry Search Tool) searches a query tandem mass spectrum against public metabolomics
  data and spectral libraries to identify datasets and files containing related fragmentation spectra. It can be
  used to place a spectrum in biological, environmental, or clinical context and can be combined with standardized
  metadata resources such as ReDU.
links:
  primary: https://masst.gnps2.org/
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/masst/
  web_app: https://masst.gnps2.org/
  repository: https://github.com/CCMS-UCSD/GNPS_Workflows/tree/master/search_single_spectrum
resource_types:
- web_service
