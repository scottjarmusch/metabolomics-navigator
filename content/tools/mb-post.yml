  notes: "MB-POST is a mass spectrometry data repository for metabolomics. It consists of a high-speed file upload process, flexible file management system and easy-to-use interfaces. \nUsers can release their \"raw/processed\" data via this site with a unique identifier number for the paper publication. Users also can suspend (or \"embargo\") their data until their paper is published. \nThe file transfer from users' computer to our repository server is very fast and uses only web browsers – it does not require installing any additional software."
