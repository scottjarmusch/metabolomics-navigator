$schema: ../../schemas/tool.schema.json
slug: lipidoz
name: LipidOz
summary: Determine lipid carbon-carbon double-bond positions from ozone-induced dissociation mass-spectrometry data.
description: LipidOz is a Python utility and graphical application for automated interpretation of ozone-induced dissociation (OzID) mass-spectrometry data. It uses isotope-distribution evidence from OzID fragments to localize lipid double bonds and supports both LC-OzID-IMS-MS and infusion-style workflows.
