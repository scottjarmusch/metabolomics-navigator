publications:
- doi: 10.1038/s42004-023-00867-9
  citation: Ross DH, et al. LipidOz enables automated elucidation of lipid carbon-carbon double bond positions from ozone-induced dissociation mass spectrometry data. Communications Chemistry (2023).
  type: primary
common_uses:
- Localize carbon-carbon double-bond positions in lipids measured by OzID mass spectrometry.
- Apply targeted isotope-scoring workflows to LC-OzID-IMS-MS or infusion data.
scope:
  designed_for:
  - Lipid structural annotation at the double-bond-position level using OzID fragment evidence.
  not_designed_for:
  - General lipid discovery without OzID-compatible measurements.
  requirements:
  - OzID mass-spectrometry data and a lipid target list or compatible workflow input.
  considerations:
  - Structural conclusions depend on the presence and quality of diagnostic OzID fragments and should be interpreted with the acquisition context.
