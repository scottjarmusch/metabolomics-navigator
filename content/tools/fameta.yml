$schema: ../../schemas/tool.schema.json
slug: fameta
name: FAMetA
summary: Estimate fatty-acid synthesis, import, elongation and desaturation from carbon-13
  isotopologue profiles.
description: FAMetA is an R package for model-based fatty-acid metabolic analysis.
  The publication also describes a web application. Its workflow uses LipidMS for
  preprocessing and accucor for natural-abundance correction before fitting fatty-acid
  metabolic contributions.
links:
  primary: https://github.com/maialba3/FAMetA
  repository: https://github.com/maialba3/FAMetA
  documentation: https://github.com/maialba3/FAMetA
platforms:
- lc_ms
interfaces:
- r_package
resource_types:
- programming_package
functions:
  primary: isotope_tracing_flux
  capabilities:
  - flux_estimation
access:
  model: open_source
  license: GPL-2.0-or-later
  notes: License declared as GPL (>= 2) in package DESCRIPTION. The paper describes
    a web app, but current hosted availability was not verified.
data:
  input_types:
  - isotope_tracing_data
  output_types:
  - statistical_results
  - report
  other_input_formats:
  - Fatty-acid carbon-13 mass-isotopologue profiles prepared for the R workflow
  other_output_formats:
  - Fitted fatty-acid metabolic contributions and graphical summaries
common_uses:
- Investigate fatty-acid metabolic contributions in tracer experiments.
scope:
  designed_for:
  - Model-based analysis of fatty-acid labeling.
  not_designed_for:
  - Untargeted structure identification or unrestricted whole-network flux analysis.
  requirements:
  - Suitable carbon-13 labeling data and the R/LipidMS/accucor dependencies.
  considerations:
  - Model assumptions, tracer choice and isotopologue measurement quality constrain
    interpretation.
publications:
- doi: 10.1093/bib/bbad064
  type: primary
  citation: 'FAMetA: a mass isotopologue-based tool for the comprehensive analysis
    of fatty acid metabolism. Briefings in Bioinformatics (2023).'
