description: SERDA applies denoising-autoencoder normalization to processed metabolomics data. Its R runner
  connects to a Python/Keras environment and uses an example spreadsheet layout for large-scale GC-MS
  normalization research.
scope:
  designed_for:
  - SERDA applies denoising-autoencoder normalization to processed metabolomics data.
  not_designed_for:
  - Isotope-tracing analysis, raw GC-MS deconvolution or guaranteed removal of technical variation without
    affecting biology.
  requirements:
  - A compatible R/reticulate/Keras/Python environment and input XLSX formatted according to the supplied
    example; update the runner's data-file path before execution.
  considerations:
  - The documented stack is old and needs compatibility checking. Evaluate normalization with appropriate
    QC and biological contrasts rather than relying only on a cleaner low-dimensional plot.
common_uses:
- SERDA applies denoising-autoencoder normalization to processed metabolomics data.
publications:
- doi: 10.3390/metabo13080944
  type: primary
