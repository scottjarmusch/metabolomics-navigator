$schema: ../../schemas/tool.schema.json
slug: nmrglue
name: nmrglue
summary: Read, transform, inspect and analyze NMR data in Python.
description: nmrglue provides file readers and numerical routines for spectral processing, peak picking, integration
  and multidimensional lineshape fitting, alongside NumPy and SciPy.
links:
  primary: https://github.com/jjhelmus/nmrglue
  documentation: https://github.com/jjhelmus/nmrglue
  repository: https://github.com/jjhelmus/nmrglue
resource_types:
- programming_package
functions:
  primary: preprocessing
  capabilities:
  - peak_detection
platforms:
- nmr
interfaces:
- python_package
access:
  model: open_source
  notes: BSD-3-Clause software.
data:
  input_types:
  - nmr_spectra
  output_types:
  - nmr_spectra
  - report
  input_formats:
  - other
  output_formats:
  - other
  other_input_formats:
  - Bruker, Varian, NMRPipe and Sparky data
  other_output_formats:
  - NMR files and NumPy arrays
publications:
- citation: 'Helmus JJ, Jaroniec CP. Nmrglue: an open source Python package for the analysis of multidimensional
    NMR data. J Biomol NMR 55, 355-367 (2013).'
  type: primary
  doi: 10.1007/s10858-013-9718-x
common_uses:
- Automate NMR processing across spectra.
- Convert supported NMR formats and create analysis scripts.
scope:
  designed_for:
  - Automate NMR processing across spectra.
  not_designed_for:
  - Providing a complete, automatic metabolite-identification workflow.
  requirements:
  - Python and compatible NMR files; processing knowledge is needed to define a workflow.
  considerations:
  - Validate phase, baseline and reference choices before comparing integrated signals between samples.
