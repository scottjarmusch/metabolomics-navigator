  last_checked: '2026-10-05'
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-05'
  updated_at: '2026-10-05'
  last_verified: '2026-10-05'
  last_editorial_review: '2026-10-05'
aliases:
