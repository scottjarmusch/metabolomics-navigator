description: MS-BART models molecular representations and mass-spectral information with a unified language-model
  workflow for structure elucidation. Its research pipeline includes molecular pretraining, spectral fine-tuning,
  chemical-feedback alignment and candidate generation.
scope:
  designed_for:
  - MS-BART models molecular representations and mass-spectral information with a unified language-model
    workflow for structure elucidation.
  not_designed_for:
  - A turnkey raw-MS identification application or guaranteed correct structures for spectra outside the
    model domain.
  requirements:
  - The documented Python 3.9 environment, downloaded checkpoints/data and fingerprint preprocessing resources;
    review configuration paths and evaluation-script settings before use.
  considerations:
  - README documents path and beam-variable issues in evaluation scripts. Preserve evaluation splits and
    distinguish predicted fingerprints and generated structures from experimental confirmation.
