description: SMART is an R/GUI environment for metabolomics data processing, QC and statistical analysis.
  Its modules connect data import and peak analysis with transformations, batch exploration, association/classification
  analysis and optional concentration calibration.
scope:
  designed_for:
  - An R-based graphical metabolomics analysis suite spanning data import, peak analysis and annotation,
    preprocessing, quality control, batch-effect assessment, statistics, and visualization.
  not_designed_for:
  - The unrelated spatial-metabolomics SMART formula-ranking application or automatic justification of
    every statistical model and vendor format.
  requirements:
  - The distribution's R/GUI environment, module-compatible raw or processed data and sample/design metadata;
    calibration and targeted modules additionally require their corresponding reference information.
  considerations:
  - Import and analysis requirements vary by module and release. Current README citation text is stale
    about SMART 2.0 publication; cite the verified published update and distinguish legacy distribution
    terms.
publications:
- doi: 10.1021/acs.analchem.6b00603
  type: primary
  citation: 'SMART: Statistical Metabolomics Analysis—An R Tool. Analytical Chemistry (2016).'
- doi: 10.1021/acs.analchem.5c03225
  type: primary
  citation: 'SMART 2.0 Statistical Metabolomics Analysis: An R Tool 2.0. Analytical Chemistry (2025).'
aliases:
