scope:
  designed_for:
  - LPPtiger 2 supports epilipidomics by predicting modified lipid candidates and their fragmentation
    patterns, preparing acquisition inclusion lists and annotating modified lipids in LC-MS experiments.
  not_designed_for:
  - General identification of every lipid class or definitive localization of all oxidation and modification
    sites.
  requirements:
  - A supported desktop executable or documented Python environment, configured lipid/modification rules
