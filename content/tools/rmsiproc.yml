  - feature_table
  input_formats:
  - imzml
  other_input_formats:
  - rMSI TAR format
publications:
- citation: 'Ràfols P, Heijs B, Del Castillo E, et al. rMSIproc: an R package for mass spectrometry imaging data processing.
    Bioinformatics 36, 3618–3619 (2020).'
  type: primary
  doi: 10.1093/bioinformatics/btaa142
