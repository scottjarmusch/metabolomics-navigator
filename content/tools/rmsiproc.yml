slug: rmsiproc
name: rMSIproc
summary: Open-source R/C++ package for large-scale MSI preprocessing, including smoothing, alignment, recalibration, normalization,
  peak picking and binning.
links:
  primary: https://github.com/prafols/rMSIproc
  documentation: https://github.com/prafols/rMSIproc
  repository: https://github.com/prafols/rMSIproc
resource_types:
- programming_package
functions:
  primary: preprocessing
  capabilities:
  - peak_detection
platforms:
- imaging_ms
interfaces:
- r_package
access:
  model: open_source
  license: GPL-3.0
  notes: R source installation requires compatible native dependencies. The documented GUI uses RGtk2; verify installation on the target operating system before planning an analysis.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Official repository README, DESCRIPTION and direct publication metadata reviewed on 2026-09-10. No installation or independent benchmark performed. Ongoing maintenance status has not been established.
