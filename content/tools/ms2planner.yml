  status: unclear
name: MS2Planner
platforms:
- lc_ms
provenance:
  developer_verified: false
  notes: Enveda intake candidate checked against official documentation, license information and primary
    publication on 2026-10-21. Editorial review only; no execution or independent benchmark.
  submitted_by: curator
publications:
- doi: 10.1093/bioinformatics/btab279
  type: primary
  citation: 'MS2Planner: improved fragmentation spectra coverage in untargeted mass spectrometry by iterative
    optimized data acquisition. Bioinformatics (2021).'
resource_types:
- workflow_pipeline
scope:
  designed_for:
  - MS2Planner computes acquisition paths from feature masses, retention times and signals. Companion
    scripts translate these paths into instrument inclusion lists.
  not_designed_for:
  - Real-time instrument control or retrospective metabolite identification.
  requirements:
  - Survey features with sample/background information and a configured Python environment.
  - Instrument-compatible inclusion-list export, repeat injections and reproducible chromatography.
  considerations:
  - Timing and isolation parameters must match the instrument; planned coverage does not guarantee usable
    MS/MS spectra.
