data:
  input_types:
  - feature_table
  output_types:
  - feature_table
  - report
  other_input_formats:
  - Prepared survey-feature table; optional MS1 mzML or mzTab for curve mode
  other_output_formats:
  - Text or CSV acquisition paths and a planning log
description: MS2Planner computes acquisition paths from feature masses, retention times and signals. Companion
  scripts translate these paths into instrument inclusion lists.
functions:
  primary: data_acquisition
  capabilities:
  - blank_filtering
interfaces:
- command_line
links:
  primary: https://github.com/mohimanilab/MS2Planner
