access:
  model: free_web_service
publications:
- doi: 10.1038/s41564-023-01575-9
  citation: 'Zuffa S, Schmid R, Bauermeister A, et al. microbeMASST: a taxonomically informed mass spectrometry
    search tool for microbial metabolomics data. Nature Microbiology 9, 336–345 (2024).'
  type: primary
common_uses:
- Associate unknown or known MS/MS spectra with potential microbial producers represented in monoculture reference
  data.
- Explore exact and analog spectral matches across bacterial, fungal, and archaeal taxonomy.
- Batch-query many spectra to annotate microbial context in larger untargeted datasets.
scope:
  designed_for:
  - Microbial-origin hypothesis generation and taxonomic contextualization of MS/MS features.
  requirements:
  - A query MS/MS spectrum provided as a USI, library identifier, peak list, or compatible batch input.
  considerations:
  - A spectral occurrence in a cultured microorganism supports producer/context hypotheses but does not establish
    biosynthetic origin in every sample.
  - Reference coverage is uneven across taxa and reflects community deposition and metadata curation.
