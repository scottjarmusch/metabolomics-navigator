$schema: ../../schemas/tool.schema.json
slug: microbemasst
name: microbeMASST
summary: A taxonomically informed GNPS search service that connects query MS/MS spectra to matching spectra from
  curated bacterial, fungal, and archaeal monoculture datasets.
description: microbeMASST is a domain-specific repository search resource that contextualizes known or unknown tandem
  mass spectra against a curated reference collection of microbial monoculture extracts. Searches use accelerated
  GNPS/FASST infrastructure and organize matches in taxonomic trees, helping users ask which cultured microorganisms
  have produced a compound or a spectrally related molecule. Batch-search code is also available for larger analyses.
links:
  primary: https://masst.gnps2.org/microbemasst/
  web_app: https://masst.gnps2.org/microbemasst/
  repository: https://github.com/robinschmid/microbe_masst
resource_types:
