description: DeepGCN-RT predicts small-molecule retention times from molecular graphs. The repository
  provides a pretrained inference command alongside research training and transfer-learning code associated
  with the published graph-convolutional model.
scope:
  designed_for:
  - DeepGCN-RT predicts small-molecule retention times from molecular graphs.
  not_designed_for:
  - Universal retention-time prediction across chromatographic methods without calibration or experimental
    validation.
  requirements:
  - The documented Python 3.9/3.10 environment, valid SMILES and the released checkpoint; select a compatible
    CPU or CUDA device.
  considerations:
  - Predictions reflect the training chromatographic domain. The README distinguishes maintained inference
    from historical training/transfer-learning scripts; the repository's smoke test is not an independent
    scientific benchmark.
common_uses:
- DeepGCN-RT predicts small-molecule retention times from molecular graphs.
