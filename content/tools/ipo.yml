$schema: ../../schemas/tool.schema.json
slug: ipo
name: IPO
summary: Optimize peak picking, retention-time correction and grouping parameters for XCMS.
description: IPO evaluates processing settings using isotope information and reproducibility across pooled-sample
  injections, helping replace arbitrary parameter selection.
links:
  primary: https://bioconductor.org/packages/IPO/
  documentation: https://bioconductor.org/packages/IPO/
resource_types:
- programming_package
functions:
  primary: preprocessing
  capabilities:
  - peak_detection
  - retention_time_alignment
platforms:
- lc_ms
interfaces:
- r_package
access:
  model: open_source
  notes: Open-source software; use the official installation, license and citation guidance for the selected
    release.
data:
  input_types:
  - spectra
  output_types:
  - report
  input_formats:
  - other
  output_formats:
  - other
  other_input_formats:
  - Files supported by the configured XCMS reader
  other_output_formats:
  - R lists of optimized parameters and scores
publications:
- citation: 'Libiseller G, Dvorzak M, Kleb U, et al. IPO: a tool for automated optimization of XCMS parameters.
    BMC Bioinformatics 16, 118 (2015).'
  type: primary
  doi: 10.1186/s12859-015-0562-8
common_uses:
- Tune an LC-HRMS method before processing a study.
- Compare candidate settings using representative QC injections.
scope:
  designed_for:
  - Tune an LC-HRMS method before processing a study.
  not_designed_for:
  - Replacing chromatogram inspection or guaranteeing a universally optimal parameter set.
  requirements:
  - R, compatible XCMS dependencies and representative optimization files.
  considerations:
  - Optimization reflects the samples and parameter ranges supplied; validate the chosen settings on the wider
    study.
credits: []
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Documentation-based editorial review on 7 September 2026. Scope and limitations summarize the linked
    official sources; software execution and developer verification were not assessed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-07'
  updated_at: '2026-09-08'
  last_editorial_review: '2026-09-07'
related_tools:
- slug: xcms
  relationship: complementary
