$schema: ../../schemas/tool.schema.json
slug: gnn-rt
name: GNN-RT
summary: Predict chromatographic retention times from molecular structures.
description: GNN-RT learns molecular-graph representations for retention-time prediction, with training
  and transfer-learning scripts for applying the model to a chromatographic dataset.
links:
  primary: https://github.com/Qiong-Yang/GNN-RT
  repository: https://github.com/Qiong-Yang/GNN-RT
  documentation: https://github.com/Qiong-Yang/GNN-RT#readme
platforms:
- lc_ms
interfaces:
- command_line
resource_types:
- software_application
functions:
  primary: annotation_identification
  capabilities:
  - retention_time_prediction
access:
  model: open_source
  notes: Access classification follows official repository license metadata; code and software execution
    were not tested.
  license: AGPL-3.0
data:
  input_types:
  - molecular_structures
  output_types:
  - report
  other_input_formats:
  - Molecular structures and measured retention times for training/adaptation
  other_output_formats:
  - Model-predicted retention times
common_uses:
- Predict chromatographic retention times from molecular structures.
scope:
  designed_for:
  - GNN-RT learns molecular-graph representations for retention-time prediction, with training and transfer-learning
    scripts for applying the model to a chromatographic dataset.
  not_designed_for:
  - Direct peak detection, structure confirmation or method-independent retention-time prediction.
  requirements:
  - Python, PyTorch, RDKit and data prepared for the provided scripts.
  - Training or transfer-learning data appropriate to the chromatographic method.
  considerations:
  - Predictions depend on chemical and chromatographic applicability; use them as supporting annotation
    evidence.
publications:
- doi: 10.1021/acs.analchem.0c04071
  type: primary
  citation: Prediction of Liquid Chromatographic Retention Time with Graph Neural Networks to Assist in
    Small Molecule Identification. Analytical Chemistry (2021).
