slug: gnps-feature-based-molecular-networking
name: GNPS2 Feature-Based Molecular Networking
summary: Dedicated GNPS2 workflow that combines an aligned LC-MS feature table with MS/MS spectra to build quantitative
  molecular networks.
links:
  primary: https://gnps2.org/workflowinput?workflowname=feature_based_molecular_networking_workflow
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/fbmn/
resource_types:
- workflow_pipeline
- web_service
functions:
  primary: molecular_networking
  capabilities:
  - library_matching
  - network_visualization
platforms:
- lc_ms
interfaces:
- web_app
access:
  model: free_web_service
  notes: GNPS2 is openly available to the academic community. The current GNPS2 documentation asks industry users
    to contact the maintainers or UC Riverside Technology Transfer regarding organizational access. Workflow submission
    requires a GNPS2 account.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Reviewed against GNPS2 documentation and the linked method publication on 2026-09-09. No analysis job was
    submitted and no independent benchmarking or developer verification is claimed.
