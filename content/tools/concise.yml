  last_editorial_review: '2026-10-27'
description: ConCISE propagates consensus chemical-class annotations by combining molecular-network relationships,
  library matches and in-silico class predictions. It accepts GNPS and CANOPUS-derived results through
  graphical, command-line or notebook workflows.
scope:
  designed_for:
  - ConCISE propagates consensus chemical-class annotations by combining molecular-network relationships,
    library matches and in-silico class predictions.
  not_designed_for:
  - Confirmed molecular structures or class assignments independent of the quality of the underlying network
    and source annotations.
  requirements:
  - Compatible library-match/GNPS task information, CANOPUS summary and network-node information with
    consistent feature identifiers; choose ClassyFire or NPClassifier ontology inputs.
  considerations:
  - README documents missing ClassyFire fields from GNPS and provides NPClassifier/manual-merge workarounds.
    Check ontology consistency and consensus thresholds; the macOS GUI is deprecated.
common_uses:
- ConCISE propagates consensus chemical-class annotations by combining molecular-network relationships,
  library matches and in-silico class predictions.
publications:
- doi: 10.3390/metabo12121275
  type: primary
  citation: 'ConCISE: Consensus Annotation Propagation of Ion Features in Untargeted Tandem Mass Spectrometry
    Combining Molecular Networking and In Silico Metabolite Structure Prediction. Metabolites (2022).'
