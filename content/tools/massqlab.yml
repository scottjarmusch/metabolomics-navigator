description: MassQLab applies named MassQL queries across a directory of mass-spectrometry data and summarizes
  results as tables and figures. It supports system-suitability and recurring MS1/MS2 query workflows
  through scripts, notebooks and an evolving GUI.
scope:
  designed_for:
  - MassQLab applies named MassQL queries across a directory of mass-spectrometry data and summarizes
    results as tables and figures.
  not_designed_for:
  - Automatic selection of scientifically meaningful queries or universal metabolite identification from
    a matched mass pattern.
  requirements:
  - Python dependencies, mzML files and named queries in JSON/CSV/XLSX with project configuration; optional
    vendor conversion requires an installed MSConvert executable.
  considerations:
  - The configured directory is processed as a whole. Review query tolerances, peak fitting and cache
    settings; standalone GUI development and documented background-process behavior affect use.
common_uses:
- MassQLab applies named MassQL queries across a directory of mass-spectrometry data and summarizes results
  as tables and figures.
