$schema: ../../schemas/tool.schema.json
slug: mzapy
name: mzapy
summary: Read, extract, calibrate, and visualize multidimensional mass-spectrometry data in Python, including LC-IM-MS datasets stored in MZA and selected vendor-supported formats.
description: mzapy is a Python package for accessing and manipulating multidimensional mass-spectrometry data. It was developed around MZA and supports data extraction, plotting, selected calibration tasks, signal processing, peak finding, and programmatic access to dimensions such as retention time, ion mobility, mass-to-charge ratio, and intensity. It is particularly useful for scripting LC-IM-MS workflows and for prototyping downstream analyses on data converted to MZA.
