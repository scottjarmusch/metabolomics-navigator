  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
description: PLSKO generates partial-least-squares-based knockoff variables and applies knockoff filtering
  for omics feature selection. Its R workflow includes single and aggregated filtering routes, importance
  statistics and selected-variable outputs.
scope:
  designed_for:
  - PLSKO generates partial-least-squares-based knockoff variables and applies knockoff filtering for
    omics feature selection.
  not_designed_for:
  - Causal biomarker discovery or unconditional false-discovery guarantees when knockoff/model assumptions
    are violated.
  requirements:
  - R and documented knockoff/mixOmics dependencies, a numeric predictor matrix, response vector and target
    false-discovery-rate setting; tune the knockoff construction for the data.
  considerations:
  - Assess exchangeability and model settings, distinguish predictive importance from causal effects and
    keep tuning/evaluation data appropriately separated.
common_uses:
- PLSKO generates partial-least-squares-based knockoff variables and applies knockoff filtering for omics
  feature selection.
publications:
- doi: 10.1093/bioinformatics/btaf475
  type: primary
  citation: 'PLSKO: a robust knockoff generator to control false discovery rate in omics variable selection.
    Bioinformatics (2025).'
