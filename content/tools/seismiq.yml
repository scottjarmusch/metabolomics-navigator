$schema: ../../schemas/tool.schema.json
slug: seismiq
name: SEISMiQ
summary: Generate candidate molecular structures from tandem spectra and a supplied molecular formula.
description: SEISMiQ is a generative structure-elucidation model developed for drug-substance impurities.
  Its released prediction workflow and CASMI checkpoints also support small-molecule MS/MS candidate generation.
links:
  primary: https://github.com/Boehringer-Ingelheim/seismiq
  repository: https://github.com/Boehringer-Ingelheim/seismiq
  documentation: https://github.com/Boehringer-Ingelheim/seismiq#prediction
platforms:
- lc_ms
interfaces:
- command_line
resource_types:
- programming_package
functions:
  primary: annotation_identification
  capabilities:
  - structure_elucidation
access:
  model: open_source
  license: Apache-2.0
  notes: License verified in the official repository. Code licensing does not establish the terms for
    every separately downloaded model or dataset.
data:
  input_types:
  - spectra
  - compound_list
  output_types:
  - molecular_structures
  other_input_formats:
  - JSON challenges containing an MS/MS peak list and sum formula
  other_output_formats:
  - CSV candidate SMILES and model scores
common_uses:
- Generate candidate molecular structures from tandem spectra and a supplied molecular formula.
scope:
  designed_for:
  - SEISMiQ is a generative structure-elucidation model developed for drug-substance impurities. Its released
    prediction workflow and CASMI checkpoints also support small-molecule MS/MS candidate generation.
  not_designed_for:
  - Unconstrained identification from spectra alone or proof of metabolite identity.
  requirements:
  - Python/Poetry environment, compatible model checkpoint and tokenizer.
  - MS/MS spectrum and molecular formula; sufficient memory or a suitable GPU.
  considerations:
  - Training and fine-tuning domains affect applicability to biological metabolites; do not infer universal
    metabolomics performance.
  - Optional substructure prompts and adduct assumptions must be appropriate for the sample.
publications:
- doi: 10.1039/d5dd00115c
  type: primary
  citation: Enhancing automated drug substance impurity structure elucidation from tandem mass spectra
    through transfer learning and domain knowledge. Digital Discovery (2025).
  note: Final peer-reviewed article replaces the differently titled intake preprint.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake candidate checked against official documentation, license information and primary
    publication on 2026-10-21. Editorial review only; no execution or independent benchmark.
maintenance:
