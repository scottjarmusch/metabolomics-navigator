slug: mzmine
name: MZmine
summary: An open-source desktop and command-line environment for feature detection, alignment, annotation, visualization,
  normalization, molecular networking preparation, and multimodal mass-spectrometry data processing.
description: MZmine is a modular open-source environment for mass-spectrometry data processing with graphical, batch,
  and command-line workflows. It supports LC-MS and LC-IMS-MS feature detection, alignment, quality filtering, normalization,
  ion and isotope grouping, spectral-library matching, lipid annotation, molecular/ion-identity networking, GC-EI-MS
  spectral deconvolution, and MS-imaging workflows, with direct exports to resources including GNPS, SIRIUS, and
  MetaboAnalyst.
