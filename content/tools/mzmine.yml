scope:
  designed_for:
  - Modular processing and inspection of untargeted LC-MS and LC-IMS-MS datasets, including feature-based workflows
    that retain links to MS/MS and ion-mobility information.
  - GC-EI-MS spectral deconvolution and alignment, MS-imaging workflows, and interactive or batch processing with
    exports to downstream annotation and molecular-networking resources.
  not_designed_for:
  - A replacement for every downstream structure-elucidation or statistical-analysis platform; specialist tools
    are commonly used after preprocessing.
  requirements:
  - Desktop installation; stable releases provide Windows, macOS, and Linux packages and include the required Java
    runtime.
  considerations:
  - Parameter choices for feature detection, resolving, alignment, normalization, and filtering remain experiment
    dependent and should be documented in reproducible batch files.
  - The 2024 Nature Protocols procedures were published for MZmine 3; current MZmine 4 workflows preserve the core
    concepts but interfaces and available modules continue to evolve, so current documentation should be consulted.
