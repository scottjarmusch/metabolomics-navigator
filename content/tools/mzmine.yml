common_uses:
- Detect, resolve, align, normalize, and filter features in untargeted LC-MS and LC-IMS-MS datasets.
- Process GC-EI-MS data using spectral deconvolution and alignment workflows.
- Process and visualize MS-imaging and ion-mobility data.
- Perform spectral-library, lipid, ion-identity, and network-based annotation and export results to GNPS, SIRIUS,
  or statistical tools.
