slug: mzmine
name: MZmine
summary: An open-source desktop and command-line environment for processing, visualizing, and annotating mass spectrometry-based metabolomics data.
description: MZmine is a modular environment for mass-spectrometry data processing with graphical and batch interfaces. It supports workflows spanning raw-data import, chromatogram construction, feature detection and resolving, alignment, ion and isotope grouping, quality filtering, visualization, spectral-library matching, and export to downstream annotation or networking resources.
