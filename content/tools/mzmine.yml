$schema: ../../schemas/tool.schema.json
slug: mzmine
name: MZmine
summary: An open-source desktop and command-line environment for processing, visualizing, and annotating mass spectrometry-based metabolomics data.
description: MZmine provides modular workflows for feature detection, chromatographic processing, alignment, quality control, visualization, spectral-library matching, and export to downstream annotation and networking platforms.
links:
  primary: https://mzmine.github.io/
  homepage: https://mzmine.github.io/
  repository: https://github.com/mzmine/mzmine
  documentation: https://mzmine.github.io/mzmine_documentation/
  issue_tracker: https://github.com/mzmine/mzmine/issues
resource_types: [software_application]
functions:
  primary: preprocessing
  secondary: [quality_control, annotation_identification, spectral_analysis, visualization_reporting]
  capabilities: [peak_detection, spectral_deconvolution, retention_time_alignment, gap_filling, adduct_isotope_grouping, blank_filtering, library_matching, interactive_dashboard]
platforms: [lc_ms, direct_infusion_ms, maldi_ms, imaging_ms]
analysis_types: [untargeted, targeted, lipidomics, spatial_metabolomics]
interfaces: [desktop_gui, command_line]
access:
  model: open_source
  license: MIT
technical:
  operating_systems: [windows, macos, linux, cross_platform]
  programming_languages: [Java]
  api_available: false
data:
  input_types: [raw_instrument_data, spectra]
  output_types: [feature_table, spectra, compound_list, report]
  input_formats: [vendor_raw, mzml, mzxml, netcdf, imzml]
  output_formats: [csv_tsv, mgf, msp, mztab_m]
publications:
  - doi: 10.1038/s41587-023-01690-2
    type: primary
common_uses:
  - Detect, align, and filter features in untargeted LC-MS datasets.
  - Inspect chromatograms, spectra, ion-mobility data, and imaging-MS features.
  - Export feature and spectral data to annotation and molecular-networking resources.
strengths: []
limitations: []
