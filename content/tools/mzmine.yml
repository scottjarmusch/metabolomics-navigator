$schema: ../../schemas/tool.schema.json
slug: mzmine
name: MZmine
summary: A modular mass-spectrometry environment for raw-data import, feature detection/alignment, multimodal LC/IMS/GC/MSI
  processing, molecular networking, annotation, lipid analysis, visualization, normalization, statistics, and downstream
  exports.
description: MZmine is a modular mass-spectrometry processing environment with graphical, batch, wizard-guided,
  and command-line workflows. Current MZmine supports LC-MS/MS DDA and DIA, LC-IMS-MS, GC-EI/CI-MS, direct-infusion
  and imaging workflows; feature detection, resolving, alignment and filtering; ion/isotope/adduct grouping; spectral-library
  and lipid annotation; interactive molecular networking using classical/modified cosine and learned spectral-similarity
  models; statistics and fragmentation dashboards; and direct exports/integrations with GNPS, SIRIUS, MetaboAnalyst,
  and other downstream resources.
