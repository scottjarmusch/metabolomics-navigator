common_uses:
- Process untargeted LC-MS/MS DDA/DIA and LC-IMS-MS data from raw files through aligned feature tables and annotations.
- Perform GC-EI/CI-MS spectral deconvolution, MS-imaging processing, direct-infusion analyses, and specialized lipidomics
  workflows.
- Run interactive molecular/ion-identity networking locally using spectral similarity and machine-learning similarity
  models.
- Perform spectral-library and rule-based lipid annotation, interactive statistics/fragmentation review, and exports
  to GNPS, SIRIUS, and downstream analysis tools.
- Generate and curate reference spectral-library data using batch/wizard-assisted processing.
