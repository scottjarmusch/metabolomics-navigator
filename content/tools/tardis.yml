description: TARDIS integrates chromatographic peaks for user-specified LC-MS targets and reports peak-quality
  metrics. It uses target masses/retention times, optional QC/internal-standard context and xcms-based
  retention correction through R and a GUI.
scope:
  designed_for:
  - An R package for targeted raw-data integration in mass spectrometry, designed to extract and quantify
    user-specified signals directly from raw or converted data.
  not_designed_for:
  - Untargeted discovery of every chromatographic feature or absolute concentration determination without
    a suitable calibration procedure.
  requirements:
  - R/Bioconductor dependencies, centroided mzML or an appropriate MsExperiment object, and a target table
    with identifiers, m/z, expected RT and polarity; configure QC and batch positions when used.
  considerations:
  - Inspect EICs and target windows before full integration. Multiple overlapping scan windows must be
    analyzed separately as documented to avoid sawtooth chromatograms.
common_uses:
- An R package for targeted raw-data integration in mass spectrometry, designed to extract and quantify
  user-specified signals directly from raw or converted data.
publications:
