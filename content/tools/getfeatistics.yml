description: GetFeatistics elaborates already extracted targeted or untargeted metabolomics tables and
  supports QC, calibration and downstream statistical analysis. Its R functions include targeted concentration
  calculations and models such as linear or mixed-effects regression.
scope:
  designed_for:
  - An R package for targeted and untargeted metabolomics feature-table processing, QC-aware analysis,
    and advanced statistical modeling including regression and mixed-effects models.
  not_designed_for:
  - Extracting chromatographic features directly from raw MS files or choosing an appropriate statistical
    design automatically.
  requirements:
  - R and architecture-matched Java dependencies; organize abundance tables with matching sample/feature
    metadata and provide calibration/internal-standard information for targeted quantification.
  considerations:
  - Follow the separate targeted and untargeted table structures. Calibration, missing-value handling,
    covariates and repeated-measure assumptions must reflect the experiment.
common_uses:
- An R package for targeted and untargeted metabolomics feature-table processing, QC-aware analysis, and
  advanced statistical modeling including regression and mixed-effects models.
publications:
- doi: 10.1515/jib-2025-0047
