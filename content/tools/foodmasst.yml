access:
  model: free_web_service
  notes: Hosted access and any account or usage requirements should be checked at the linked service. Access to
    a web service does not establish the license of its code or reference data.
publications:
- doi: 10.1038/s41538-022-00137-3
  citation: West KA, Schmid R, Gauglitz JM, et al. foodMASST a mass spectrometry search tool for foods and beverages.
    npj Science of Food 6, 22 (2022).
  type: primary
common_uses:
- Search a query MS/MS spectrum against curated food and beverage reference data.
- Generate hypotheses about dietary or food-associated origins of molecules detected in untargeted data.
- Explore exact or related spectral occurrences across food categories and associated metadata.
- Find food and beverage reference contexts for a spectrum observed in a biological sample.
scope:
  designed_for:
  - Food- and beverage-contextualization of tandem mass spectra.
  requirements:
  - A query MS/MS spectrum or compatible spectrum identifier.
  considerations:
  - A match in food reference data supports an occurrence hypothesis but does not by itself establish dietary exposure
    or provenance in a biological sample.
  - Reference coverage depends on the foods and beverages deposited in the source collection.
  - Inspect food labels and source datasets; shared ingredients and processing can produce matches across different
    food categories.
  not_designed_for:
  - Estimating food intake or establishing that a dietary exposure caused a biological phenotype.
