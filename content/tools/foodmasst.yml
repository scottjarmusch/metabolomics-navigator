$schema: ../../schemas/tool.schema.json
slug: foodmasst
name: foodMASST
summary: A domain-specific GNPS search resource for identifying foods and beverages whose reference metabolomics
  data contain spectra matching a query MS/MS spectrum.
description: foodMASST contextualizes known or unknown tandem mass spectra against a reference collection of foods
  and beverages assembled through public metabolomics data. Matching spectra are mapped to food/beverage items and
  associated metadata, enabling researchers to explore potential dietary origins and occurrence patterns of compounds
  in untargeted metabolomics.
links:
  primary: https://apps.gnps2.org/foodmasst
  web_app: https://apps.gnps2.org/foodmasst
  repository: https://github.com/robinschmid/microbe_masst
  documentation: https://github.com/robinschmid/microbe_masst
resource_types:
- web_service
- database_knowledgebase
functions:
