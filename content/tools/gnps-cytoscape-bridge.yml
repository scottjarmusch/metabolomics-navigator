$schema: ../../schemas/tool.schema.json
slug: gnps-cytoscape-bridge
name: GNPS2 Cytoscape Bridge
summary: Convert a GNPS2 GraphML network into a styled desktop Cytoscape session in the browser.
description: The bridge packages an existing GNPS2 network with node and edge tables and sample-group styling
  for desktop inspection. It does not calculate spectral similarity or build the original network.
links:
  primary: https://apps.gnps2.org/gnps2_cys_generator
  documentation: https://apps.gnps2.org/gnps2_cys_generator
resource_types:
- web_service
functions:
  primary: visualization_reporting
  capabilities:
  - network_visualization
platforms:
- lc_ms
interfaces:
- web_app
access:
  model: free_web_service
  notes: Public browser interface. The documented conversion runs locally in the browser; task-ID input fetches
    data from GNPS2. No independent execution test or software-license verification performed.
data:
  input_types:
  - report
  output_types:
  - report
  other_input_formats:
  - GNPS2 network.graphml or supported task ID/status URL
  other_output_formats:
  - Cytoscape .cys session
common_uses:
- Move an existing GNPS2 network into desktop Cytoscape.
scope:
  designed_for:
  - GNPS2 network conversion with group styling and optional singletons.
  not_designed_for:
  - Raw-data processing, network inference or validation of molecular identities.
  requirements:
  - Compatible GraphML or an accessible supported GNPS2 task.
  - Desktop Cytoscape to open the resulting session.
  considerations:
  - Styling summarizes supplied groups; visual similarity is not chemical identification evidence.
  - Session compatibility should be checked with the installed Cytoscape version.
related_tools:
- slug: gnps
  relationship: part_of
  note: GNPS2 browser application.
- slug: gnps-feature-based-molecular-networking
  relationship: integration
  note: Accepts its GNPS2 network outputs.
- slug: cytoscape
  relationship: integration
  note: Open generated .cys sessions in compatible desktop Cytoscape.
