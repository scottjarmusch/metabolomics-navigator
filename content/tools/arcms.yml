description: arcMS converts Waters UNIFI MS-E and HDMS-E data into tabular Parquet or HDF5 storage for
  analysis in R or Python. It also documents mzML-to-Parquet conversion, metadata retrieval and access
  to mobility/CCS information when available.
scope:
  designed_for:
  - arcMS converts Waters UNIFI MS-E and HDMS-E data into tabular Parquet or HDF5 storage for analysis
    in R or Python.
  not_designed_for:
  - Automatic feature detection, spectral deconvolution or molecular identification from the converted
    data.
  requirements:
  - R and documented dependencies; UNIFI conversion requires configured API access and registered connection
    credentials, while HDF5 use requires its supporting packages.
  considerations:
  - Keep acquisition metadata with exported arrays and distinguish measured mobility/CCS fields from predicted
    values. The separate companion visualization app has its own setup.
common_uses:
- arcMS converts Waters UNIFI MS-E and HDMS-E data into tabular Parquet or HDF5 storage for analysis in
  R or Python.
publications:
- doi: 10.1093/bioadv/vbae160
  type: primary
  citation: 'arcMS: transformation of multi-dimensional high-resolution mass spectrometry data to columnar
    format for compact storage and fast access. Bioinformatics Advances (2024).'
