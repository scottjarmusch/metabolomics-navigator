description: ViMMS simulates LC-MS/MS acquisition at scan level so researchers can prototype and compare
  fragmentation strategies. It can generate virtual acquisitions from empirical or simulated chemical
  data and export simulated scans for downstream processing.
scope:
  designed_for:
  - ViMMS simulates LC-MS/MS acquisition at scan level so researchers can prototype and compare fragmentation
    strategies.
  not_designed_for:
  - Proof that a strategy's simulated performance will reproduce on every physical mass spectrometer.
  requirements:
  - The documented Python environment, empirical data or configured virtual chemicals and an acquisition
    controller; real-instrument experiments additionally require a compatible instrument API.
  considerations:
  - Chemical models, scan timing and instrument assumptions constrain simulation realism. Validate promising
    strategies on the intended acquisition platform.
common_uses:
- ViMMS simulates LC-MS/MS acquisition at scan level so researchers can prototype and compare fragmentation
  strategies.
