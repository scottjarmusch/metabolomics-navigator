description: Spectral Denoising removes candidate electronic and chemical noise ions from tandem spectra.
  Denoising Search applies candidate-dependent molecular information during reference-library matching
  and returns comparisons for raw and denoised spectra.
scope:
  designed_for:
  - Spectral Denoising removes candidate electronic and chemical noise ions from tandem spectra.
  not_designed_for:
  - Formula-independent removal of all interference or proof of a compound identity from an improved matching
    score alone.
  requirements:
  - Python 3.8-3.12 with RDKit and dependencies; chemical denoising needs a molecular formula or SMILES
    plus adduct information, and search needs a compatible reference library.
  considerations:
  - Candidate chemistry and precursor tolerances influence which ions are retained. Validate thresholds
    and preserve original spectra for assessing possible removal of genuine fragments.
common_uses:
- Spectral Denoising removes candidate electronic and chemical noise ions from tandem spectra.
publications:
- doi: 10.1038/s41592-025-02646-x
  type: primary
  citation: Denoising Search doubles the number of metabolite and exposome annotations in human plasma
