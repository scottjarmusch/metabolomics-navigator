$schema: ../../schemas/tool.schema.json
slug: omicspls
name: OmicsPLS
summary: Separate shared and dataset-specific variation when integrating two omics data matrices.
description: OmicsPLS implements O2PLS and related sparse approaches, with component selection and visualization
  for paired high-dimensional datasets.
links:
  primary: https://github.com/selbouhaddani/OmicsPLS
  documentation: https://github.com/selbouhaddani/OmicsPLS
  repository: https://github.com/selbouhaddani/OmicsPLS
resource_types:
- programming_package
functions:
  primary: multiomics_integration
  capabilities:
  - multivariate_statistics
platforms:
- platform_independent
interfaces:
- r_package
access:
  model: open_source
  notes: GPL-3 R package.
data:
  input_types:
  - feature_table
  - sample_metadata
  output_types:
  - statistical_results
  - report
  input_formats:
  - other
  output_formats:
  - other
  other_input_formats:
  - Two matched numeric matrices in R
  other_output_formats:
  - O2PLS models, scores, loadings and plots
publications:
- citation: Bouhaddani SE, Uh HW, Jongbloed G, et al. Integrating omics datasets with the OmicsPLS package.
    BMC Bioinformatics 19, 371 (2018).
  type: primary
  doi: 10.1186/s12859-018-2371-3
common_uses:
- Relate metabolomics to another omics layer measured in the same samples.
- Inspect joint and data-specific patterns.
scope:
  designed_for:
  - Relate metabolomics to another omics layer measured in the same samples.
  not_designed_for:
  - Establishing causal regulation from shared statistical variation.
  requirements:
  - Two numeric datasets with matched samples and appropriate scaling.
  considerations:
  - Use cross-validation and inspect confounding; sample alignment and preprocessing strongly affect joint
    components.
