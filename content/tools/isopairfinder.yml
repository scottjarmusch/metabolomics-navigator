description: IsoPairFinder prioritizes candidate microbial pathway intermediates by combining genetic
  perturbation with isotope-tracing LC-MS data. It compares groups, merges redundant ion features and
  pairs labelled/unlabelled signals for experimental follow-up.
scope:
  designed_for:
  - An R package for identifying biologically relevant 12C/13C feature pairs in stable-isotope-tracing
    metabolomics, including differential analysis and redundant-feature merging.
  not_designed_for:
  - Flux estimation, general isotopologue natural-abundance correction or proof that a prioritized pair
    is a specific pathway intermediate.
  requirements:
  - R dependencies, labelled and unlabelled peak tables, matching sample/group/tracer metadata, and appropriately
    organized mzML raw/MS2 files as described in the tutorial.
  considerations:
  - Tracer design, genetic perturbation, thresholds and feature pairing constrain interpretation. Retain
    alternative explanations and validate prioritized candidates experimentally.
common_uses:
- An R package for identifying biologically relevant 12C/13C feature pairs in stable-isotope-tracing metabolomics,
  including differential analysis and redundant-feature merging.
publications:
- doi: 10.1021/jasms.6c00253
  type: primary
  citation: 'IsoPairFinder: A Computational Workflow for Prioritizing LC–MS Feature Pairs Representing
    Candidate Microbial Pathway Intermediates from Stable Isotope Tracing Metabolomics. Journal of the
    American

    Society for Mass Spectrometry (2026).'
