  last_editorial_review: '2026-10-27'
description: MASSISTANT provides research code for learning molecular SELFIES representations from electron-ionization
  mass spectra. Its documented workflow covers dataset cleaning, SELFIES featurization and model training
  for de novo structure prediction.
scope:
  designed_for:
  - MASSISTANT provides research code for learning molecular SELFIES representations from electron-ionization
    mass spectra.
  not_designed_for:
  - Immediate inference with a distributed final model; the README still marks prediction instructions
    and a Docker image as forthcoming.
  requirements:
  - A compatible research environment and appropriately licensed EI training spectra; the repository does
    not supply the commercial-NIST-trained models.
  considerations:
  - This is a training-oriented research release. Valid SELFIES syntax does not establish that a predicted
    molecule is the experimentally measured compound.
common_uses:
- MASSISTANT provides research code for learning molecular SELFIES representations from electron-ionization
  mass spectra.
publications:
- doi: 10.1016/j.chroma.2025.466216
  type: primary
  citation: 'MASSISTANT: A deep learning model for De Novo molecular structure prediction from EI‑MS spectra
    via SELFIES encoding. Journal of Chromatography A (2025).'
