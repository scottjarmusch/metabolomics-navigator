description: MeTEor explores longitudinal metabolomics tables with repeated-measures statistical models,
  dimensionality reduction, prediction models and interactive plots. Its R/Shiny interface also supports
  identifier/pathway mapping and network views.
scope:
  designed_for:
  - MeTEor explores longitudinal metabolomics tables with repeated-measures statistical models, dimensionality
    reduction, prediction models and interactive plots.
  not_designed_for:
  - Raw peak extraction or reliable longitudinal inference without accounting for study design, repeated
    observations and missingness.
  requirements:
  - Docker or the documented R plus Miniconda environment and a processed abundance dataset with longitudinal
    subject, time and group metadata.
  considerations:
  - Choose models consistent with the sampling structure and prevent leakage in prediction. Identifier
    and pathway mapping can depend on external services.
common_uses:
- MeTEor explores longitudinal metabolomics tables with repeated-measures statistical models, dimensionality
  reduction, prediction models and interactive plots.
publications:
- doi: 10.1093/bioadv/vbae178
