description: DiffMS generates candidate molecular structures conditioned on mass-spectral information
  using a diffusion model. The research pipeline combines fingerprint-to-molecule pretraining with end-to-end
  spectral fine-tuning and provides pretrained model resources.
scope:
  designed_for:
  - DiffMS generates candidate molecular structures conditioned on mass-spectral information using a diffusion
    model.
  not_designed_for:
  - Confirmed molecular identification or a turnkey raw-vendor-file analysis pipeline.
  requirements:
  - The documented Python/PyTorch/RDKit environment, prepared dataset configuration and appropriate end-to-end
    or separate encoder/decoder checkpoints; published setup uses CUDA. The published model is restricted
    by a supplied molecular formula.
  considerations:
  - Check data preparation, checkpoint compatibility and chemical-domain coverage. Preserve train/test
    separation and validate generated candidates with independent evidence.
common_uses:
- DiffMS generates candidate molecular structures conditioned on mass-spectral information using a diffusion
  model.
publications:
