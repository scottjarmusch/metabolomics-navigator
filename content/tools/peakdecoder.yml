$schema: ../../schemas/tool.schema.json
slug: peakdecoder
name: PeakDecoder
summary: Use machine learning to support metabolite identification and error-rate estimation in multidimensional LC-IM-MS-DIA data.
description: PeakDecoder is a workflow for metabolite annotation and profiling in liquid-chromatography, ion-mobility and data-independent-acquisition mass spectrometry. It uses precursor and fragment-ion co-elution and co-mobility information together with machine learning to score candidate metabolite assignments and estimate false-discovery rates.
links:
  primary: https://github.com/EMSL-Computing/PeakDecoder
  repository: https://github.com/EMSL-Computing/PeakDecoder
