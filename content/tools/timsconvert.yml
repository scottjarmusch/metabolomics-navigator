$schema: ../../schemas/tool.schema.json
slug: timsconvert
name: TIMSCONVERT
summary: An open-source workflow for converting Bruker timsTOF raw data, including trapped-ion-mobility
  information, into open mzML and imzML formats for downstream analysis.
links:
  primary: https://github.com/gtluu/timsconvert
  repository: https://github.com/gtluu/timsconvert
  documentation: https://gtluu.github.io/timsconvert/
resource_types:
- workflow_pipeline
functions:
  primary: data_conversion
  secondary: []
  capabilities:
  - spectral_data_io
platforms:
- multi_platform
interfaces:
- command_line
- desktop_gui
access:
  model: open_source
  license: Apache-2.0
  notes: Apache-2.0 workflow code includes components covered by separate Bruker proprietary terms. The
    required TDF-SDK route is not compatible with macOS according to the project documentation.
technical:
  operating_systems:
  - windows
  - linux
  programming_languages:
  - Python
data:
  input_types:
  - raw_instrument_data
  output_types:
  - spectra
  - imaging_data
  input_formats:
  - vendor_raw
  output_formats:
  - mzml
  - imzml
publications:
- doi: 10.1093/bioinformatics/btac419
  type: primary
  citation: 'TIMSCONVERT: a workflow to convert trapped ion mobility data to open data formats. Bioinformatics
    (2022).'
common_uses:
- Convert timsTOF data to open formats while preserving ion-mobility information.
