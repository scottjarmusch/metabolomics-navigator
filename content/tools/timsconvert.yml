  last_editorial_review: '2026-10-27'
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - unspecified
  ion_mobility: required
description: TIMSCONVERT converts supported Bruker timsTOF raw acquisitions to open mzML or imzML while
  retaining ion-mobility information where supported. It provides graphical and command-line routes to
  data conversion for downstream analysis.
scope:
  designed_for:
  - An open-source workflow for converting Bruker timsTOF raw data, including trapped-ion-mobility information,
    into open mzML and imzML formats for downstream analysis.
  not_designed_for:
  - Feature extraction, metabolite identification or conversion of arbitrary proprietary vendor formats.
  requirements:
  - Supported timsTOF acquisition directories and the documented Windows/Linux environment with the required
    Bruker TDF-SDK components; output mode must match LC-MS or imaging acquisition.
  considerations:
  - Conversion options and mobility handling must suit the acquisition and downstream reader. Preserve
    original raw data and record conversion parameters.
