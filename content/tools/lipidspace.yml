description: LipidSpace compares lipidomes using graph-based distances between lipid structures and quantitative
  information. Its desktop interface supports experiment comparison, study-variable exploration, feature
  selection and quality-control views.
scope:
  designed_for:
  - LipidSpace compares lipidomes using graph-based distances between lipid structures and quantitative
    information.
  not_designed_for:
  - Raw spectral lipid identification or proof of biological similarity independent of annotation quality
    and structural resolution.
  requirements:
  - A supported desktop release and identified lipid abundance tables with compatible lipid nomenclature
    and sample/study-variable annotations.
  considerations:
  - Lipid naming, structural detail, sn-position assumptions and distance/clustering settings influence
    comparisons. This resource is distinct from the LORA paper incorrectly associated with its repository
    in the intake.
common_uses:
- LipidSpace compares lipidomes using graph-based distances between lipid structures and quantitative
  information.
publications:
- doi: 10.1021/acs.analchem.3c02449
  type: primary
  citation: 'LipidSpace: Simple Exploration, Reanalysis, and Quality Control of Large-Scale Lipidomics
    Studies. Analytical Chemistry (2023).'
