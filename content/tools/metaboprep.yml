  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - Quality control and filtering of already quantified metabolomics tables.
  not_designed_for:
  - Raw chromatographic peak detection or automatic correction of every analytical batch effect.
  requirements:
  - R and package dependencies, quantified abundance data and aligned sample/feature metadata; select
    importer and QC thresholds appropriate to the input structure.
  considerations:
  - Missingness and outlier thresholds can remove biological signals; review exclusion reasons and compare
    pre/post-QC data before statistical modelling.
description: metaboprep prepares quantified metabolomics tables for downstream analysis by summarizing
  data, filtering samples/features and reporting QC decisions. Its R interface supports abundance matrices
  and vendor/service tabular exports with sample and feature annotations.
