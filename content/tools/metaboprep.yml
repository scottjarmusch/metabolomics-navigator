analysis_types:
- targeted
- untargeted
interfaces:
- r_package
access:
  model: open_source
  license: MIT
  notes: Package DESCRIPTION declares MIT plus the accompanying LICENSE file. Document the installed version
    because current development interfaces can differ from the original paper.
