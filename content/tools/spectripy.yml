slug: spectripy
name: SpectriPy
summary: An R package that connects the RforMassSpectrometry Spectra ecosystem with Python, enabling exchange
  and joint analysis of mass-spectrometry data across R and Python workflows.
links:
  primary: https://github.com/rformassspectrometry/SpectriPy
  repository: https://github.com/rformassspectrometry/SpectriPy
  documentation: https://rformassspectrometry.github.io/SpectriPy/
resource_types:
- programming_package
functions:
  primary: data_conversion
  secondary:
  - spectral_analysis
  - workflow_reproducibility
  capabilities:
  - spectral_data_io
platforms:
- platform_independent
interfaces:
- r_package
access:
  model: open_source
  license: Artistic-2.0
  notes: Artistic-2.0 R package; Python dependencies have their own licenses and version constraints.
    SpectriPy wraps their functionality rather than replacing the underlying methods.
technical:
  operating_systems:
  - cross_platform
  programming_languages:
  - R
  - Python
data:
  input_types:
  - spectra
  output_types:
  - spectra
  other_input_formats:
  - R Spectra, Python matchms Spectrum and spectrum_utils objects
  other_output_formats:
  - Converted spectral objects and similarity/filter results returned to R
publications:
- doi: 10.21105/joss.08070
  type: primary
  citation: 'SpectriPy: Enhancing Cross-Language Mass Spectrometry Data Analysis with R and Python. Journal
    of Open Source Software (2025).'
common_uses:
- Exchange spectral data between R Spectra objects and Python-based analysis code.
