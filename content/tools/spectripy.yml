  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
description: SpectriPy connects the R Spectra ecosystem to Python MS libraries through reticulate. It
  translates spectral objects and exposes Python similarity, filtering and normalization functions inside
  R workflows.
scope:
  designed_for:
  - An R package that connects the RforMassSpectrometry Spectra ecosystem with Python, enabling exchange
    and joint analysis of mass-spectrometry data across R and Python workflows.
  not_designed_for:
  - A standalone raw-data preprocessing engine or a guarantee that different similarity implementations
    produce interchangeable scores.
  requirements:
  - R/Bioconductor Spectra, reticulate and a compatible Python environment with matchms, spectrum_utils
    and NumPy. Follow the documented automatic or manual environment setup route.
  considerations:
  - Python environment selection and library versions matter. Data conversion and score parameters should
    be recorded when mixing language ecosystems.
