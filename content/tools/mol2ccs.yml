description: Mol2CCS supplies graph-neural-network training and prediction code used to study CCS generalization
  across datasets. Models operate on molecular structures, adducts and optional three-dimensional coordinates,
  with prepared datasets and evaluation notebooks.
scope:
  designed_for:
  - A research codebase for graph-neural-network prediction of ion-mobility collision cross sections from
    molecular structure, developed to evaluate model generalizability across chemical domains.
  not_designed_for:
  - Calibrating experimental mobility measurements or guaranteeing accurate CCS for chemical domains absent
    from model training.
  requirements:
  - The documented Python/Poetry environment, compatible molecular/adduct data and a trained model; reproducing
    the experiments additionally requires downloading and preparing the licensed METLIN-CCS/CCSBase datasets.
  considerations:
  - Dataset splits, adduct definitions and structural domain affect evaluation. The repository is a research
    framework; do not assume a maintained universal pretrained prediction service.
