description: CCSfind builds experimentally derived small-molecule databases from LC-drift-tube-ion-mobility-MS
  data. It searches supplied formulas and ion species, checks isotopologue evidence and separates chromatographic
  or mobility-resolved candidates for database export.
scope:
  designed_for:
  - CCSfind builds experimentally derived small-molecule databases from LC-drift-tube-ion-mobility-MS
    data.
  not_designed_for:
  - Predicting CCS directly from an arbitrary molecular structure or universal support for all ion-mobility
    platforms.
  requirements:
  - Python 3.9 dependencies or a compatible GUI build, profile-mode mzML, target formulas/ion species,
    drift gas and single-field calibration coefficients Tfix and Beta.
  considerations:
  - The documented workflow targets drift-tube data. Calibration, isotope tolerances and peak-width settings
    affect database entries and separation of isomers/protomers.
common_uses:
- CCSfind builds experimentally derived small-molecule databases from LC-drift-tube-ion-mobility-MS data.
publications:
- doi: 10.1002/jms.5040
  type: primary
  citation: 'CCSfind: A tool for chemically informed LC‐IM‐MS database building. Journal of Mass Spectrometry
    (2024).'
