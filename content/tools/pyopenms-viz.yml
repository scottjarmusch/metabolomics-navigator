description: pyOpenMS-viz extends pandas plotting for mass-spectrometry data, including chromatograms,
  mobilograms, spectra and two- or three-dimensional peak maps. It supports static matplotlib and interactive
  Bokeh or Plotly backends.
scope:
  designed_for:
  - pyOpenMS-viz extends pandas plotting for mass-spectrometry data, including chromatograms, mobilograms,
    spectra and two- or three-dimensional peak maps.
  not_designed_for:
  - Raw feature detection, structural identification or automatic conversion of every vendor format into
    a plot-ready table.
  requirements:
  - A compatible Python environment, pandas DataFrames with the dimensions required by the plot and the
    selected plotting backend.
  considerations:
  - Data preparation and column selection remain the user's responsibility. Plot types and three-dimensional
    support differ between backends.
common_uses:
- pyOpenMS-viz extends pandas plotting for mass-spectrometry data, including chromatograms, mobilograms,
  spectra and two- or three-dimensional peak maps.
