$schema: ../../schemas/tool.schema.json
slug: fbmn-stats
name: FBMN Stats
summary: Clean and statistically explore feature-based molecular networking abundance tables with guided notebooks and a web app.
description: FBMN-STATS provides an accompanying app and notebooks for downstream analysis of non-targeted LC-MS/MS feature tables. It connects data cleanup and statistical comparisons to the interpretation of molecular-network results.
links:
  primary: https://fbmn-statsguide.gnps2.org/
  documentation: https://github.com/Functional-Metabolomics-Lab/FBMN-STATS
  repository: https://github.com/Functional-Metabolomics-Lab/FBMN-STATS
resource_types:
- web_service
- workflow_pipeline
functions:
  primary: statistics
  capabilities:
  - blank_filtering
  - batch_effect_correction
  - univariate_statistics
  - multivariate_statistics
  - interactive_dashboard
platforms:
- lc_ms
interfaces:
- web_app
access:
  model: open_source
  license: BSD-3-Clause
  notes: BSD-3-Clause source with hosted app and R/Python notebook routes. Cloud notebook use may require an account; local execution requires the documented dependencies. Hosted use is recommended by the maintainers for smaller datasets.
data:
  input_types:
  - feature_table
  - sample_metadata
  output_types:
  - statistical_results
  - report
  other_input_formats:
  - FBMN quantification and metadata tables; layout depends on interface
  other_output_formats:
  - Statistical result files and notebook or app visualizations
common_uses:
- Examine group differences and multivariate patterns in processed LC-MS/MS data.
- Prepare statistical results for interpretation alongside molecular networks.
scope:
  designed_for:
  - Downstream quantitative analysis of feature-based molecular networking results.
  not_designed_for:
  - Raw-file feature detection or definitive compound identification.
  requirements:
  - Compatible feature tables and sample metadata, including grouping and blank information where applicable.
  - Choose an interface and analysis appropriate to the study design.
  considerations:
  - Legacy GNPS Quickstart exports may lack the reformatted outputs required by the current integration; maintainers recommend GNPS2.
  - Normalization, missing values, batch structure and multiple comparisons require study-specific decisions.
  - Notebooks and the web app need not expose identical operations; consult the selected interface documentation.
publications:
- citation: 'Pakkir Shah AK, Walter A, Ottosson F, et al. Statistical analysis of feature-based molecular networking results from non-targeted metabolomics data. Nature Protocols 20, 92–162 (2025; published online 2024).'
  type: methods
  doi: 10.1038/s41596-024-01046-3
related_tools:
- slug: metaboapps
  relationship: part_of
  note: Listed in the GNPS2 MetaboApps catalogue.
- slug: gnps-feature-based-molecular-networking
  relationship: integration
  note: Provides processed feature-abundance and molecular-network outputs for downstream analysis.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Official repository, license, GNPS2 listing and direct methods publication reviewed on 2026-09-10. No analysis job or independent benchmark performed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-10'
  updated_at: '2026-09-10'
  last_verified: '2026-09-10'
  last_editorial_review: '2026-09-10'
maintenance:
