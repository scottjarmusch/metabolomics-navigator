description: ALISTER provides literature-based information about pre-analytical metabolite and lipid stability
  in EDTA plasma and serum. Its Shiny interface supports sample-condition queries, analyte searches and
  prospective sampling-method exploration.
scope:
  designed_for:
  - ALISTER provides literature-based information about pre-analytical metabolite and lipid stability
    in EDTA plasma and serum.
  not_designed_for:
  - Measuring actual sample integrity or generalizing supported conditions to every specimen matrix and
    handling procedure.
  requirements:
  - A browser for the hosted application or a local R/Shiny installation; supply sample matrix, handling
    delays, temperatures and analytes or classes of interest.
  considerations:
  - Evidence coverage and the application's generalization of input conditions constrain interpretation.
    Review the underlying references and chosen change thresholds for each query.
common_uses:
- ALISTER provides literature-based information about pre-analytical metabolite and lipid stability in
  EDTA plasma and serum.
