$schema: ../../schemas/tool.schema.json
slug: msgo
name: MSGO
summary: A research implementation for de novo molecular-structure generation from mass-spectral evidence
  using pseudodata-trained machine learning.
links:
  primary: https://github.com/aaronma2020/MSGO
  repository: https://github.com/aaronma2020/MSGO
  documentation: https://github.com/aaronma2020/MSGO#readme
resource_types:
- programming_package
functions:
  primary: annotation_identification
  secondary:
  - machine_learning
  capabilities:
  - structure_elucidation
platforms:
- platform_independent
interfaces:
- python_package
access:
  model: open_source
  license: MIT
  notes: MIT source distribution. External datasets, dependent packages and any hosted routes retain their
    own terms; software operation was not tested.
technical:
  operating_systems:
  - linux
  programming_languages:
  - Python
data:
  input_types:
  - spectra
  output_types:
  - molecular_structures
  other_input_formats:
  - Example-structured tandem-spectrum CSVs and trained model checkpoints
  other_output_formats:
  - CSV of ranked generated molecular-structure candidates
maintenance:
  status: unclear
  repository_last_activity: '2026-04-07'
  last_checked: '2026-10-27'
  notes: Repository state checked; commit recency is not operational validation or proof of ongoing support.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official repository documentation, package/license metadata and
    primary publication identity on 2026-10-27. Editorial source review only; no software execution or
    independent benchmark. See docs/enveda-expansion-review-2026-10-27-batch2.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - A research implementation for de novo molecular-structure generation from mass-spectral evidence using
    pseudodata-trained machine learning.
  not_designed_for:
  - A universal structure generator with validated coverage of all chemical classes or confirmed identifications
    from top-ranked SMILES alone.
  requirements:
  - The documented Python/PyTorch environment, matching model weights and correctly formatted spectrum
    CSVs; use the polarity and model appropriate to the chemical domain.
  considerations:
  - Pseudodata and restricted PFAS/lipid training domains limit transfer. Some model/data assets use external
    download services; inspect accessibility and precursor/formula consistency before interpreting generated
    candidates.
description: MSGO generates candidate molecular structures from tandem spectra with a model trained using
  simulated spectrum-structure pairs. The published implementation provides PFAS and lipid model routes
  with beam-search candidate outputs.
common_uses:
- A research implementation for de novo molecular-structure generation from mass-spectral evidence using
  pseudodata-trained machine learning.
publications:
- doi: 10.1038/s42256-025-01140-5
  type: primary
  citation: Pseudodata-based molecular structure generator to reveal unknown chemicals. Nature Machine
    Intelligence (2025).
