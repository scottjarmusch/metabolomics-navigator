description: CRISP analyzes GC×GC-TOFMS contour images with modules for region selection/deep stacking,
  synthetic contour generation, image enhancement and classifier training. Its graphical research toolkit
  works on prepared contour representations rather than directly identifying metabolites.
scope:
  designed_for:
  - CRISP analyzes GC×GC-TOFMS contour images with modules for region selection/deep stacking, synthetic
    contour generation, image enhancement and classifier training.
  not_designed_for:
  - Molecular identification from raw spectra or evidence that synthetic contours create independent biological
    samples.
  requirements:
  - The documented deep-learning environment, prepared GC×GC contour images and class labels or model
    resources appropriate to the selected training/inference module.
  considerations:
  - Keep augmentation and evaluation separated to avoid leakage. Contour preprocessing, selected regions
    and training-domain coverage determine classifier interpretation.
common_uses:
- CRISP analyzes GC×GC-TOFMS contour images with modules for region selection/deep stacking, synthetic
  contour generation, image enhancement and classifier training.
publications:
