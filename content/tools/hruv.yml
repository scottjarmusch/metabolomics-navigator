slug: hruv
name: hRUV
summary: An R package for hierarchical normalization of multi-batch metabolomics studies using intra-batch
  and inter-batch replicate information to estimate and remove unwanted variation.
links:
  primary: https://github.com/SydneyBioX/hRUV
  repository: https://github.com/SydneyBioX/hRUV
  documentation: https://sydneybiox.github.io/hRUV/
resource_types:
- programming_package
functions:
  primary: normalization
  secondary:
  - statistics
  capabilities:
  - batch_effect_correction
  - qc_drift_correction
platforms:
- platform_independent
analysis_types:
- untargeted
interfaces:
- r_package
access:
  model: open_source
  license: GPL-3.0
  notes: GPL-3.0 source distribution. External datasets, dependent packages and any hosted routes retain
    their own terms; software operation was not tested.
technical:
  operating_systems:
  - cross_platform
  programming_languages:
  - R
data:
  input_types:
  - feature_table
  - sample_metadata
  output_types:
  - feature_table
  other_input_formats:
  - R abundance objects with batch, run-order and replicate annotations
  other_output_formats:
  - Corrected R abundance objects and diagnostic plots
common_uses:
- Correct within- and between-batch unwanted variation in large metabolomics studies.
maintenance:
  status: unclear
  repository_last_activity: '2024-08-16'
  last_checked: '2026-10-27'
  notes: Repository state checked; commit recency is not operational validation or proof of ongoing support.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official repository documentation, package/license metadata and
    primary publication identity on 2026-10-27. Editorial source review only; no software execution or
    independent benchmark. See docs/enveda-expansion-review-2026-10-27-batch2.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
description: hRUV removes unwanted variation from multi-batch metabolomics data using a hierarchy of within-batch
  and between-batch corrections. The strategy uses embedded replicate samples with RUV-III and signal-drift
  smoothers.
scope:
  designed_for:
  - An R package for hierarchical normalization of multi-batch metabolomics studies using intra-batch
    and inter-batch replicate information to estimate and remove unwanted variation.
  not_designed_for:
  - General correction of studies lacking the replicate design needed to estimate technical variation,
    or raw peak detection.
  requirements:
  - R/Bioconductor dependencies, processed abundances and sample/run metadata identifying the required
    intra-batch and inter-batch replicate arrangements.
  considerations:
  - Replicate placement and connectivity determine what variation can be estimated. Check that correction
    preserves biological differences and does not confuse them with batch structure.
publications:
- doi: 10.1038/s41467-021-25210-5
  type: primary
  citation: A hierarchical approach to removal of unwanted variation for large-scale metabolomics data.
    Nature Communications (2021).
