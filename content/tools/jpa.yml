description: JPA combines MS1 chromatographic peak picking with MS/MS-precursor-based feature extraction
  to broaden LC-MS feature detection. The R workflow supports alignment and downstream handling of the
  jointly extracted feature set.
scope:
  designed_for:
  - JPA combines MS1 chromatographic peak picking with MS/MS-precursor-based feature extraction to broaden
    LC-MS feature detection.
  not_designed_for:
  - Metabolite structure identification or recovery of compounds lacking sufficient acquisition evidence.
  requirements:
  - R/XCMS dependencies and mzXML acquisition files with appropriate MS/MS precursor information; follow
    the documented peak-table layout when supplying existing features.
  considerations:
  - Additional precursor-derived features still require quality review. Peak-picking, alignment and acquisition
    thresholds affect the balance between added coverage and unwanted features.
common_uses:
- JPA combines MS1 chromatographic peak picking with MS/MS-precursor-based feature extraction to broaden
  LC-MS feature detection.
publications:
- doi: 10.3390/metabo12030212
  type: primary
  citation: 'JPA: Joint Metabolic Feature Extraction Increases the Depth of Chemical Coverage for LC-MS-Based
    Metabolomics and Exposomics. Metabolites (2022).'
