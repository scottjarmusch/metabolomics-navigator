$schema: ../../schemas/tool.schema.json
slug: cmmc-kb
name: CMMC-KB
summary: A community-curated knowledgebase for microbial metabolites that links reference MS/MS evidence, microbial
  producers, annotations, and GNPS2 analysis resources.
description: CMMC-KB is part of the Collaborative Microbial Metabolite Center infrastructure for community curation
  of microbial small molecules. It is designed to consolidate evidence connecting microbial metabolites with spectra,
  structures, producers, and contextual metadata, and to make that knowledge reusable in GNPS2 analyses such as
  molecular-network enrichment and microbial contextualization. The associated scientific description is currently
  a 2026 preprint.
links:
  primary: https://cmmc-kb.gnps2.org/
  web_app: https://cmmc-kb.gnps2.org/
  documentation: https://pubmed.ncbi.nlm.nih.gov/41659575/
resource_types:
- database_knowledgebase
- web_service
functions:
  primary: annotation_identification
  secondary:
  - reference_data_search
  - data_management_sharing
  capabilities:
  - library_matching
  - metadata_contextualization
  - provenance_tracking
platforms:
- lc_ms
analysis_types:
- untargeted
- metabolite_profiling
interfaces:
- web_app
access:
  model: free_web_service
  notes: Hosted access and any account or usage requirements should be checked at the linked service. Access to
    a web service does not establish the license of its code or reference data.
publications:
- doi: 10.64898/2026.01.24.701521
  citation: Mannochio-Russo H, Goncalves Nunes WD, Xing S, et al. Community Curation of Microbial Metabolites
    Enables Biological Insights of Metabolomics Data. bioRxiv (2026). Preprint; not peer reviewed.
  type: primary
common_uses:
- Curate and retrieve microbial-metabolite knowledge linking spectra, chemical annotations, and producer context.
- Enrich GNPS2 analyses with community-curated microbial metabolite evidence.
- Support community deposition and validation of microbial metabolite annotations.
- Download curated spectra and metadata for reuse while keeping their supporting evidence attached.
scope:
  designed_for:
  - Community knowledge curation and downstream interpretation of microbial metabolomics data.
  requirements:
  - Curated metabolite/spectral evidence for deposition or GNPS2-compatible analysis results for downstream use.
  considerations:
  - The main scientific description is currently a preprint and the knowledgebase is actively expanding.
  - Curated evidence can span different levels of structural and biological confidence; users should inspect supporting
    evidence for individual annotations.
  - Inspect the evidence and source category for each entry; host, food, drug and exposure-related molecules can
    also be represented.
  not_designed_for:
  - Treating every curated occurrence or source annotation as experimentally proven microbial biosynthesis.
