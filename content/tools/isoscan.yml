$schema: ../../schemas/tool.schema.json
slug: isoscan
name: isoSCAN
summary: Integrate stable-isotope-labeling peaks from GC chemical-ionization mass
  spectrometry data.
description: isoSCAN is an R package for automatic peak integration in low- and high-resolution
  GC-CI-MS labeling experiments. Its catalogue scope follows the official package
  description; LC-MS support is not inferred from the discovery list.
links:
  primary: https://github.com/jcapelladesto/isoSCAN
  repository: https://github.com/jcapelladesto/isoSCAN
  documentation: https://github.com/jcapelladesto/isoSCAN
platforms:
- gc_ms
interfaces:
- r_package
resource_types:
- programming_package
functions:
  primary: isotope_tracing_flux
  capabilities:
  - peak_detection
access:
  model: open_source
  license: GPL-3.0
  notes: R package depending on mzR and other packages declared in DESCRIPTION.
data:
  input_types:
  - spectra
  - isotope_tracing_data
  output_types:
  - isotope_tracing_data
  other_input_formats:
  - GC-CI-MS labeling data supplied through the documented R workflow
  other_output_formats:
  - Integrated isotope-labeling peak measurements returned by the R workflow
common_uses:
- Process GC-CI-MS measurements from stable-isotope experiments.
scope:
  designed_for:
  - Peak integration for GC chemical-ionization labeling data.
  not_designed_for:
  - A general LC-MS workflow or independent confirmation of metabolic flux.
  requirements:
  - GC-CI-MS measurements and the repository R dependencies; consult the package vignette
    for import preparation.
  considerations:
  - Match ionization mode and isotope experiment to the documented workflow.
publications:
- doi: 10.1021/acs.analchem.0c02998
  type: primary
  citation: Exploring the Use of Gas Chromatography Coupled to Chemical Ionization
    Mass Spectrometry (GC-CI-MS) for Stable Isotope Labeling in Metabolomics. Analytical
    Chemistry (2020).
  note: Published online December 2020; journal issue 2021. Both dates can appear
    in citations.
maintenance:
  status: unclear
  last_checked: '2026-10-02'
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Discovered through the Enveda review intake; official repository and primary
    publication metadata checked on 2026-10-02. Editorial review only; software and
    performance not execution-tested.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-02'
  updated_at: '2026-10-02'
  last_verified: '2026-10-02'
  last_editorial_review: '2026-10-02'
