$schema: ../../schemas/tool.schema.json
slug: pcpfm
name: Python-Centric Pipeline for Metabolomics
acronym: PCPFM
summary: An open Python workflow for LC-MS metabolomics that converts supported raw data, performs feature
  extraction with Asari, applies QC and normalization, groups empirical compounds, and supports MS1/MS2
  annotation.
links:
  primary: https://github.com/shuzhao-li-lab/PythonCentricPipelineForMetabolomics
  repository: https://github.com/shuzhao-li-lab/PythonCentricPipelineForMetabolomics
  documentation: https://github.com/shuzhao-li-lab/PythonCentricPipelineForMetabolomics#readme
resource_types:
- workflow_pipeline
functions:
  primary: workflow_reproducibility
  secondary:
  - data_conversion
  - preprocessing
  - quality_control
  - normalization
  - annotation_identification
  capabilities:
  - provenance_tracking
  - peak_detection
  - blank_filtering
  - batch_effect_correction
  - adduct_isotope_grouping
  - library_matching
platforms:
- lc_ms
analysis_types:
- untargeted
interfaces:
- command_line
- python_package
access:
  model: unknown
  notes: The LICENSE contains MIT terms preceded by wording that release under MIT is planned. Access
    is conservatively marked unclear pending clarification; downloaded annotation resources have separate
    licenses.
technical:
  operating_systems:
  - linux
  - macos
  - windows
  programming_languages:
  - Python
  package_managers:
  - PyPI
data:
  input_types:
  - raw_instrument_data
  - sample_metadata
  output_types:
  - feature_table
  - compound_list
  - report
  input_formats:
  - vendor_raw
  - mzml
  - csv_tsv
  output_formats:
  - csv_tsv
  - json
publications:
- doi: 10.1371/journal.pcbi.1011912
  type: primary
  citation: Common data models to streamline metabolomics processing and annotation, and implementation
    in a Python pipeline. PLOS Computational Biology (2024).
common_uses:
- Run a reproducible LC-MS metabolomics workflow from raw or mzML data to curated feature tables.
- Combine feature extraction, QC, normalization, empirical-compound grouping, and annotation in one Python
  workflow.
maintenance:
  status: unclear
  repository_last_activity: '2026-10-26'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - End-to-end, Python-centric preprocessing and annotation of LC-MS metabolomics studies.
  considerations:
  - Inspect sample-to-file mapping and QC/blank labels. Annotation depends on chosen empirical-compound
    rules and reference coverage, and downloaded resources are not automatically redistributable.
  not_designed_for:
  - Universal vendor-raw support or confirmed metabolite identification from a mass/library annotation
    alone.
  requirements:
  - Python dependencies, centroid mzML data and a sequence CSV with sample names and paths; Thermo raw
    conversion additionally needs a configured converter and its runtime.
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - full_scan
  - dda
  - unspecified
  ion_mobility: unspecified
description: The Python-Centric Pipeline for Metabolomics organizes sample metadata, Asari-based preprocessing,
  QC and empirical-compound annotation in a common data model. Its command-line stages preserve intermediate
  analyses and export tables for downstream interpretation.
