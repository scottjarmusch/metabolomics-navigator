description: FIDDLE predicts and rescores molecular-formula candidates from tandem mass spectra using
  deep learning. Its command-line and Python workflows provide instrument-specific inference and ranked
  formula outputs, with research training/evaluation scripts separately available.
scope:
  designed_for:
  - FIDDLE predicts and rescores molecular-formula candidates from tandem mass spectra using deep learning.
  not_designed_for:
  - Full molecular-structure identification or guaranteed formula recovery outside the supported instrument
    and chemical domains.
  requirements:
  - The inference package and downloaded models, plus MGF spectra containing the required title, precursor
    mass/type and collision-energy metadata; select the appropriate instrument model.
  considerations:
  - Formula ranking and rescoring depend on spectral metadata and model selection. Optional BUDDY/SIRIUS
    comparisons add separate software and account requirements.
common_uses:
- FIDDLE predicts and rescores molecular-formula candidates from tandem mass spectra using deep learning.
publications:
- doi: 10.1038/s41467-025-66060-9
  type: primary
  citation: 'FIDDLE: a deep learning method for chemical formulas prediction from tandem mass spectra.
    Nature Communications (2025).'
