description: omicsMIC provides an interactive framework for simulating missingness and comparing imputation
  methods in mass-spectrometry-based omics matrices. Its evaluation visualizations help users investigate
  how method behavior varies with dataset and missingness assumptions.
scope:
  designed_for:
  - omicsMIC provides an interactive framework for simulating missingness and comparing imputation methods
    in mass-spectrometry-based omics matrices.
  not_designed_for:
  - Establishing the true missing-value mechanism or selecting a universally optimal imputation method
    from one simulated benchmark.
  requirements:
  - The hosted application or downloaded local distribution, a compatible numeric omics dataset and simulation/evaluation
    settings suitable for the intended comparison.
  considerations:
  - Compare downstream effects and avoid evaluation leakage. Hosted endpoint availability and local distribution
    setup are separate from the published benchmarking method.
common_uses:
- omicsMIC provides an interactive framework for simulating missingness and comparing imputation methods
  in mass-spectrometry-based omics matrices.
publications:
- doi: 10.1093/nargab/lqae071
  type: primary
  citation: 'omicsMIC: a comprehensive benchmarking platform for robust comparison of imputation methods
    in mass spectrometry-based omics data. NAR Genomics and Bioinformatics (2024).'
