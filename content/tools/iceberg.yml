description: ICEBERG predicts tandem mass spectra from candidate molecular structures using a learned fragment
  generator and an intensity predictor. Predicted spectra can be compared with an experimental spectrum to
  rank supplied candidates. The ms-pred repository also contains separate models; this entry covers ICEBERG,
  not every method in that repository.
