$schema: ../../schemas/tool.schema.json
slug: smqvp
name: SMQVP
summary: Inspect and filter spatial-metabolomics peak matrices through interactive QC views.
description: SMQVP is a Shiny application for assessing background, noise, intensity, missingness and
  isotope/adduct patterns in spatial peak tables.
links:
  primary: https://github.com/mzlab-research/SMQVP
  repository: https://github.com/mzlab-research/SMQVP
  documentation: https://github.com/mzlab-research/SMQVP#readme
platforms:
- imaging_ms
interfaces:
- web_app
resource_types:
- software_application
functions:
  primary: quality_control
  capabilities:
  - interactive_dashboard
  - adduct_isotope_grouping
access:
  model: source_available
  notes: Source is public and an online service is documented; an explicit software license was not identified.
    No hosted data upload or service execution test performed.
data:
  input_types:
  - imaging_data
  output_types:
  - imaging_data
  - report
  other_input_formats:
  - Peak matrix with X/Y pixel coordinates followed by m/z intensity columns
  other_output_formats:
  - Processed spatial peak matrix and QC visualizations
common_uses:
- Inspect and filter spatial-metabolomics peak matrices through interactive QC views.
scope:
  designed_for:
  - SMQVP is a Shiny application for assessing background, noise, intensity, missingness and isotope/adduct
    patterns in spatial peak tables.
  not_designed_for:
  - Raw imaging-file conversion or definitive molecular identification.
  requirements:
  - An extracted spatial peak table and appropriate tissue/background region selection.
  - R and Shiny for local use, or the documented hosted interface.
  considerations:
  - Review filtering against tissue/background signals; QC images alone do not validate biological conclusions.
publications:
- doi: 10.3390/metabo15060354
  type: primary
  citation: 'SMQVP: A Web Application for Spatial Metabolomics Quality Visualization and Processing. Metabolites
    (2025).'
