$schema: ../../schemas/tool.schema.json
slug: food-readout
name: GNPS2 Food Readout
summary: Annotate molecular features with dietary and food-ontology context to explore potential food-derived exposures.
links:
  primary: https://foodreadouts.gnps2.org/
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/metaboapp_Food_Readout/
resource_types:
- web_service
functions:
  primary: visualization_reporting
  capabilities:
  - metadata_contextualization
  - interactive_dashboard
platforms:
- lc_ms
interfaces:
- web_app
access:
  model: free_web_service
  notes: Publicly hosted MetaboApp. GNPS2 infrastructure is open to the academic community; its documentation directs
    industry users to the maintainers or UCR Technology Transfer. Hosted access does not establish a software or
    reference-data license.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Reviewed against the linked official app documentation on 2026-09-10. No standalone publication for this
    particular app was verified; the documentation citation identifies the reviewed implementation. Underlying method
    and application papers are not presented as dedicated app papers. No analysis job or independent benchmark was
    run; no developer verification is claimed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-08'
  updated_at: '2026-09-10'
  last_verified: '2026-09-10'
  last_editorial_review: '2026-09-10'
data:
  input_types:
  - feature_table
  - compound_list
  - sample_metadata
  output_types:
  - compound_list
  - report
  - statistical_results
  input_formats:
  - csv_tsv
  other_input_formats:
  - Completed GNPS2 FBMN task ID
  other_output_formats:
  - Processed food tables and exportable box, PCA and volcano plots
scope:
  designed_for:
  - Post-processing LC-MS/MS library matches in their food-related reference context.
  not_designed_for:
  - Measuring absolute food intake or proving recent consumption.
  requirements:
  - A completed FBMN task with GNPS library matches, a feature quantification table and sample metadata.
  - CSV/TSV tables with matching feature and sample identifiers.
  considerations:
  - Reference coverage is incomplete, and many compounds occur in food and non-food sources.
  - Group differences require study-design and statistical review; an exploratory plot is not causal evidence.
related_tools:
- slug: metaboapps
  relationship: part_of
  note: Standalone MetaboApp that can be launched directly or from a GNPS2 task.
- slug: gnps
  relationship: integration
  note: Consumes GNPS2 tasks or ecosystem data.
- slug: gnps-feature-based-molecular-networking
  relationship: integration
  note: Uses results from a completed FBMN task.
maintenance:
  status: active
  last_checked: '2026-09-10'
publications: []
resource_citations:
- type: documentation
  citation: GNPS2 Documentation. GNPS2 Food Readout. Accessed 10 September 2026.
  url: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/metaboapp_Food_Readout/
description: Food Readout joins GNPS library matches to food metadata and ontology categories. It offers feature-level
  and group-level views of candidate food-associated signals, including abundance plots and exploratory statistical
  displays.
common_uses:
- Explore food-associated annotations in nutrition or exposome studies.
- Inspect variation in candidate dietary markers across sample groups.
