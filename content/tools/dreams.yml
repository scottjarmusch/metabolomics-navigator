$schema: ../../schemas/tool.schema.json
slug: dreams
name: DreaMS
summary: A transformer-based framework for learning molecular representations from tandem mass spectra,
  supporting spectral similarity, clustering, molecular networking, and downstream prediction tasks.
links:
  primary: https://dreams-docs.readthedocs.io/
  homepage: https://dreams-docs.readthedocs.io/
  repository: https://github.com/pluskal-lab/DreaMS
  documentation: https://dreams-docs.readthedocs.io/
  web_app: https://huggingface.co/spaces/anton-bushuiev/DreaMS
resource_types:
- programming_package
- web_service
functions:
  primary: spectral_analysis
  secondary:
  - machine_learning
  - molecular_networking
  - annotation_identification
  capabilities:
  - library_matching
  - ms2_processing
platforms:
- platform_independent
analysis_types:
- untargeted
interfaces:
- python_package
- web_app
- notebook
access:
  model: open_source
  license: MIT
  notes: MIT-licensed code; pretrained weights and datasets are linked separately. The hosted demonstration
    is a separate execution route whose availability and submitted-data handling should be checked before
    use.
technical:
  operating_systems:
  - cross_platform
  programming_languages:
  - Python
data:
  input_types:
  - spectra
  output_types:
  - statistical_results
  input_formats:
  - mgf
  - hdf5
  other_output_formats:
  - Python embedding matrices and task-dependent similarity or prediction arrays
publications:
- doi: 10.1038/s41587-025-02663-3
  type: primary
  citation: Self-supervised learning of molecular representations from millions of tandem mass spectra
    using DreaMS. Nature Biotechnology (2025).
common_uses:
- Generate learned embeddings for MS/MS spectra.
- Compare spectra using embedding similarity or build large-scale molecular networks.
- Fine-tune pretrained representations for task-specific prediction.
maintenance:
  status: unclear
  repository_last_activity: '2026-06-05'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - Representation learning and similarity analysis of small-molecule tandem mass spectra.
  considerations:
  - Learned embedding similarity is a computational relationship and does not by itself establish molecular
    identity.
  not_designed_for:
  - Raw chromatographic feature detection or definitive molecular identification from embedding similarity.
  requirements:
  - The documented Python environment and pretrained model weights for local inference; MS/MS spectra
    with the required precursor metadata. Fine-tuning requires suitable labelled data and additional compute.
acquisition:
  ms_levels:
  - ms2
  strategies:
  - dda
  - targeted_msms
  - unspecified
  ion_mobility: not_required
description: DreaMS generates learned vector representations of tandem mass spectra for similarity analysis
  and downstream prediction. The project provides pretrained models, tutorials and a library-matching
  web demonstration; local embeddings can be reused in clustering and molecular-network analysis.
