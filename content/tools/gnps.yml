  developer_verified: false
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-08-04'
  updated_at: '2026-08-24'
  last_verified: '2026-08-24'
  last_editorial_review: '2026-08-24'
scope:
  designed_for:
  - MS/MS-centered annotation, molecular networking, public-data search, visualization, and community sharing of
    metabolomics and natural-products data.
  - Web-based workflows that integrate processed feature tables, spectra, sample metadata, and public mass-spectrometry
    datasets.
  requirements:
  - Inputs depend on the selected workflow; molecular-networking workflows generally require centroided MS/MS data,
    while FBMN also requires a feature table and representative MS/MS spectra.
  - Appropriate metadata, feature-processing parameters, and workflow settings should be recorded for reproducible
    analysis.
  considerations:
  - GNPS is an ecosystem rather than a single algorithm; publications should report the specific workflow, parameters,
    and task URL or identifier used.
  - GNPS2 is actively evolving, and workflow interfaces or recommended settings can change; consult the current
    documentation when reproducing older analyses.
acquisition:
  ms_levels:
  - ms2
  - msn
  strategies:
  - dda
  - dia
  - targeted_msms
  - unspecified
  ion_mobility: supported
description: GNPS is a web-based ecosystem for analysis, organization, annotation, visualization, and sharing of
  tandem mass-spectrometry data. The current GNPS2 infrastructure includes classical and feature-based molecular
  networking, spectral-library searching, MASST and other web workflows, and it interoperates with public repositories
  and feature-processing tools such as MZmine, MS-DIAL, XCMS, and OpenMS.
aliases:
- Global Natural Products Social Molecular Networking
- GNPS2
