scope:
  designed_for:
  - MS/MS-centered annotation, molecular networking, public-data search, and community sharing of metabolomics and natural-products data.
  requirements:
  - Most workflows require centroided/open mass-spectrometry formats and appropriate metadata or feature tables for the selected analysis.
  considerations:
  - GNPS is an ecosystem rather than a single algorithm; users should cite and report the specific workflow, version or task URL used.
acquisition:
  ms_levels:
  - ms2
  - msn
  strategies:
  - dda
  - dia
  - targeted_msms
  - unspecified
  ion_mobility: supported
description: GNPS is an open web ecosystem for community analysis, organization, searching, annotation, and sharing of tandem mass-spectrometry data. It hosts spectral libraries and multiple analysis workflows, including molecular networking and repository-scale search, and interoperates with public MassIVE datasets and structured sample metadata.
aliases:
- Global Natural Products Social Molecular Networking
