- web_service
- spectral_library
- database_knowledgebase
- workflow_platform
functions:
  primary: molecular_networking
  secondary:
  - annotation_identification
  - spectral_analysis
  - reference_data_search
  - data_management_sharing
  - workflow_reproducibility
  capabilities:
  - library_matching
  - repository_scale_search
  - metadata_contextualization
  - network_visualization
  - provenance_tracking
platforms:
- multi_platform
analysis_types:
- untargeted
- metabolite_profiling
- lipidomics
interfaces:
