description: CordBat implements concordance-based correction of batch effects in quantified metabolomics
  matrices. Its R interface takes batch and biological-group information and a selected reference batch,
  returning corrected measurements for further analysis.
scope:
  designed_for:
  - An R package implementing concordance-based batch-effect correction for large-scale metabolomics studies.
  not_designed_for:
  - Raw feature extraction or reliable separation of biological and technical effects in an unidentifiable,
    fully confounded design.
  requirements:
  - R, an appropriately transformed numeric sample-by-feature matrix, batch labels and the biological
    grouping/reference-batch information expected by the documented function.
  considerations:
  - Check matrix orientation and transformation, reference-batch choice and preservation of biological
    contrasts. A better batch-mixing plot alone does not establish a scientifically valid correction.
