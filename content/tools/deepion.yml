description: DeepION learns compact representations of MSI ion images for finding co-localized ions or
  candidate isotope relationships. Separate COL and ISO modes use augmented images and learned embeddings
  for downstream similarity analysis.
scope:
  designed_for:
  - DeepION learns compact representations of MSI ion images for finding co-localized ions or candidate
    isotope relationships.
  not_designed_for:
  - Direct raw-imzML processing, isotopologue abundance correction or proof that co-localized ions belong
    to the same molecule.
  requirements:
  - The documented Python/PyTorch environment, a preprocessed pixel-by-ion matrix, peak list, image dimensions
    and ionization-mode settings.
  considerations:
  - Image shape, preprocessing and missing pixels influence learned similarity. The documented legacy
    dependency combination needs compatibility checking before a new installation.
common_uses:
- DeepION learns compact representations of MSI ion images for finding co-localized ions or candidate
  isotope relationships.
publications:
- doi: 10.1021/acs.analchem.3c05002
  type: primary
  citation: 'DeepION: A Deep Learning-Based Low-Dimensional Representation Model of Ion Images for Mass
    Spectrometry Imaging. Analytical Chemistry (2024).'
