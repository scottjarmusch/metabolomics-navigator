$schema: ../../schemas/tool.schema.json
slug: met4dx
name: Met4DX
summary: Process LC-ion-mobility-MS data across supported four-dimensional acquisition modes.
description: Met4DX provides R workflows for feature detection, MS/MS generation and annotation in supported
  PASEF-DDA, PASEF-DIA and IM-AIF datasets.
links:
  primary: https://github.com/ZhuMetLab/Met4DX
  repository: https://github.com/ZhuMetLab/Met4DX
  documentation: https://github.com/ZhuMetLab/Met4DX#readme
platforms:
- lc_ms
interfaces:
- r_package
resource_types:
- software_application
functions:
  primary: preprocessing
  capabilities:
  - peak_detection
  - ms2_processing
access:
  model: source_available
  notes: Repository LICENCE specifies CC BY-NC-ND 4.0, including noncommercial and no-derivatives restrictions.
    Public availability is not an unrestricted open-source license.
  license: CC-BY-NC-ND-4.0
data:
  input_types:
  - raw_instrument_data
  - compound_list
  output_types:
  - feature_table
  - spectra
  other_input_formats:
  - Instrument-specific .d data or converted IM-AIF mzML, with mode-specific tables
  other_output_formats:
  - Processed feature tables and generated MS/MS spectra
common_uses:
- Process LC-ion-mobility-MS data across supported four-dimensional acquisition modes.
scope:
  designed_for:
  - Met4DX provides R workflows for feature detection, MS/MS generation and annotation in supported PASEF-DDA,
    PASEF-DIA and IM-AIF datasets.
  not_designed_for:
  - Universal processing of arbitrary ion-mobility instruments or unverified metabolite identification.
  requirements:
  - Supported timsTOF or Agilent DTIM-MS acquisition and the documented R/Docker environment.
  - Precursor lists for list-driven modes; CCS calibration coefficients for IM-AIF.
  considerations:
  - Annotation-library and retention-time calibration requirements depend on the workflow selected.
publications:
- doi: 10.1021/jasms.4c00290
  type: primary
  citation: 'Met4DX: A Unified and Versatile Data Processing Tool for Multidimensional Untargeted Metabolomics
    Data. Journal of the American Society for Mass Spectrometry (2024).'
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake checked against official documentation, license information and primary DOI/title/year
    on 2026-10-22. Editorial review only; no execution or independent benchmark.
maintenance:
