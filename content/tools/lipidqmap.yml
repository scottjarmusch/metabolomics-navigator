  last_editorial_review: '2026-10-27'
description: LipidQMap visualizes and quantifies lipid mass-spectrometry images using user-defined internal
  standards. It supports type-II isotopic-overlap corrections, selected protonated/sodiated overlap correction
  and comparison of raw, corrected and quantified images.
scope:
  designed_for:
  - LipidQMap visualizes and quantifies lipid mass-spectrometry images using user-defined internal standards.
  not_designed_for:
  - Absolute quantitation without appropriate standards or general structural identification from an ion-image
    mass match.
  requirements:
  - Supported desktop application or source environment, imzML or schema-compatible AnnData/MuData MSI
    data, an editable lipid list and appropriate internal standards for quantitation.
  considerations:
  - Mass tolerances, isotope corrections, optional interpolation and calibration settings affect images.
    AnnData/MuData imports require the documented mass, ion-mode and spatial metadata.
common_uses:
- LipidQMap visualizes and quantifies lipid mass-spectrometry images using user-defined internal standards.
publications:
- doi: 10.1101/2025.10.15.682422
