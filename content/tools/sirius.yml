scope:
  designed_for:
  - Molecular-formula and structure-candidate annotation from accurate-mass MS/MS data, including compound-class
    prediction when exact structures remain uncertain.
  not_designed_for:
  - Peptides, polymers, or stereochemical elucidation; SIRIUS is designed primarily for accurate-mass small molecules,
    usually below about 1000 Da.
  requirements:
  - High-mass-accuracy MS and preferably informative MS/MS data; the current documentation recommends mass deviations
    within about 20 ppm.
  - A SIRIUS account/license and internet connection are required for webservice-backed features such as CSI:FingerID,
    CANOPUS, and MSNovelist; these remain free for academic use under current terms.
  considerations:
  - Formula, library, class, and structure results represent computational evidence and should be combined with
    orthogonal evidence and appropriate metabolite-identification confidence levels.
  - SIRIUS contains both local open-source analysis and proprietary/webservice-backed functions, so access requirements
    differ among workflow components.
  - DIA spectra require prior deconvolution; the documented default workflow expects centroided, high-accuracy spectra
    with little chimeric signal.
acquisition:
