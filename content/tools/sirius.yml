common_uses:
- Annotate and rank molecular formulas using isotope patterns and fragmentation trees.
- Search molecular-structure databases with CSI:FingerID and assess high-confidence candidates with COSMIC.
- Predict compound classes with CANOPUS when exact structures cannot be confidently assigned.
- Generate de novo structure candidates with MSNovelist for molecules poorly represented in structure databases.
