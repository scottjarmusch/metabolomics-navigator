description: SIRIUS is a Java-based small-molecule MS/MS framework integrating local and webservice-backed analysis.
  Current SIRIUS 6 can import centroided mzML/mzXML runs, perform feature detection/alignment with lcms-align, search
  spectral libraries by identity or analog similarity, annotate molecular formulas with fragmentation trees and
  isotope patterns, re-rank formulas with ZODIAC, search structure databases through CSI:FingerID/COSMIC, predict
  compound classes with CANOPUS, and generate de novo candidates with MSNovelist. GUI, CLI, and API-oriented project-space
  workflows share a common analysis environment.
