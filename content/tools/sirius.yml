description: SIRIUS is a Java-based framework for small-molecule MS/MS analysis that integrates molecular-formula
  annotation, ZODIAC formula re-ranking, CSI:FingerID molecular-fingerprint prediction and structure-database searching,
  COSMIC confidence scoring, CANOPUS compound-class prediction, and MSNovelist de novo structure generation. SIRIUS
  6 provides GUI, CLI, and API-oriented workflows and can import preprocessed spectra or centroided mzML/mzXML LC-MS
  runs into a shared project space.
