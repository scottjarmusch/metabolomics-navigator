$schema: ../../schemas/tool.schema.json
slug: sirius
name: SIRIUS
summary: A desktop and command-line framework for molecular-formula annotation, structure-database searching, compound-class prediction, and confidence estimation from tandem mass spectra.
links:
  primary: https://v6.docs.sirius-ms.io/
  homepage: https://www.bright-giant.com/sirius/
  repository: https://github.com/sirius-ms/sirius
  documentation: https://v6.docs.sirius-ms.io/
resource_types: [software_application]
functions:
  primary: annotation_identification
  secondary: [spectral_analysis, machine_learning]
  capabilities: [molecular_formula_prediction, structure_elucidation, identification_confidence]
platforms: [lc_ms, direct_infusion_ms]
analysis_types: [untargeted, metabolite_profiling]
interfaces: [desktop_gui, command_line]
access:
  model: free_academic
  notes: Local features and webservice-backed features have different access and licensing conditions. The official documentation should be checked for the current academic and commercial terms.
technical:
  operating_systems: [windows, macos, linux, cross_platform]
  programming_languages: [Java]
  api_available: false
data:
  input_types: [spectra, feature_table]
  output_types: [compound_list, molecular_structures, report]
  input_formats: [mzml, mgf, msp]
  output_formats: [csv_tsv, json]
publications:
  - doi: 10.1038/s41592-019-0344-8
    type: methods
common_uses:
  - Rank candidate molecular formulas from isotope and fragmentation patterns.
  - Search molecular-structure databases using predicted fingerprints.
  - Predict compound classes for spectra without confident structure matches.
