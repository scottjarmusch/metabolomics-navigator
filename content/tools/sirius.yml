scope:
  designed_for:
  - Molecular-formula and structure-candidate annotation from accurate-mass MS/MS data, including compound-class
    prediction when exact structures remain uncertain.
  not_designed_for:
  - General-purpose raw vendor-file handling or fully configurable chromatographic preprocessing; dedicated tools
    such as MZmine, OpenMS, XCMS, or MS-DIAL are often used upstream, although SIRIUS 6 can perform zero-parameter
    feature detection/alignment from centroided mzML or mzXML runs.
  requirements:
  - Centroided high-resolution MS and preferably MS/MS data; accepted inputs include preprocessed .ms/.mgf/.msp/.mat-style
    peak lists and centroided mzML/mzXML runs.
  - A SIRIUS account/license and internet connection are required for webservice-based features including CSI:FingerID,
    CANOPUS, and MSNovelist; these services are free for academic use under the current terms, with commercial access
    provided separately.
  considerations:
  - Candidate formula, class, or structure rankings are computational annotations and should be interpreted together
    with orthogonal evidence and appropriate confidence levels.
  - Local and webservice-backed parts of SIRIUS have different access and licensing requirements; current terms
    should be checked before deployment in non-academic settings.
