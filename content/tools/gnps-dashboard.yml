$schema: ../../schemas/tool.schema.json
slug: gnps-dashboard
name: GNPS Dashboard
summary: A browser-based interactive viewer for raw and public mass-spectrometry data, chromatograms, spectra, quantitative
  traces, and GNPS-associated datasets without requiring local analysis software.
description: GNPS Dashboard provides interactive browser-based exploration of mass-spectrometry files and public
  repository data. It can render chromatographic and spectral views, inspect individual scans, generate TIC/XIC-style
  traces, support targeted/SRM-style visualization, and link directly from GNPS analyses and public datasets. It
  also helps users identify and share spectra through Universal Spectrum Identifiers and connect raw-data inspection
  with downstream GNPS2 workflows.
links:
  primary: https://dashboard.gnps2.org/
  web_app: https://dashboard.gnps2.org/
  repository: https://github.com/Wang-Bioinformatics-Lab/GNPS_LCMSDashboard
  documentation: https://ccms-ucsd.github.io/GNPSDocumentation/lcms-dashboard/
resource_types:
- web_service
functions:
  primary: visualization_reporting
  secondary:
  - data_management_sharing
  - preprocessing
  capabilities:
  - interactive_dashboard
  - chromatogram_building
  - provenance_tracking
platforms:
- multi_platform
analysis_types:
- untargeted
- targeted
- metabolite_profiling
interfaces:
