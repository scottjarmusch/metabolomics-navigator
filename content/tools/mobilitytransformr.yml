description: MobilityTransformR converts CE-MS migration times to an effective-mobility scale using added
  mobility markers. Its R/Bioconductor workflow transforms numeric vectors or supported spectral objects
  and can export transformed runs for downstream analysis.
scope:
  designed_for:
  - MobilityTransformR converts CE-MS migration times to an effective-mobility scale using added mobility
    markers.
  not_designed_for:
  - Ion-mobility CCS prediction or correction without suitable electrophoretic marker and acquisition
    information.
  requirements:
  - R 4.2 or newer with the documented Bioconductor packages, marker migration times and known mobility
    information; voltage/capillary parameters are needed for relevant single-marker modes.
  considerations:
  - Identify marker peaks carefully and retain units. The exported time axis represents effective electrophoretic
    mobility rather than ordinary chromatographic retention time.
common_uses:
- MobilityTransformR converts CE-MS migration times to an effective-mobility scale using added mobility
  markers.
publications:
