$schema: ../../schemas/tool.schema.json
slug: ropls
name: ropls
summary: Fit and assess multivariate PCA, PLS and OPLS models for omics data in R.
description: ropls provides scores, loadings, component assessment, permutation tests and variable-importance
  measures for exploratory and supervised analysis.
links:
  primary: https://bioconductor.org/packages/ropls/
  documentation: https://bioconductor.org/packages/ropls/
resource_types:
- programming_package
functions:
  primary: statistics
  capabilities:
  - multivariate_statistics
  - feature_selection
platforms:
- platform_independent
interfaces:
- r_package
access:
  model: open_source
  notes: Bioconductor package; installation and licensing details are provided on the package page.
data:
  input_types:
  - feature_table
  - sample_metadata
  output_types:
  - statistical_results
  - report
  input_formats:
  - other
  output_formats:
  - other
  other_input_formats:
  - Numeric matrix and optional response vector
  other_output_formats:
  - PCA/PLS/OPLS models, statistics and plots
publications:
- citation: 'ropls developers. ropls: PCA, PLS(-DA) and OPLS(-DA) for multivariate analysis and feature selection
    of omics data. Bioconductor package record.'
  type: other
  doi: 10.18129/B9.bioc.ropls
common_uses:
- Explore sample patterns with PCA.
- Evaluate supervised models with validation and permutation testing.
scope:
  designed_for:
  - Explore sample patterns with PCA.
  not_designed_for:
  - Proving predictive performance from separation in a training-set scores plot.
  requirements:
  - A numeric measurement matrix and appropriate responses for supervised models.
  considerations:
  - Avoid information leakage during preprocessing and feature selection; use independent validation when assessing
    generalization.
