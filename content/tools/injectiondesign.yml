slug: injectiondesign
name: InjectionDesign
summary: A web service for designing LC-MS and GC-MS multi-omics injection sequences with QC placement,
  inter-batch balancing, intra-batch randomization, and downloadable worksheets.
links:
  primary: http://www.injection.design/
  web_app: http://www.injection.design/
  repository: https://github.com/CSi-Studio/InjectionDesign
  documentation: https://github.com/CSi-Studio/InjectionDesign#readme
resource_types:
- web_service
functions:
  primary: quality_control
  secondary:
  - data_management_sharing
  capabilities:
  - metadata_contextualization
platforms:
- lc_ms
- gc_ms
analysis_types:
- multiomics
interfaces:
- web_app
access:
  model: free_web_service
  notes: The repository carries MulanPSL-2.0 terms and describes a free hosted service. Hosted availability
    and user-data handling were not operationally tested.
  license: MulanPSL-2.0
technical:
