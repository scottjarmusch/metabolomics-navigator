  - browser
  - cross_platform
data:
  input_types:
  - sample_metadata
  output_types:
  - sample_metadata
  input_formats:
  - other
  output_formats:
  - other
  other_input_formats:
  - Excel worksheet
  other_output_formats:
  - Excel worksheet
common_uses:
- Randomize and balance study samples across analytical batches.
- Place pooled, blank, solvent, reference, and custom QC samples within an injection sequence.
maintenance:
