  last_checked: '2026-10-22'
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-22'
  updated_at: '2026-10-22'
  last_verified: '2026-10-22'
  last_editorial_review: '2026-10-22'
related_tools:
- slug: skyline
  relationship: dependency
  note: Uses Skyline documents, transition lists and report templates for data analysis.
