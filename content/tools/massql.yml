common_uses:
- Encode reusable searches for MS1 isotopic/adduct patterns, MS/MS fragments, neutral losses, mass defects, and
  combinations of these constraints.
- Combine spectral constraints with retention-time and ion-mobility conditions and Boolean logic.
- Run the same conceptual query in local files, software implementations, or repository-scale workflows without
  writing a bespoke analysis script.
