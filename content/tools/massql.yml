scope:
  designed_for:
  - Flexible, human-readable interrogation of mass-spectrometry data using chemically or biologically motivated
    signal patterns.
  requirements:
  - A MassQL-compatible engine or application and mass-spectrometry data in a supported format.
  considerations:
  - MassQL retrieves spectra/scans that satisfy user-defined constraints; the specificity and biological interpretation
    depend on the query design.
  - Different software packages implement the shared MassQL grammar with their own optimized query engines, so supported
    syntax should be checked against the implementation in use.
