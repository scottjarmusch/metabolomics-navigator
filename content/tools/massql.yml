aliases:
- Mass Query Language
description: MassQL (Mass Spectrometry Query Language) is a domain-specific language for expressing chemically meaningful
  patterns directly in mass-spectrometry data. Queries can combine precursor and fragment masses, neutral-loss-like
  constraints, intensity rules, Boolean logic, retention-time constraints, and ion-mobility constraints. The ecosystem
  includes a reference Python engine, web interfaces, repository-scale workflows, a Nextflow implementation, APIs,
  a community query compendium, and native implementations in multiple metabolomics software platforms.
