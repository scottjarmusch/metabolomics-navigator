provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official repository documentation, package/license metadata and
    primary publication identity on 2026-10-27. Editorial source review only; no software execution or
    independent benchmark. See docs/enveda-expansion-review-2026-10-27-batch2.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
description: Amanida combines study-level metabolomics results when individual measurements or variance
  estimates are unavailable. It performs significance/fold-change meta-analysis and qualitative trend
  vote-counting, with plots and reports for comparing results across studies.
scope:
  designed_for:
  - An R package for quantitative and qualitative meta-analysis of metabolomics studies when only significance,
    effect-size, identifier, or direction information is available.
  not_designed_for:
  - Reprocessing raw MS data or removing heterogeneity and publication bias merely by pooling reported
    p-values.
  requirements:
  - R plus harmonized metabolite identifiers, study references and either p-values/fold changes/sample
    sizes or qualitative trend labels; input column order must follow the selected mode.
  considerations:
  - Align metabolite identities and fold-change direction before combination. Study dependence, selective
    reporting and incompatible designs affect interpretation; optional identifier harmonization can query
    PubChem.
publications:
- doi: 10.1093/bioinformatics/btab591
  type: primary
  citation: 'Amanida: an R package for meta-analysis of metabolomics non-integral data. Bioinformatics
    (2021).'
