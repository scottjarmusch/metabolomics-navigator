slug: aerith
name: Aerith
summary: An R package for reading, annotating, scoring, and visualizing isotopic mass spectra in stable-isotope-probing
  workflows for metabolites and peptides.
links:
  primary: https://github.com/thepanlab/Aerith
  repository: https://github.com/thepanlab/Aerith
  documentation: https://github.com/thepanlab/Aerith#readme
resource_types:
- programming_package
functions:
  primary: isotope_tracing_flux
  secondary:
  - spectral_analysis
  - visualization_reporting
  capabilities:
  - in_silico_spectra
  - spectral_data_io
platforms:
- multi_platform
analysis_types:
- stable_isotope_tracing
interfaces:
- r_package
access:
  model: open_source
  license: GPL-3.0
  notes: GPL-3.0 repository. External raw-file converters and peptide-analysis tools used in examples
    are separate dependencies rather than mandatory parts of every metabolite simulation.
technical:
  operating_systems:
  - cross_platform
  programming_languages:
  - R
  - C++
data:
  input_types:
  - spectra
  - isotope_tracing_data
  output_types:
  - isotope_tracing_data
  - report
  other_input_formats:
