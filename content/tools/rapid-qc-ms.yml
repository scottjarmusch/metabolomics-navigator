$schema: ../../schemas/tool.schema.json
slug: rapid-qc-ms
name: Rapid QC-MS
summary: Monitor LC-MS acquisition quality through an interactive dashboard.
description: Rapid QC-MS tracks internal-standard metrics and reference samples during or after acquisition,
  with configurable QC checks and notifications.
links:
  primary: https://czbiohub-sf.github.io/Rapid-QC-MS/
  repository: https://github.com/czbiohub-sf/Rapid-QC-MS
  documentation: https://czbiohub-sf.github.io/Rapid-QC-MS/
platforms:
- lc_ms
interfaces:
- web_app
- command_line
resource_types:
- software_application
functions:
  primary: quality_control
  capabilities:
  - interactive_dashboard
access:
  model: open_source
  license: BSD-3-Clause
  notes: The repository license contains BSD-3-Clause terms. Third-party vendor readers and optional cloud
    services have separate requirements. Not execution-tested.
data:
  input_types:
  - raw_instrument_data
  - sample_metadata
  - spectral_library
  output_types:
  - report
  other_input_formats:
  - Vendor raw data and acquisition sequence CSV
  - Configured reference samples and internal standards
  other_output_formats:
  - Dashboard QC metrics and plots; optional notification and cloud-sync outputs
common_uses:
- Monitor LC-MS acquisition quality through an interactive dashboard.
scope:
  designed_for:
  - Rapid QC-MS tracks internal-standard metrics and reference samples during or after acquisition, with
    configurable QC checks and notifications.
  not_designed_for:
  - Automatic validation of biological conclusions or a replacement for experiment design and independent
    QC review.
  requirements:
  - Windows acquisition/processing setup with Python, MSConvert and MS-DIAL; configure standards and thresholds
    for the assay.
  considerations:
  - Extensive testing documented primarily for Thermo instruments, acquisition sequences and RAW files;
    other vendors may require adaptation.
  - Notification and cloud-sync integrations require separate configuration.
publications:
- doi: 10.1021/acs.analchem.4c00786
  type: primary
  citation: 'Rapid QC-MS: Interactive Dashboard for Synchronous Mass Spectrometry Data Acquisition Quality
    Control. Analytical Chemistry (2024).'
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake checked against official documentation, license information and primary DOI/title/year
    on 2026-10-22. Editorial review only; no execution or independent benchmark.
maintenance:
  status: unclear
  last_checked: '2026-10-22'
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-22'
  updated_at: '2026-10-22'
  last_verified: '2026-10-22'
  last_editorial_review: '2026-10-22'
analysis_types:
- untargeted
related_tools:
- slug: ms-dial
  relationship: dependency
  note: The documented processing workflow requires MS-DIAL.
