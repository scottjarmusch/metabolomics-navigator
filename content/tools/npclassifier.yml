$schema: ../../schemas/tool.schema.json
slug: npclassifier
name: NPClassifier
summary: Deep neural-network tool that classifies natural-product structures into biosynthetic pathways, superclasses
  and structural classes.
links:
  primary: https://npclassifier.gnps2.org/
  documentation: https://github.com/mwang87/NP-Classifier
  repository: https://github.com/mwang87/NP-Classifier
resource_types:
- web_service
- api_service
functions:
  primary: annotation_identification
  capabilities:
  - compound_class_prediction
platforms:
- platform_independent
interfaces:
- web_app
- api
access:
  model: open_source
  license: MIT
  notes: The hosted classifier is publicly accessible. The repository specifies MIT for software and CC0 for its
    data, models and ontology. Local deployment is documented; the repository also states that queried structures
    are logged by the hosted service.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Editorial review of official documentation, repository and the direct tool publication on 2026-09-10. No
    analysis job, independent benchmark or developer verification was performed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-08'
  updated_at: '2026-09-10'
  last_verified: '2026-09-10'
  last_editorial_review: '2026-09-10'
data:
  input_types:
  - molecular_structures
  output_types:
  - compound_list
  input_formats:
  - smiles_inchi
  output_formats:
  - json
  other_input_formats:
  - SMILES strings (InChI input is not asserted)
publications:
- citation: 'Kim HW, Wang M, Leber CA, et al. NPClassifier: A Deep Neural Network-Based Structural Classification
    Tool for Natural Products. Journal of Natural Products 84, 2795–2807 (2021).'
  type: primary
  doi: 10.1021/acs.jnatprod.1c00399
  pmid: '34662515'
related_tools:
- slug: gnps
  relationship: part_of
  note: Standalone classifier hosted within the GNPS2 ecosystem.
maintenance:
  status: active
  last_checked: '2026-09-10'
description: NPClassifier assigns natural-product pathway, superclass and class labels from a supplied chemical
  structure. Within MS metabolomics it can organize already annotated compounds or candidate structures. It does
  not infer a structure directly from a mass spectrum.
common_uses:
- Group candidate or annotated metabolites by natural-product chemical class.
- Add structure-derived class labels to downstream metabolomics summaries.
scope:
  designed_for:
  - Biosynthetically informed classification of supplied natural-product structures.
  not_designed_for:
  - Annotating an unknown MS/MS spectrum without a candidate structure.
  - Proving that a predicted class establishes biological origin or a biosynthetic route.
  requirements:
  - A valid molecular structure supplied as SMILES.
  - For local hosting, the model files and deployment dependencies described in the repository.
  considerations:
  - Classification depends on the supplied structure; an incorrect structural annotation carries through to its
    class labels.
  - The natural-product ontology has its own class definitions and coverage; preserve that context when comparing
    classifications.
