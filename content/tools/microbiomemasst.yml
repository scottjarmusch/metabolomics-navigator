$schema: ../../schemas/tool.schema.json
slug: microbiomemasst
name: microbiomeMASST
summary: A GNPS-associated metadata-network search resource for mapping query metabolites and MS/MS spectra across
  microbiome metabolomics studies, sample contexts, hosts, and microbial metadata.
description: microbiomeMASST extends domain-specific repository searching from curated monocultures to a harmonized
  network of microbiome metabolomics datasets and metadata. It is designed to reveal where molecules occur across
  host-associated and microbial study contexts and to make large public microbiome metabolomics collections searchable
  through spectrum-to-metadata relationships. The scientific description is currently available as a 2026 preprint.
links:
  primary: https://apps.gnps2.org/microbiomemasst
  web_app: https://apps.gnps2.org/microbiomemasst
  repository: https://github.com/robinschmid/microbe_masst
