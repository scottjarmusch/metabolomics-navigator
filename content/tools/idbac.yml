$schema: ../../schemas/tool.schema.json
slug: idbac
name: IDBac
summary: Web-based MALDI-TOF mass spectrometry platform and community knowledgebase for bacterial identification,
  culture-collection analysis, and comparison of specialized-metabolite profiles.
description: IDBac combines bacterial MALDI protein fingerprints with specialized-metabolite profiles to compare
  cultured isolates. Its web platform provides reference matching, protein-similarity views and metabolite-association
  analysis. This entry covers the current platform and its earlier R/desktop methods; older installation instructions
  are not interchangeable with the current GNPS2 interface.
links:
  primary: https://idbac.org/
  web_app: https://analysis.idbac.org/
  homepage: https://idbac.org/
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/idbacanalysisplatform/
  repository: https://github.com/Wang-Bioinformatics-Lab/IDBac_Interactive_Interface
resource_types:
- web_service
- database_knowledgebase
- workflow_platform
functions:
