description: This research implementation pretrains a graph neural network and adapts it for retention-time
  prediction with a smaller target dataset. It provides preprocessing, training and transfer/evaluation
  scripts rather than a turnkey chromatography-independent predictor.
scope:
  designed_for:
  - A research implementation of transfer-learning graph neural networks for chromatographic retention-time
    prediction from molecular structure using small target training datasets.
  not_designed_for:
  - A universal retention-time scale, raw chromatographic alignment or compound identification based only
    on predicted time.
  requirements:
  - Python, PyTorch, DGL and RDKit with appropriately prepared molecular structures and retention-time
    training/target data; configure the selected target dataset before transfer learning.
  considerations:
  - Retention depends on the chromatographic method. Avoid structural or sample leakage between training
    and test sets, and assess applicability to the target LC conditions.
common_uses:
- A research implementation of transfer-learning graph neural networks for chromatographic retention-time
  prediction from molecular structure using small target training datasets.
publications:
- doi: 10.1021/acs.analchem.3c03177
  type: primary
  citation: Retention Time Prediction through Learning from a Small Training Data Set with a Pretrained
