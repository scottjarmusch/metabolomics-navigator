$schema: ../../schemas/tool.schema.json
slug: mona
name: MoNA
summary: Search aggregated mass spectra and download reference libraries for local annotation workflows.
description: MassBank of North America brings spectra, structures and metadata together in a searchable resource.
  Web queries and documented REST queries help retrieve records by metadata, while downloadable collections support
  use in other tools.
links:
  primary: https://massbank.us/
  homepage: https://massbank.us/
  documentation: https://mona.fiehnlab.ucdavis.edu/documentation/query
resource_types:
- spectral_library
- database_knowledgebase
functions:
  primary: reference_data_search
  capabilities:
  - metadata_contextualization
  - provenance_tracking
platforms:
- lc_ms
- gc_ms
interfaces:
- web_app
- api
access:
  model: free_web_service
  notes: Public browsing and downloads are available. Check the originating collection and applicable reuse terms
    rather than assuming a single license covers all aggregated records.
data:
  input_types:
  - compound_list
  - sample_metadata
  output_types:
  - spectra
  - spectral_library
  other_input_formats:
  - Compound and spectrum metadata query
  output_formats:
  - json
  - msp
  - sdf
common_uses:
- Retrieve spectra using compound identifiers or acquisition metadata.
- Download a library subset appropriate for an annotation tool.
scope:
  designed_for:
  - Reference-library discovery and metadata-based retrieval.
  not_designed_for:
  - A repository for a complete study and its raw sample files.
  requirements:
  - Select the relevant spectral collection and export format; use pagination for programmatic queries.
  considerations:
  - Inspect record origin and evidence type. Overlap between source collections means aggregated records are not
    necessarily independent reference measurements.
publications: []
related_tools:
- slug: massbank
  relationship: complementary
- slug: metfrag
  relationship: complementary
credits: []
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Editorial review on 7 September 2026 against official documentation and the sources listed here. Scope
    and practical guidance are editorial synthesis; software execution and service availability were not validated.
    No dedicated MoNA resource paper was confirmed in this pass; official query and download documentation support
    this entry. Cite the original reference data used.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-07'
  updated_at: '2026-09-07'
  last_editorial_review: '2026-09-07'
aliases:
- MassBank of North America
