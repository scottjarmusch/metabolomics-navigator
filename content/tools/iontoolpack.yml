description: IonToolPack groups graphical mass-spectrometry utilities for raw-data visualization, PeakQC
  quality assessment, tandem-library matching, targeted MS1 extraction and feature-list comparison. The
  suite supports LC-MS, ion-mobility and direct-infusion workflows through documented readers.
scope:
  designed_for:
  - IonToolPack groups graphical mass-spectrometry utilities for raw-data visualization, PeakQC quality
    assessment, tandem-library matching, targeted MS1 extraction and feature-list comparison.
  not_designed_for:
  - Automatic confirmation of library matches or calibrated concentration determination from peak abundance
    alone.
  requirements:
  - A compatible desktop release and supported raw files; targeted extraction needs target settings and
    tandem matching needs MSP or CSV reference libraries.
  considerations:
  - Module capabilities differ. Vendor-reader compatibility, QC thresholds and matching tolerances must
    be checked for the acquisition; the listed primary paper describes PeakQC within the suite.
common_uses:
- IonToolPack groups graphical mass-spectrometry utilities for raw-data visualization, PeakQC quality
  assessment, tandem-library matching, targeted MS1 extraction and feature-list comparison.
publications:
- doi: 10.1021/jasms.4c00146
  type: primary
  citation: 'PeakQC: A Software Tool for Omics-Agnostic Automated Quality Control of Mass Spectrometry
    Data. Journal of the American Society for Mass Spectrometry (2024).'
  note: PeakQC module within the IonToolPack suite; not a publication introducing every later suite component.
