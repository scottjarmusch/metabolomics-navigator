$schema: ../../schemas/tool.schema.json
slug: metabonaut
name: Metabonaut
summary: An open educational and reproducible workflow resource for script-based untargeted LC-MS/MS metabolomics
  using R and Bioconductor packages across preprocessing, QC, statistics, and annotation.
links:
  primary: https://rformassspectrometry.github.io/Metabonaut/
  homepage: https://rformassspectrometry.github.io/Metabonaut/
  repository: https://github.com/rformassspectrometry/Metabonaut
  documentation: https://rformassspectrometry.github.io/Metabonaut/
resource_types:
- workflow_pipeline
functions:
  primary: workflow_reproducibility
  secondary:
  - preprocessing
  - quality_control
  - statistics
  - annotation_identification
  capabilities:
  - provenance_tracking
  - chromatogram_building
  - peak_detection
  - retention_time_alignment
  - gap_filling
  - library_matching
platforms:
- lc_ms
analysis_types:
- untargeted
- metabolite_profiling
interfaces:
- r_package
- notebook
access:
  model: source_available
  license: CC-BY-SA-4.0
  notes: The resource is distributed under CC-BY-SA-4.0. Container and workshop routes provide environments;
    dependencies retain their own licenses and external services may have separate terms.
technical:
  operating_systems:
  - linux
  - macos
  - windows
  - containers
  programming_languages:
  - R
  containers:
  - Docker
data:
  input_types:
  - raw_instrument_data
  - spectra
  - sample_metadata
  output_types:
  - feature_table
  - statistical_results
  - compound_list
  - report
  input_formats:
  - mzml
  - csv_tsv
  other_output_formats:
  - R analysis objects, feature tables and rendered workflow documents
publications:
- doi: 10.1007/s11306-026-02538-x
  type: primary
  citation: 'Metabonaut: an open educational resource for learning reproducible, script-based untargeted
    LC-MS/MS metabolomics. Metabolomics (2026).'
common_uses:
- Learn a reproducible end-to-end untargeted LC-MS/MS workflow in R.
- Reuse worked examples for preprocessing, quality control, statistics, and annotation.
maintenance:
  status: unclear
  repository_last_activity: '2026-10-05'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - Learning and reproducing script-based untargeted LC-MS/MS analysis with R/Bioconductor.
  considerations:
  - Workshop sessions are ephemeral; export work before stopping them. Adapting workflows requires checking
    acquisition-specific parameters and reference resources.
  not_designed_for:
  - A single replacement processing engine or automatic transfer of tutorial parameters to every study.
  requirements:
  - Basic R and Quarto/RMarkdown familiarity; use the documented local R environment, Docker image or
    Bioconductor workshop session with its example data and dependencies.
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - full_scan
  - dda
  - unspecified
  ion_mobility: unspecified
description: Metabonaut is an executable educational workflow resource for script-based untargeted LC-MS/MS
  analysis in R and Bioconductor. Its vignettes demonstrate preprocessing, annotation and statistics using
  a small example dataset and show how to adapt and connect existing packages.
