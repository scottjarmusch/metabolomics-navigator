$schema: ../../schemas/tool.schema.json
slug: msms-chooser
name: MSMS-Chooser
summary: A GNPS workflow for automatically selecting candidate reference MS/MS spectra from LC-MS data of known standards using supplied molecular structures and expected precursor masses.
links:
  primary: https://ccms-ucsd.github.io/GNPSDocumentation/msmschooser/
  documentation: https://ccms-ucsd.github.io/GNPSDocumentation/msmschooser/
resource_types:
- web_service
- workflow_pipeline
