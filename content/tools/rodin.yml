  notes: 'Rodin is an actively maintained, MIT-licensed Python package (Python 3.10+) with a complementary web application.


    The toolkit supports analysis of processed metabolomics feature-intensity tables and sample metadata, including filtering, imputation, normalization, statistical testing (t-tests, ANOVA, and regression), machine learning (random forests), dimensionality reduction (PCA, UMAP, and t-SNE), interactive visualizations, and Mummichog-based metabolic pathway analysis.


    Input files include CSV-formatted feature tables and sample metadata. Rodin focuses on downstream analysis of processed data rather than raw mass spectrometry peak detection. Although developed for LC-MS metabolomics, its general statistical and visualization functions can also be applied to other numerical omics datasets.


    The software is described in a peer-reviewed publication in Bioinformatics Advances (2025), DOI: 10.1093/bioadv/vbaf088.'
