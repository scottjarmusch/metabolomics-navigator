summary: Rodin is an open-source Python library for metabolomics data preprocessing, statistical analysis, machine learning, interactive visualization, and metabolic pathway analysis. It supports reproducible workflows for untargeted LC-MS metabolomics and other feature-based omics datasets, with an optional web interface for researchers who prefer not to code.
