description: MESSES extracts tagged experimental metadata from spreadsheets or CSV into JSON, validates
  structured metadata against schemas and converts supported records to mwTab for Metabolomics Workbench
  deposition. Its command-line and Python interfaces separate extraction, validation and conversion.
scope:
  designed_for:
  - MESSES extracts tagged experimental metadata from spreadsheets or CSV into JSON, validates structured
    metadata against schemas and converts supported records to mwTab for Metabolomics Workbench deposition.
  not_designed_for:
  - Raw spectral processing or confirmation that scientifically incorrect metadata becomes correct merely
    because it passes a schema.
  requirements:
  - Python dependencies, tagged source tables and the extraction directives and validation schemas appropriate
    to the experiment and destination repository.
  considerations:
  - Tagging and schema setup require knowledge of the study. Review identifiers, units and repository-specific
    fields after extraction and conversion.
common_uses:
- MESSES extracts tagged experimental metadata from spreadsheets or CSV into JSON, validates structured
  metadata against schemas and converts supported records to mwTab for Metabolomics Workbench deposition.
publications:
- doi: 10.3390/metabo13070842
  type: primary
  citation: 'MESSES: Software for Transforming Messy Research Datasets into Clean Submissions to Metabolomics
    Workbench for Public Sharing. Metabolites (2023).'
