$schema: ../../schemas/tool.schema.json
slug: fraghub
name: FragHub
summary: Standardize and combine reference mass-spectral libraries.
description: FragHub harmonizes spectral metadata and chemical identifiers, filters peak lists and organizes
  reference spectra for downstream library use.
links:
  primary: https://github.com/eMetaboHUB/FragHub
  repository: https://github.com/eMetaboHUB/FragHub
  documentation: https://github.com/eMetaboHUB/FragHub#readme
platforms:
- lc_ms
- gc_ms
interfaces:
- desktop_gui
resource_types:
- software_application
functions:
  primary: spectral_analysis
  capabilities:
  - identifier_harmonization
  - spectral_data_io
access:
  model: source_available
  notes: Repository LICENSE states CC BY-NC 4.0, while the README badge names CeCILL. Treat licensing
    as inconsistent and confirm terms with maintainers before reuse; do not assume unrestricted open-source
    licensing.
  license: CC-BY-NC-4.0
data:
  input_types:
  - spectral_library
  output_types:
  - spectral_library
  other_input_formats:
  - MSP, MGF, JSON or documented CSV spectral-library files
  other_output_formats:
  - Standardized reference-library exports
common_uses:
- Standardize and combine reference mass-spectral libraries.
scope:
  designed_for:
  - FragHub harmonizes spectral metadata and chemical identifiers, filters peak lists and organizes reference
    spectra for downstream library use.
  not_designed_for:
  - Raw chromatographic feature extraction or proof of compound identity.
  requirements:
  - Reference libraries with the required spectrum and chemical metadata.
  considerations:
  - Filtering can discard spectra with missing metadata; review exclusions.
  - Source-library licenses still apply to combined or redistributed data.
publications:
- doi: 10.1021/acs.analchem.4c02219
  type: primary
  citation: 'FragHub: A Mass Spectral Library Data Integration Workflow. Analytical Chemistry (2024).'
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake candidate checked against official documentation, license information and primary
    publication on 2026-10-21. Editorial review only; no execution or independent benchmark.
maintenance:
  status: unclear
  last_checked: '2026-10-21'
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-21'
  updated_at: '2026-10-21'
  last_verified: '2026-10-21'
  last_editorial_review: '2026-10-21'
