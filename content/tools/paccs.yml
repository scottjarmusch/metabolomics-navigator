description: PACCS predicts CCS from molecular conformers using voxel-projected area, molecular-graph
  information, mass-to-charge ratio and adduct encoding. The Python/notebook workflow includes conformer
  generation, model training and database-scale prediction.
scope:
  designed_for:
  - PACCS predicts CCS from molecular conformers using voxel-projected area, molecular-graph information,
    mass-to-charge ratio and adduct encoding.
  not_designed_for:
  - Experimental CCS calibration or an estimate independent of conformer and adduct assumptions.
  requirements:
  - Python with RDKit, PyTorch and PyG, SMILES/adduct inputs and a compatible trained model; conformer
    generation and geometric feature calculation are required preprocessing steps.
  considerations:
  - Conformer generation, geometry optimization and training-domain coverage influence predictions. Compare
    with experimental data for the intended ion species and drift-gas conditions.
common_uses:
- PACCS predicts CCS from molecular conformers using voxel-projected area, molecular-graph information,
  mass-to-charge ratio and adduct encoding.
publications:
- doi: 10.1002/cem.70040
  type: primary
  citation: Accurate and Rational Collision Cross Section Prediction Using Voxel‐Projected Area and Deep
    Learning. Journal of Chemometrics (2025).
