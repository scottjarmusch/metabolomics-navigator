data:
  input_types:
  - feature_table
  - spectra
  output_types:
  - report
  other_input_formats:
  - GraphML network, MGF spectra and an overlay table with a node-ID column
  other_output_formats:
  - GNPS2 network results with supplied overlay attributes
common_uses:
- Add feature-level information to a completed molecular network.
scope:
  designed_for:
  - Overlaying table attributes on existing GNPS2 network nodes.
  not_designed_for:
  - Generating new measured evidence or validating uploaded annotations.
  requirements:
  - A completed network, its spectra and a compatible overlay table.
  - A node-ID column that matches network identifiers; follow the documented column-header restrictions.
  considerations:
  - Mismatched identifiers can prevent correct attribute assignment.
  - The linked tutorial demonstrates Progenesis/FBMN; no broader format support was independently tested.
  - The source repository linked from the workflow collection could not be retrieved during review.
