$schema: ../../schemas/tool.schema.json
slug: gnps-network-overlay
name: GNPS2 Network Overlay
summary: Attach custom feature attributes to an existing GNPS2 molecular network using matching node identifiers.
description: The network-overlay workflow joins an uploaded feature table to a completed network. The documented
  Progenesis route launches it from FBMN and supplies the existing spectra and graph automatically. The overlay
  adds supplied attributes; it does not independently establish their biological meaning.
links:
  primary: https://gnps2.org/workflowinput?workflowname=gnps2_network_overlay_workflow
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/protocol_fbmn_progenesis_overlay/
resource_types:
- workflow_pipeline
functions:
  primary: visualization_reporting
  capabilities:
  - network_visualization
platforms:
- lc_ms
interfaces:
- web_app
access:
  model: free_web_service
  notes: Hosted GNPS2 resource. Check hosted-service terms and account requirements; a software license is not inferred
    from hosting.
publications: []
resource_citations:
- type: documentation
  citation: GNPS2 Network Overlay official documentation. Accessed 24 September 2026.
  url: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/protocol_fbmn_progenesis_overlay/
