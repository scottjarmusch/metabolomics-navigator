$schema: ../../schemas/tool.schema.json
slug: nextflow4ms-dial
name: Nextflow4MS-DIAL
summary: A reproducible Nextflow workflow for LC-HRMS metabolomics that executes MS-DIAL-based processing
  across local, containerized, and high-performance computing environments.
links:
  primary: https://github.com/Nextflow4Metabolomics/nextflow4ms-dial
  repository: https://github.com/Nextflow4Metabolomics/nextflow4ms-dial
  documentation: https://github.com/Nextflow4Metabolomics/nextflow4ms-dial#readme
