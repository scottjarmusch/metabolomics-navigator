  type: primary
  citation: 'Nextflow4MS-DIAL: A Reproducible Nextflow-Based Workflow for Liquid Chromatography–Mass Spectrometry
    Metabolomics Data Processing. Journal of the American Society for Mass Spectrometry (2025).'
common_uses:
- Run MS-DIAL preprocessing reproducibly on local systems or HPC.
- Preserve workflow configuration, execution logs, and containerized dependencies around an MS-DIAL analysis.
