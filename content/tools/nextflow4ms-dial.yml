  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - Reproducible execution of MS-DIAL LC-HRMS workflows across local, container, and HPC environments.
  requirements:
  - Nextflow, Java and Docker or Singularity in the documented Linux/macOS setup, mzML/ABF data, MS-DIAL/MS-FLO
    configuration files and appropriately named reference libraries.
  not_designed_for:
  - A new standalone feature-detection algorithm or conversion of every proprietary raw format without
    external converters.
  considerations:
  - Results depend on MS-DIAL parameters and library compatibility. CPU/resource allocation and file naming
    must follow the workflow guidance on the chosen platform.
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - full_scan
  - dda
  - unspecified
  ion_mobility: unspecified
description: Nextflow4MS-DIAL orchestrates MS-DIAL and MS-FLO processing with Nextflow for reproducible
  LC-HRMS analyses. Container profiles support local and HPC execution and produce feature/annotation
  tables together with workflow reports.
