description: AirdPro converts mass-spectrometry vendor data into the Aird storage format through a graphical
  batch-conversion workflow. Aird separates compressed spectral arrays from a JSON index for access through
  the companion SDKs.
scope:
  designed_for:
  - AirdPro converts mass-spectrometry vendor data into the Aird storage format through a graphical batch-conversion
    workflow.
  not_designed_for:
  - Feature detection, metabolite identification or a guarantee that every vendor file is readable on
    every operating system.
  requirements:
  - A compatible AirdPro installation and vendor readers supplied through ProteoWizard; preserve each
    Aird binary together with its matching JSON index.
  considerations:
  - Select and document compression and precision settings. Precision-controlled lossy conversion requires
    assessment against the downstream scientific use.
common_uses:
- AirdPro converts mass-spectrometry vendor data into the Aird storage format through a graphical batch-conversion
  workflow.
publications:
- doi: 10.1186/s12859-021-04490-0
  type: primary
  citation: 'Aird: a computation-oriented mass spectrometry data format enables a higher compression ratio
    and less decoding time. BMC Bioinformatics (2022).'
  note: Aird format and associated conversion implementation; reader compatibility is installation-dependent.
