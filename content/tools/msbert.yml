$schema: ../../schemas/tool.schema.json
slug: msbert
name: MSBERT
summary: Embed tandem spectra for similarity scoring and reference-library matching.
description: MSBERT learns MS/MS embeddings using masked and contrastive learning. Examples compute spectrum
  similarities and integrate the scoring method into matchms.
links:
  primary: https://github.com/zhanghailiangcsu/MSBERT#readme
  repository: https://github.com/zhanghailiangcsu/MSBERT
  documentation: https://github.com/zhanghailiangcsu/MSBERT#readme
platforms:
- lc_ms
interfaces:
- command_line
- web_app
resource_types:
- software_application
functions:
  primary: spectral_analysis
  capabilities:
  - library_matching
access:
  model: open_source
  license: MIT
  notes: MIT license verified in the official source repository. Training datasets and model downloads
    may have separate terms. No execution or independent performance benchmark.
data:
  input_types:
  - spectra
  - spectral_library
  output_types:
  - report
  other_input_formats:
  - MSP tandem spectra and trained MSBERT weights
  other_output_formats:
  - Embedding vectors and pairwise spectrum similarity scores
common_uses:
- Embed tandem spectra for similarity scoring and reference-library matching.
scope:
  designed_for:
  - MSBERT learns MS/MS embeddings using masked and contrastive learning. Examples compute spectrum similarities
    and integrate the scoring method into matchms.
  not_designed_for:
  - De novo structure generation or evidence of identity from similarity alone.
  requirements:
  - Python/PyTorch environment and pretrained model; reference spectra for library search.
  considerations:
  - Training and evaluation use curated GNPS data; assess performance for the instrument and chemistry
    of your study.
  - A documented Streamlit interface is available; hosted service operation was not tested.
publications:
- doi: 10.1021/acs.analchem.4c02426
  type: primary
  citation: 'MSBERT: Embedding Tandem Mass Spectra into Chemically Rational Space by Mask Learning and
    Contrastive Learning. Analytical Chemistry (2024).'
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake checked against official documentation, license information and primary DOI/title/year
    on 2026-10-22. Editorial review only; no execution or independent benchmark.
maintenance:
