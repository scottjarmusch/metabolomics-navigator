$schema: ../../schemas/tool.schema.json
slug: canopus
name: CANOPUS
summary: A SIRIUS-integrated machine-learning method and webservice for predicting compound classes directly from
  high-resolution MS/MS data without requiring an exact database structure match.
description: CANOPUS uses molecular fingerprints predicted from tandem mass spectra to infer hierarchical compound
  classes. Because it predicts class membership without requiring the exact compound to exist in a spectral or structure
  database, it is particularly useful for characterizing unknown metabolite features when precise structure identification
  is not possible. CANOPUS is currently accessed as a webservice-backed component of SIRIUS.
links:
  primary: https://v6.docs.sirius-ms.io/
  documentation: https://v6.docs.sirius-ms.io/methods-background/
resource_types:
- web_service
functions:
  primary: annotation_identification
  secondary:
  - machine_learning
  capabilities:
  - compound_class_prediction
  - substructure_prediction
platforms:
- lc_ms
- direct_infusion_ms
analysis_types:
- untargeted
- metabolite_profiling
interfaces:
- desktop_gui
- command_line
- api
access:
  model: free_academic
  notes: CANOPUS is accessed through SIRIUS web services and is currently free for academic use under the SIRIUS
    licensing terms.
publications:
- doi: 10.1038/s41587-020-0740-8
  citation: Dührkop K, Nothias L-F, Fleischauer M, et al. Systematic classification of unknown metabolites using
    high-resolution fragmentation mass spectra. Nature Biotechnology 39, 462–471 (2021).
  type: primary
common_uses:
- Assign hierarchical chemical classes to MS/MS features lacking confident exact structure annotations.
- Summarize chemical diversity across large untargeted metabolomics datasets at class level.
- Provide structural context for features absent from spectral and molecular-structure reference databases.
scope:
  designed_for:
  - Compound-class prediction from accurate-mass tandem mass spectra.
  requirements:
  - SIRIUS-compatible high-resolution MS/MS data and access to the SIRIUS webservice.
  considerations:
  - CANOPUS predicts compound classes rather than exact structures; results should not be reported as compound-level
    identifications.
  - Class confidence and resolution depend on the information contained in the spectrum and the trained classification
    hierarchy.
