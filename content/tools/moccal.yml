description: MOCCal calibrates traveling-wave ion-mobility measurements and calculates class-specific
  experimental CCS values. It includes processed-drift-time and raw-calibration-data routes and can assign
  biomolecular classes for class-specific calculations.
scope:
  designed_for:
  - MOCCal calibrates traveling-wave ion-mobility measurements and calculates class-specific experimental
    CCS values.
  not_designed_for:
  - Structure-to-CCS prediction or proof of molecular identity from biomolecular-class assignment.
  requirements:
  - Calibration/experimental data in the supplied templates; the raw-data route additionally requires
    the documented DEIMoS environment, while the processed-data executable needs its Output directory.
  considerations:
  - TWIM arrival time and drift time differ physically even where the interface uses the terms interchangeably.
    Calibrant choice, charge/adduct and class assumptions affect CCS results.
common_uses:
- MOCCal calibrates traveling-wave ion-mobility measurements and calculates class-specific experimental
  CCS values.
publications:
- doi: 10.1021/acs.analchem.3c04290
  type: primary
  citation: 'MOCCal: A Multiomic CCS Calibrator for Traveling Wave Ion Mobility Mass Spectrometry. Analytical
    Chemistry (2024).'
