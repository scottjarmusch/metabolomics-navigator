- python_package
access:
  model: free_web_service
  notes: Hosted access and any account or usage requirements should be checked at the linked service. Access to
    a web service does not establish the license of its code or reference data.
publications:
- doi: 10.1101/2024.05.13.593988
  citation: Gomes PWP, Mannochio-Russo H, Schmid R, et al. plantMASST - Community-driven chemotaxonomic digitization
    of plants. bioRxiv (2024), preprint.
  type: primary
common_uses:
- Search an MS/MS spectrum across taxonomically defined plant extracts.
- Explore which plant taxa and public files are represented in the current reference collection.
- Launch selected public plant files into GNPS2 molecular-networking analysis.
- Browse the Explorer collection and select plant data for subsequent GNPS analysis.
scope:
  designed_for:
  - Chemotaxonomic contextualization of known and unknown plant-associated MS/MS spectra.
  requirements:
  - A query spectrum/USI for search mode, or no query for the Explorer view.
  considerations:
  - The associated methodological publication is currently a preprint; the live resource continues to evolve as
    community plant data are deposited.
  - Taxonomic and spectral coverage is not uniform across plant diversity.
  - Keep the query and selected taxonomy context; investigate the original plant extracts before interpreting a
    chemotaxonomic pattern.
  not_designed_for:
  - Establishing taxon-specific biosynthesis or absence across unmeasured plant species.
