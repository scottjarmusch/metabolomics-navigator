$schema: ../../schemas/tool.schema.json
slug: plantmasst
name: plantMASST
summary: A domain-specific GNPS search and exploration resource for contextualizing query MS/MS spectra across taxonomically
  defined plant metabolomics datasets.
description: plantMASST searches query tandem mass spectra against a public collection of taxonomically curated
  plant extracts and displays matches within plant taxonomy. Its current Explorer interface can also browse the
  indexed plant collection without a query spectrum, inspect files for individual taxa, and launch selected public
  files into GNPS2 molecular-networking workflows. The resource is community-driven and uses harmonized taxonomy
  and repository metadata.
links:
  primary: https://masst.gnps2.org/plantmasst/
  web_app: https://masst.gnps2.org/plantmasst/
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/plantmasst/
  repository: https://github.com/robinschmid/microbe_masst
resource_types:
- web_service
- database_knowledgebase
functions:
  primary: reference_data_search
  secondary:
  - spectral_analysis
  - data_management_sharing
  capabilities:
  - repository_scale_search
  - metadata_contextualization
  - library_matching
  - interactive_dashboard
platforms:
- lc_ms
analysis_types:
- untargeted
- metabolite_profiling
interfaces:
