status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
description: rIDIMS processes direct-infusion MS by selecting usable scans, forming consensus spectra
  and filtering features with replicate and background information. Its R/Shiny workflow exports intermediate
  tables and reports for reviewing processing choices.
scope:
  designed_for:
  - rIDIMS processes direct-infusion MS by selecting usable scans, forming consensus spectra and filtering
    features with replicate and background information.
  not_designed_for:
  - Treating scan subsets from one injection as independent biological or experimental replicates.
  requirements:
  - R with documented dependencies, mzML files and a completed sample-information spreadsheet identifying
    classes, blanks and replicate groups.
  considerations:
  - In-silico scan groups represent technical subdivisions of the same sample. Inspect scan selection,
    thresholds and blank filtering; the published online tutorial includes a package-loading error and
    is not proof of current operability.
common_uses:
- rIDIMS processes direct-infusion MS by selecting usable scans, forming consensus spectra and filtering
  features with replicate and background information.
publications:
- doi: 10.1016/j.talanta.2024.127273
  type: primary
  citation: 'rIDIMS: A novel tool for processing direct-infusion mass spectrometry data. Talanta (2025).'
