  last_editorial_review: '2026-10-27'
description: Mass2SMILES uses deep learning to predict candidate molecular structures and functional groups
  from tandem mass spectra. The documented inference route reads GNPS-style MGF and uses containerized
  models with a separate molecular-descriptor component.
scope:
  designed_for:
  - Mass2SMILES uses deep learning to predict candidate molecular structures and functional groups from
    tandem mass spectra.
  not_designed_for:
  - Confirmed structural identification from a prediction alone or unrestricted redistribution of NIST-derived
    model resources.
  requirements:
  - Docker and downloaded model/container artifacts, compatible GPU/software settings for the chosen model
    release and a valid NIST license where required by the supplied artifacts.
  considerations:
  - The project describes separate GPU model and CPU descriptor containers because of CUDA compatibility
    limitations. Prediction reliability depends on spectral preparation and training-domain coverage.
common_uses:
- Mass2SMILES uses deep learning to predict candidate molecular structures and functional groups from
  tandem mass spectra.
publications:
- doi: 10.1101/2023.07.06.547963
  type: primary
  citation: 'Mass2SMILES: deep learning based fast prediction of structures and functional groups directly
    from high-resolution MS/MS spectra. bioRxiv preprint (2023). Preprint; not peer reviewed.'
