- citation: 'de Jonge NF, Louwen JJR, Chekmeneva E, et al. MS2Query: reliable and scalable MS2 mass spectra-based
    analogue search. Nature Communications 14, 1752 (2023).'
  type: primary
  doi: 10.1038/s41467-023-37446-4
  pmid: '36990978'
related_tools:
- slug: gnps
  relationship: part_of
  note: Available as a GNPS2 workflow.
- slug: spec2vec
  relationship: integration
  note: Uses learned spectral similarity concepts from Spec2Vec.
- slug: ms2deepscore
  relationship: integration
  note: MS2DeepScore predictions contribute to candidate ranking.
maintenance:
  status: active
  last_checked: '2026-09-10'
description: MS2Query searches reference MS/MS spectra for both exact-match candidates and structurally related
  analogues. It combines Spec2Vec, MS2DeepScore and precursor information to rank library candidates, with a Python
  implementation and a hosted GNPS2 workflow.
common_uses:
- Find plausible structural relatives when an exact library match is unavailable.
- Prioritize spectra for closer structural investigation.
scope:
  designed_for:
  - Library searching of small-molecule MS/MS spectra, including analogue retrieval.
  not_designed_for:
  - De novo structure generation or conclusive identification of an unknown molecule.
  - Chromatographic feature detection, alignment or quantification.
  requirements:
  - MS/MS spectra with precursor information and the correct ionization mode.
  - Compatible reference-library and model files; hosted jobs require uploaded spectra and a GNPS2 account.
  considerations:
  - An analogue is a related reference molecule, not necessarily the measured compound.
  - Filter results by model score and inspect precursor differences; class labels describe the proposed library
    molecule.
  - Results depend on reference-library coverage and model compatibility. Record the library, model and software
    versions.
