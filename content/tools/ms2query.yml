slug: ms2query
name: MS2Query
summary: MS/MS analogue-search tool that combines learned spectral similarity and precursor-mass information to
  retrieve structurally related reference compounds.
links:
  primary: https://gnps2.org/workflowinput?workflowname=ms2query_nextflow_workflow
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/ms2query_doc/
  repository: https://github.com/iomega/ms2query
resource_types:
- programming_package
- workflow_pipeline
- web_service
functions:
  primary: spectral_analysis
  capabilities:
  - library_matching
platforms:
- lc_ms
interfaces:
- web_app
- python_package
- command_line
access:
  model: open_source
  license: Apache-2.0
  notes: 'The Python software is distributed under Apache-2.0. For the hosted workflow: GNPS2 is openly available
    to the academic community. The current GNPS2 documentation asks industry users to contact the maintainers or
    UC Riverside Technology Transfer regarding organizational access. Workflow submission requires a GNPS2 account.'
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Editorial review of official documentation, repository and the direct tool publication on 2026-09-10. No
    analysis job, independent benchmark or developer verification was performed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-08'
  updated_at: '2026-09-10'
  last_verified: '2026-09-10'
  last_editorial_review: '2026-09-10'
