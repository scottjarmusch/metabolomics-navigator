description: MultiBaC corrects batch effects in multi-omics datasets distributed across acquisition events
  or laboratories. It uses a shared omic layer to transfer correction information between batches and
  is implemented as an R/Bioconductor package.
scope:
  designed_for:
  - A Bioconductor R package for batch-effect correction in single-omics and multi-omics datasets, including
    metabolomics.
  not_designed_for:
  - Unconstrained correction of disjoint omics batches with no common layer, or raw MS preprocessing.
  requirements:
  - R/Bioconductor dependencies and correctly organized multi-omics assay/design objects; at least one
    common omic data type must occur in every batch considered.
  considerations:
  - Shared-layer quality and experimental design constrain correction. Verify that biological contrasts
    remain meaningful and do not treat corrected cross-omics association as causality.
common_uses:
- A Bioconductor R package for batch-effect correction in single-omics and multi-omics datasets, including
  metabolomics.
publications:
- doi: 10.1093/bioinformatics/btac132
  type: primary
