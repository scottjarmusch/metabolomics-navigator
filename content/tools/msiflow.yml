description: msiFlow provides Snakemake workflows for MSI preprocessing, segmentation, registration to
  immunofluorescence microscopy and region-based statistical or machine-learning analysis. Docker and
  local routes offer graphical or command-line execution.
scope:
  designed_for:
  - msiFlow provides Snakemake workflows for MSI preprocessing, segmentation, registration to immunofluorescence
    microscopy and region-based statistical or machine-learning analysis.
  not_designed_for:
  - Guaranteed molecular identification or accurate cross-modal registration without inspecting image
    alignment and experimental context.
  requirements:
  - Docker or the documented local environment, workflow-compatible MSI/microscopy data and configuration;
    registration and region comparisons additionally require corresponding images and region/group information.
  considerations:
  - Different workflows require different prepared inputs. Check preprocessing, registration and region
    definitions before interpreting spatial statistics or classifier results.
common_uses:
- msiFlow provides Snakemake workflows for MSI preprocessing, segmentation, registration to immunofluorescence
  microscopy and region-based statistical or machine-learning analysis.
