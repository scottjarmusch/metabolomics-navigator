$schema: ../../schemas/tool.schema.json
slug: umetaflow
name: UmetaFlow
summary: A Snakemake workflow for high-throughput untargeted metabolomics that combines file conversion,
  OpenMS preprocessing, SIRIUS-family annotation, GNPS export, spectral matching, and graph-based outputs.
links:
  primary: https://github.com/biosustain/snakemake_UmetaFlow
  repository: https://github.com/biosustain/snakemake_UmetaFlow
  documentation: https://github.com/biosustain/snakemake_UmetaFlow#readme
resource_types:
- workflow_pipeline
functions:
  primary: workflow_reproducibility
  secondary:
  - data_conversion
  - preprocessing
  - annotation_identification
  - spectral_analysis
  - molecular_networking
  capabilities:
  - provenance_tracking
  - container_support
  - peak_detection
  - retention_time_alignment
  - gap_filling
  - library_matching
  - molecular_formula_prediction
  - compound_class_prediction
platforms:
- lc_ms
analysis_types:
- untargeted
interfaces:
- command_line
- workflow_language
access:
  model: open_source
  license: Apache-2.0
  notes: Apache-2.0 workflow code. External programs, databases and hosted annotation services retain
    separate licenses and access requirements.
technical:
  operating_systems:
  - linux
  - macos
  programming_languages:
  - Python
  - Snakemake
  package_managers:
  - Conda
data:
  input_types:
  - raw_instrument_data
  - spectra
  - sample_metadata
  output_types:
  - feature_table
  - spectra
  - compound_list
  input_formats:
  - vendor_raw
  - mzml
  output_formats:
  - csv_tsv
  - mgf
publications:
- doi: 10.1186/s13321-023-00724-w
  type: primary
  citation: 'UmetaFlow: an untargeted metabolomics workflow for high-throughput data processing and analysis.
    Journal of Cheminformatics (2023).'
common_uses:
- Execute a reproducible untargeted LC-MS pipeline around OpenMS.
- Prepare outputs for SIRIUS-family annotation and GNPS feature-based molecular networking.
maintenance:
  status: unclear
  repository_last_activity: '2025-01-05'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - High-throughput untargeted metabolomics workflows combining preprocessing and downstream annotation/export.
  requirements:
  - A documented Linux/macOS conda and Snakemake environment, acquisition-appropriate configuration and
    sample tables; enable only annotation modules whose external software, models and libraries are available.
  considerations:
  - Thermo raw conversion is integrated; other vendor files generally require independent mzML conversion.
    Module-dependent candidate annotations need inspection beyond workflow completion.
  not_designed_for:
  - A guarantee of structural identification or identical processing for every vendor's proprietary raw
    format.
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - full_scan
  - dda
  - unspecified
  ion_mobility: unspecified
description: UmetaFlow organizes untargeted metabolomics processing with Snakemake and OpenMS/pyOpenMS.
  It combines feature detection, alignment and optional re-quantification with configurable spectral matching,
  formula/class prediction and GNPS-compatible exports.
