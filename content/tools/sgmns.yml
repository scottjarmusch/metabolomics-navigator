description: SGMNS propagates candidate metabolite annotations through a structure-guided background molecular
  network. Its documented workflow combines processed LC-HRMS features, tandem spectra and known seed
  metabolites with a default or custom structure database.
scope:
  designed_for:
  - SGMNS propagates candidate metabolite annotations through a structure-guided background molecular
    network.
  not_designed_for:
  - Raw peak picking or structure confirmation independent of seed accuracy and background-network coverage.
  requirements:
  - Prepared positive/negative-mode peak CSV tables, MGF spectra, seed-metabolite lists and a configured
    background network; retention times must be calibrated to the background conditions.
  considerations:
  - Ion redundancy removal and retention-time calibration are upstream prerequisites. The default network
    and imported seed errors can propagate through subsequent annotations.
common_uses:
- SGMNS propagates candidate metabolite annotations through a structure-guided background molecular network.
publications:
- doi: 10.1021/acs.analchem.3c00849
  type: primary
  citation: A Structure-Guided Molecular Network Strategy for Global Untargeted Metabolomics Data Annotation.
    Analytical Chemistry (2023).
