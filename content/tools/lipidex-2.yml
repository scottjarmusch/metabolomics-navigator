$schema: ../../schemas/tool.schema.json
slug: lipidex-2
name: LipiDex 2
summary: A standalone LC-MS lipidomics suite for in-silico library generation, MS/MS and MSn spectral
  searching, lipid feature annotation, peak-table integration, and automated identification quality control.
links:
  primary: https://github.com/coongroup/LipiDex-2
  repository: https://github.com/coongroup/LipiDex-2
  documentation: https://github.com/coongroup/LipiDex-2/wiki
  download: https://github.com/coongroup/LipiDex-2/releases/latest
resource_types:
- software_application
functions:
  primary: annotation_identification
  secondary:
  - spectral_analysis
  - quality_control
  - quantification
  capabilities:
  - in_silico_spectra
  - library_matching
  - identification_confidence
  - ms2_processing
platforms:
- lc_ms
analysis_types:
- lipidomics
interfaces:
- desktop_gui
access:
  model: source_available
  notes: Public source and executable releases are available, but no explicit repository-wide software
    license was identified. Compound Discoverer is a separate commercial dependency for Peak Finder.
technical:
  operating_systems:
  - windows
  programming_languages:
  - C#
data:
  input_types:
  - raw_instrument_data
  - spectra
  - feature_table
  - spectral_library
  output_types:
  - compound_list
  - feature_table
  - report
  output_formats:
  - csv_tsv
  other_input_formats:
  - Thermo raw, spectral libraries and Compound Discoverer cdResult by module
publications:
- doi: 10.1021/acs.analchem.4c00359
  type: primary
  citation: LipiDex 2 Integrates MSn Tree-Based Fragmentation Methods and Quality Control Modules to Improve
    Discovery Lipidomics. Analytical Chemistry (2024).
common_uses:
- Generate or search lipid spectral libraries and annotate LC-MS lipid features.
- Apply retention-time, spectral-match, linearity, QC-RSD, and other evidence to filter lipid identifications.
maintenance:
  status: unclear
  repository_last_activity: '2026-08-17'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - LC-MS lipid identification and quality-controlled lipidomics workflows.
  requirements:
  - Windows with .NET 7 and appropriate lipid spectra/libraries. Peak Finder specifically requires Compound
    Discoverer 3.3 cdResult input; other modules can run separately.
  considerations:
  - Input requirements differ by module. Quality-control criteria need the relevant dilution series, replicate
    QCs or other evidence and do not confer experimental confirmation by themselves.
  not_designed_for:
  - A universal raw-data peak detector or unqualified assignment of lipid structural detail beyond the
    acquired fragmentation evidence.
acquisition:
  ms_levels:
  - ms2
  - msn
  strategies:
  - dda
  - targeted_msms
  - unspecified
  ion_mobility: unspecified
description: LipiDex 2 provides lipid spectral-library generation, spectral matching, peak annotation
  and quality-control modules. It extends lipidomics analysis to MSn fragmentation trees and includes
  Degreaser checks based on retention behavior, dilution response, spectral evidence and QC variability.
