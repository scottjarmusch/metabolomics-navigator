$schema: ../../schemas/tool.schema.json
slug: g-aligner
name: G-Aligner
summary: An open-source graph-based method for aligning untargeted LC-MS features across runs by solving
  the correspondence problem as a multidimensional assignment task.
links:
  primary: https://github.com/CSi-Studio/G-Aligner
  repository: https://github.com/CSi-Studio/G-Aligner
  documentation: https://github.com/CSi-Studio/G-Aligner#readme
resource_types:
- programming_package
functions:
  primary: preprocessing
  secondary: []
  capabilities:
  - retention_time_alignment
platforms:
- lc_ms
analysis_types:
- untargeted
interfaces:
- python_package
- command_line
access:
  model: open_source
  license: MulanPSL-2.0
  notes: The official README states MulanPSL-2.0. Installation includes separately installed solver components
    whose requirements should also be checked.
technical:
  operating_systems:
  - linux
  - macos
  - windows
  programming_languages:
  - Python
data:
  input_types:
  - feature_table
  output_types:
  - feature_table
  input_formats:
  - csv_tsv
  output_formats:
  - csv_tsv
publications:
- doi: 10.1186/s12859-023-05525-4
  type: primary
  citation: 'G-Aligner: a graph-based feature alignment method for untargeted LC–MS-based metabolomics.
    BMC Bioinformatics (2023).'
common_uses:
- Align extracted LC-MS features across multiple samples or runs.
- Replace or compare alignment stages from preprocessing workflows such as XCMS, OpenMS, or MZmine.
maintenance:
  status: unclear
  repository_last_activity: '2024-03-09'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - Cross-run feature alignment after feature extraction in untargeted LC-MS.
  requirements:
  - Python environment, the supplied third-party solver components and per-run CSV feature lists with
    m/z, retention time and area columns; adjust the example configuration for the study.
  considerations:
  - Poor upstream detection or inappropriate alignment tolerances can propagate into correspondence results;
    inspect missingness and ambiguous matches after alignment.
  not_designed_for:
  - Raw-data peak detection or identification of the molecules represented by aligned features.
description: G-Aligner aligns previously detected LC-MS features across runs using a multipartite-graph
  formulation of feature correspondence. It optimizes competing matches using m/z, retention time and
  abundance information rather than extracting peaks from raw files.
