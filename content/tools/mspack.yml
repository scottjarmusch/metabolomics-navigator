description: mspack provides lossless and configurable lossy compression of mass-spectrometry arrays through
  a C++ API and example mzML/mzXML command-line implementation. It supports gzip and the optional bsc
  compression backend.
scope:
  designed_for:
  - mspack provides lossless and configurable lossy compression of mass-spectrometry arrays through a
    C++ API and example mzML/mzXML command-line implementation.
  not_designed_for:
  - Guaranteed compatibility with all mzML encodings or ion-mobility arrays, or numerically lossless results
    when lossy transforms are selected.
  requirements:
  - C++11-compatible build tools and gzip, with bsc optional; example readers require supported XML files
    containing uncompressed raw mass/intensity arrays.
  considerations:
  - Mass values must increase in the example implementation. XML whitespace is not preserved, and mzXML
    support is restricted to 32-bit data without block I/O.
common_uses:
- mspack provides lossless and configurable lossy compression of mass-spectrometry arrays through a C++
  API and example mzML/mzXML command-line implementation.
