$schema: ../../schemas/tool.schema.json
slug: pnnl-preprocessor
name: PNNL PreProcessor
summary: Preprocess multidimensional ion-mobility mass-spectrometry data with demultiplexing, smoothing, noise filtering, saturation repair, and format-conversion utilities.
description: PNNL PreProcessor is a desktop preprocessing utility developed for ion-mobility mass spectrometry. It supports Agilent MassHunter and UIMF data from drift-tube and SLIM IM-MS platforms and provides operations including data compression/interpolation, ion-mobility demultiplexing, multidimensional smoothing, intensity-threshold and spike filtering, saturation repair, metadata export, and selected conversions that make IM information usable in downstream LC-MS-oriented workflows.
