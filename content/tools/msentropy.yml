$schema: ../../schemas/tool.schema.json
slug: msentropy
name: MSEntropy
summary: An open-source multi-language implementation of spectral entropy, entropy similarity, and flash
  entropy search for comparing and querying small-molecule mass spectra.
links:
  primary: https://msentropy.readthedocs.io/
  homepage: https://msentropy.readthedocs.io/
  repository: https://github.com/YuanyueLi/MSEntropy
  documentation: https://msentropy.readthedocs.io/
resource_types:
- programming_package
functions:
  primary: spectral_analysis
  secondary:
  - annotation_identification
  - reference_data_search
  capabilities:
  - library_matching
  - ms2_processing
platforms:
- platform_independent
analysis_types:
- untargeted
interfaces:
- python_package
- r_package
access:
  model: open_source
  license: Apache-2.0
  notes: Apache-2.0 implementation; reference-library availability and licensing are separate from the
    software license. Language interfaces provide different subsets of functionality.
technical:
  operating_systems:
  - windows
  - macos
  - linux
  - cross_platform
  programming_languages:
  - Python
  - R
  - C
  - C++
data:
  input_types:
  - spectra
  - spectral_library
  output_types:
  - statistical_results
  other_input_formats:
  - In-memory m/z-intensity arrays and library spectrum dictionaries
  other_output_formats:
  - Entropy values, similarity arrays and indexed-search scores
publications:
- doi: 10.1038/s41592-021-01331-z
  type: methods
  citation: Spectral entropy outperforms MS/MS dot product similarity for small-molecule compound identification.
    Nature Methods (2021).
- doi: 10.1038/s41592-023-02012-9
  type: primary
  citation: Flash entropy search to query all mass spectral libraries in real time. Nature Methods (2023).
common_uses:
- Calculate spectral entropy and entropy-based similarity between MS/MS spectra.
- Search spectral libraries with flash entropy search.
maintenance:
  status: unclear
  repository_last_activity: '2026-10-05'
  last_checked: '2026-10-27'
  notes: Repository state checked; recent commits alone do not establish ongoing maintenance or operational
    compatibility.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Enveda intake rechecked against official README/documentation, repository access terms and primary
    publication metadata on 2026-10-27. Editorial source review only; no software execution or independent
    benchmarking. See docs/enveda-expansion-review-2026-10-27.md.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-10-27'
  updated_at: '2026-10-27'
  last_verified: '2026-10-27'
  last_editorial_review: '2026-10-27'
scope:
  designed_for:
  - Entropy-based spectral comparison and high-speed library searching.
  considerations:
  - Cleaning, intensity normalization and fragment tolerances affect scores. Confirm that candidate precursor/adduct
    conditions and reference spectra are appropriate.
  not_designed_for:
  - Raw chromatographic peak extraction or confirmation of identity solely from an entropy score.
  requirements:
  - Centroid m/z-intensity peak arrays and appropriate mass tolerances; library search additionally requires
    a prepared reference library and precursor metadata.
acquisition:
  ms_levels:
  - ms2
  strategies:
  - dda
  - targeted_msms
  - unspecified
  ion_mobility: not_required
description: MSEntropy implements spectral entropy and entropy-based similarity calculations, with Flash
  Entropy Search for indexed library comparisons. Python provides the indexed search interface, while
  R and C/C++ interfaces expose entropy and comparison functions.
