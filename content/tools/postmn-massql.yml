$schema: ../../schemas/tool.schema.json
slug: postmn-massql
name: PostMN MassQL
summary: Run MassQL chemical-pattern queries directly on consensus spectra produced by GNPS molecular networking.
links:
  primary: https://massqlpostmn.gnps2.org/
  documentation: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/metaboapp_PostMN_MassQL/
resource_types:
- web_service
functions:
  primary: spectral_analysis
  capabilities:
  - ms2_processing
  - provenance_tracking
platforms:
- lc_ms
interfaces:
- web_app
access:
  model: free_web_service
  notes: Publicly hosted MetaboApp. GNPS2 infrastructure is open to the academic community; its documentation directs
    industry users to the maintainers or UCR Technology Transfer. Hosted access does not establish a software or
    reference-data license.
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Reviewed against the linked official app documentation on 2026-09-10. No standalone publication for this
    particular app was verified; the documentation citation identifies the reviewed implementation. Underlying method
    and application papers are not presented as dedicated app papers. No analysis job or independent benchmark was
    run; no developer verification is claimed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-08'
  updated_at: '2026-09-10'
  last_verified: '2026-09-10'
  last_editorial_review: '2026-09-10'
data:
  input_types:
  - spectra
  output_types:
  - spectra
  - report
  other_input_formats:
  - Public GNPS2 CMN/FBMN task ID and MassQL query text
  output_formats:
  - mgf
  - csv_tsv
scope:
  designed_for:
  - Chemical-pattern searching after classical or feature-based molecular networking.
  not_designed_for:
  - Raw-file preprocessing or conclusive identification from a query hit alone.
  requirements:
  - A completed, public GNPS2 CMN or FBMN task and a valid MassQL query.
  considerations:
  - A query hit supports a fragmentation hypothesis; it does not validate a full structure.
  - The app searches processed spectra, so upstream processing affects the available evidence.
  - Retain the executed query text and upstream task identifier with exported results.
related_tools:
- slug: metaboapps
  relationship: part_of
  note: Standalone MetaboApp that can be launched directly or from a GNPS2 task.
- slug: gnps
  relationship: integration
  note: Consumes GNPS2 tasks or ecosystem data.
- slug: massql
  relationship: integration
  note: Uses the MassQL query language.
- slug: gnps-classical-molecular-networking
  relationship: integration
  note: Accepts a completed public CMN task.
- slug: gnps-feature-based-molecular-networking
  relationship: integration
  note: Accepts a completed public FBMN task.
maintenance:
  status: active
  last_checked: '2026-09-10'
publications: []
resource_citations:
- citation: GNPS2 Documentation. PostMN MassQL. Accessed 10 September 2026.
  type: documentation
  url: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/metaboapp_PostMN_MassQL/
description: PostMN MassQL searches the processed spectra from a completed GNPS2 networking job. Researchers can
  select, edit or write fragmentation-pattern queries and inspect which spectra satisfy them, alongside available
  library annotations.
common_uses:
- Screen networking results for diagnostic fragments or neutral losses.
- Export spectra satisfying selected query conditions.
