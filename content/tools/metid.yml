$schema: ../../schemas/tool.schema.json
slug: metid
name: metID
summary: Annotate LC-MS features using accurate mass, retention time and tandem mass spectra in R.
description: metID supports matching against in-house and public reference databases and can be used independently
  or within the TidyMass ecosystem.
links:
  primary: https://metid.tidymass.org/
  documentation: https://metid.tidymass.org/
resource_types:
- programming_package
functions:
  primary: annotation_identification
  capabilities:
  - library_matching
  - structure_database_search
platforms:
- lc_ms
interfaces:
- r_package
access:
  model: open_source
  notes: GPL-2 package; reference databases retain their own licenses.
data:
  input_types:
  - feature_table
  - spectra
  - spectral_library
  output_types:
  - compound_list
  input_formats:
  - other
  output_formats:
  - other
  other_input_formats:
  - R feature, spectral and reference database objects
  other_output_formats:
  - R compound-annotation objects
publications:
- citation: 'Shen et al. metID: a R package for automatable compound annotation for LC-MS-based data. Bioinformatics
    (2021).'
  type: primary
  doi: 10.1093/bioinformatics/btab583
common_uses:
- Automate matching against an in-house reference library.
- Combine mass and MS/MS evidence with retention information when available.
scope:
  designed_for:
  - Automate matching against an in-house reference library.
  not_designed_for:
  - Assigning the same confidence to mass-only and reference-standard matches.
  requirements:
  - R, feature or spectral data and a compatible reference database.
  considerations:
  - Retention times are method-dependent; choose tolerances and report the evidence supporting each annotation.
credits: []
provenance:
  submitted_by: curator
  developer_verified: false
  notes: Documentation-based editorial review on 7 September 2026. Scope and limitations summarize the linked
    official sources; software execution and developer verification were not assessed.
status:
  entry: published
  review: editorially_reviewed
  created_at: '2026-09-07'
  updated_at: '2026-09-07'
  last_editorial_review: '2026-09-07'
related_tools:
- slug: tidymass
  relationship: complementary
- slug: metaboannotation
  relationship: complementary
