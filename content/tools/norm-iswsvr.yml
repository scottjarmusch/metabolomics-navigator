description: Norm-ISWSVR normalizes metabolomics tables by combining internal-standard correction with
  support-vector-regression-based adjustment. Its Python implementation supports matched or unmatched
  internal-standard settings, cross-validation and hyperparameter search.
scope:
  designed_for:
  - Norm-ISWSVR normalizes metabolomics tables by combining internal-standard correction with support-vector-regression-based
    adjustment.
  not_designed_for:
  - Correcting every biological/technical confounding pattern or establishing accurate absolute concentrations
    solely by normalization.
  requirements:
  - Documented Python dependencies, abundance and sample CSV tables, internal-standard information and
    appropriate QC/run metadata for the selected mode.
  considerations:
  - Review matched-standard assignments, QC coverage and biological preservation. Injection-order and
    batch columns are optional in the template but their absence limits corresponding diagnostics and
    interpretation.
common_uses:
- Norm-ISWSVR normalizes metabolomics tables by combining internal-standard correction with support-vector-regression-based
  adjustment.
publications:
- doi: 10.1021/acs.analchem.1c05502
  type: primary
