$schema: ../../schemas/tool.schema.json
slug: massive
name: MassIVE
summary: A public repository for depositing, preserving, browsing, downloading, and reusing mass-spectrometry datasets, including datasets connected to GNPS analyses.
description: MassIVE is a community repository for the public exchange of mass-spectrometry data. It stores raw and processed files, metadata and publication-associated datasets, and supports browsing, downloading, accessioned deposition, and reuse through GNPS and related services.
links:
  primary: https://massive.ucsd.edu/
  homepage: https://massive.ucsd.edu/
  documentation: https://ccms-ucsd.github.io/GNPSDocumentation/datasets/
