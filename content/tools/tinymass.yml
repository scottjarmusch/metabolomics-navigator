  developer_verified: false
  notes: Official tool index, public TinyMass form labels and GNPS2 library retention notice reviewed on 2026-09-11. No spectrum was submitted. No standalone TinyMass publication verified; the 2016 GNPS paper displayed by the app remains on the GNPS parent entry.
