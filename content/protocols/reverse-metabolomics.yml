workflow_steps:
- title: Generate or obtain a reference MS/MS spectrum
  description: Acquire tandem mass spectra for a candidate chemical structure, for example from a synthesized standard, authenticated standard, or suitable reference source.
  tool_slugs:
  - msms-chooser
- title: Select a representative reference spectrum
  description: When standards are analyzed in mixtures, automatically select the MS/MS scan associated with the expected precursor and review the spectrum before repository searching.
  tool_slugs:
  - msms-chooser
- title: Search public MS/MS data
  description: Use the reference spectrum as a query against public metabolomics datasets to identify files and datasets containing related spectra.
  tool_slugs:
  - masst
  - gnps
  - massive
- title: Contextualize matches with sample metadata
  description: Summarize organism, biospecimen, phenotype, disease state and other standardized metadata associated with matching public files.
  tool_slugs:
  - redu
- title: Prioritize biological associations
  description: Use the distribution of matched spectra across public datasets to generate hypotheses about where the molecule occurs and which phenotypes or sample types it may be associated with.
- title: Validate prioritized associations
  description: Test the proposed association in independent cohorts, targeted measurements, culture systems, or functional experiments appropriate to the biological question.
tools:
- slug: msms-chooser
  role: Selection of candidate reference MS/MS spectra from data acquired on standards.
- slug: masst
  role: Repository-scale MS/MS spectrum searching.
- slug: redu
  role: Metadata-based contextualization of public mass-spectrometry matches.
- slug: gnps
  role: Web infrastructure for spectral workflows and public-data analysis.
- slug: massive
  role: Public repository containing searchable metabolomics datasets.
