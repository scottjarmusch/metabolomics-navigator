workflow_steps:
- title: Separate metabolites by LC
  description: Analyze the extract using an LC-MS method suitable for retaining native-like metal-binding interactions after chromatographic separation.
- title: Adjust post-column pH
  description: Infuse a volatile base or buffer after the LC column to establish conditions compatible with observing metal complexes during electrospray.
- title: Infuse the metal of interest
  description: Introduce a metal salt post-column so protonated and metal-bound forms of candidate ligands can be observed with matched retention behavior.
- title: Process features and ion identities
  description: Detect and align chromatographic features and group coeluting ion species with correlated peak shapes and expected mass relationships.
  tool_slugs:
  - mzmine
- title: Build an ion identity molecular network
  description: Use ion identity molecular networking to connect ion species and spectral relationships, highlighting candidate metal-binding compounds.
  tool_slugs:
  - mzmine
  - gnps
  external_tools:
  - name: Cytoscape
    url: https://cytoscape.org/
- title: Prioritize and validate candidate binders
  description: Interpret expected metal-adduct mass offsets, inspect spectra and chromatograms, and validate prioritized compounds with standards or orthogonal evidence where available.
