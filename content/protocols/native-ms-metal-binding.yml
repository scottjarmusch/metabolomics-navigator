slug: native-ms-metal-binding
name: Native MS metabolomics for metal-binding compounds
aliases:
- Native spray metabolomics
summary: A transferable LC-MS strategy that combines post-column pH adjustment and metal infusion with ion identity molecular networking to discover small molecules that bind metals in complex biological samples.
description: This protocol adapts native electrospray concepts to metabolomics so that protonated and metal-bound forms of the same chromatographic analyte can be detected together. Post-column pH adjustment and infusion of a selected metal are coupled to feature processing and ion identity molecular networking, allowing candidate metal-binding molecules to be prioritized from characteristic mass offsets and shared chromatographic behavior.
