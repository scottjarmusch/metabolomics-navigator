$schema: ../../schemas/protocol.schema.json
slug: sirius-msnovelist-de-novo
name: De novo structure generation with MSNovelist in SIRIUS
summary: A SIRIUS workflow that combines molecular-formula and fingerprint prediction with MSNovelist to generate
  candidate molecular structures de novo from MS/MS data.
description: MSNovelist addresses cases where database searching cannot recover the correct structure because the
  molecule is absent from candidate databases. It uses a SIRIUS molecular formula and CSI:FingerID fingerprint prediction
  to generate and rank de novo structure candidates, now integrated into the SIRIUS 6 ecosystem.
publication:
  title: 'MSNovelist: de novo structure generation from mass spectra'
  doi: 10.1038/s41592-022-01486-3
  url: https://www.nature.com/articles/s41592-022-01486-3
  citation: 'Stravs MA, Dührkop K, Böcker S, Zamboni N. MSNovelist: de novo structure generation from mass spectra.
    Nature Methods 19, 865–870 (2022).'
  journal: Nature Methods
  year: 2022
purpose:
  primary: structure_elucidation
  secondary:
  - unknown_identification
  - molecular_discovery
