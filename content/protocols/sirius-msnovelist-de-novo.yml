components:
- annotation
- data_sharing
workflow_steps:
- title: Establish molecular formula and MS/MS representation
  description: Use SIRIUS to identify a plausible molecular formula and compute the fragmentation-based representation
    needed for downstream fingerprint prediction.
  tool_slugs:
  - sirius
- title: Predict structural fingerprints
  description: Run CSI:FingerID fingerprint prediction to estimate structural properties from the fragmentation
    spectrum.
  tool_slugs:
  - sirius
- title: Generate structures with MSNovelist
  description: Generate candidate molecular structures de novo under the constraints of the molecular formula and
    predicted structural fingerprint.
  tool_slugs:
  - sirius
- title: Rank, inspect, and validate candidates
  description: Review generated structures and prioritize candidates using chemical plausibility and orthogonal
    analytical or biological evidence before making identification claims.
tools:
- slug: sirius
  role: Integrated formula, fingerprint, class, database-search, confidence, and de novo structure workflows.
resources:
  code_available: true
  code_url: https://github.com/sirius-ms/sirius
  protocol_available: true
  protocol_url: https://v6.docs.sirius-ms.io/
scope:
  designed_for:
  - Generating candidate structures for unknowns whose correct structure may be absent from molecular-structure
    databases.
  - Complementing structure-database searches in poorly represented or novel chemical space.
  requirements:
  - A plausible molecular formula and informative MS/MS spectrum; the current MSNovelist implementation is a webservice-backed
    SIRIUS feature.
  considerations:
  - Generated structures are hypotheses and require strong orthogonal validation before structural identification.
  - The original standalone MSNovelist repository/backend is archived and no longer operative; current users should
    use the implementation integrated into SIRIUS 6.
