slug: msi-guided-molecular-networking
name: Mass spectrometry imaging–guided molecular networking
summary: A multimodal natural-product strategy that uses spatial localization from mass spectrometry imaging to
  prioritize metabolites for LC-MS/MS molecular networking and structural interpretation.
description: Mass spectrometry imaging–guided molecular networking connects where a metabolite occurs with how its
  fragmentation spectrum relates to other molecules. Spatially resolved MSI features are used to identify chemically
  informative regions or ions, while LC-MS/MS molecular networking supplies fragmentation-based family context and
  annotation. The combination can focus structural analysis on spatially localized natural products rather than
  treating imaging and molecular networking as independent readouts.
publication:
  title: Mass spectrometry imaging guided molecular networking to expedite discovery and structural analysis of
    agarwood natural products
  doi: 10.1016/j.aca.2019.05.070
