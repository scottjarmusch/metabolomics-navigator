workflow_steps:
- title: Acquire spatial metabolite maps
  description: Use MALDI or another suitable imaging-MS method to map metabolite ions across the tissue or material
    of interest.
- title: Prioritize spatially informative features
  description: Select ions or chemical regions whose localization suggests biological or anatomical relevance.
- title: Acquire complementary LC-MS/MS data
  description: Generate fragmentation-rich LC-MS/MS data from matched or relevant material so spatially prioritized
    chemistry can be interpreted structurally.
- title: Build molecular networks
  description: Organize related MS/MS spectra into molecular families and connect the spatially prioritized features
    to family-level structural context.
  tool_slugs:
  - gnps
- title: Validate spatial and structural assignments
  description: Confirm prioritized annotations and localization with orthogonal standards, fragmentation interpretation,
    or additional imaging experiments where possible.
tools:
- slug: gnps
  role: Molecular-network analysis of structurally related tandem mass spectra.
resources:
  method_available: true
  method_url: https://doi.org/10.1016/j.aca.2019.05.070
scope:
  designed_for:
  - Natural-product or specialized-metabolite discovery where spatial localization can guide which chemistry deserves
    structural follow-up.
  - Multimodal studies combining imaging MS with fragmentation-rich LC-MS/MS.
  requirements:
  - Spatially resolved MSI data and complementary MS/MS data that can be related to the same chemistry.
  considerations:
  - Matching an MSI ion to an LC-MS/MS feature requires careful mass, adduct, and sample-context reasoning.
  - Spatial colocalization and spectral family membership do not substitute for complete structural confirmation.
provenance:
