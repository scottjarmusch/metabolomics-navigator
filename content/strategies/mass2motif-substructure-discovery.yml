slug: mass2motif-substructure-discovery
name: Shared-substructure discovery with Mass2Motifs
summary: Discover recurring fragment and neutral-loss patterns across MS/MS spectra to propose shared
  substructures.
description: MS2LDA links spectra through learned Mass2Motifs, including molecules without high overall
  spectral similarity.
publication:
  title: Topic modeling for untargeted substructure exploration in metabolomics
  doi: 10.1073/pnas.1608041113
  year: 2016
  journal: Proceedings of the National Academy of Sciences
purpose:
  primary: metabolite_annotation
  secondary:
  - molecular_family_discovery
platforms:
- lc_ms
analysis_types:
- untargeted
components:
- preprocessing
- annotation
- spectral_search
ask_keywords:
- MS2LDA
- Mass2Motifs
- shared substructures
- fragment patterns
- neutral losses
- motif discovery
- unknown spectra
workflow_steps:
- title: Prepare precursor-linked spectra
  description: The original workflow uses XCMS, MzMatch and RMassBank to prepare fragment and loss features.
  tool_slugs:
  - xcms
- title: Learn recurring motifs
  description: Apply topic modeling to the fragment/loss matrix.
  tool_slugs:
  - ms2lda
- title: Interpret and inspect assignments
  description: Compare motif patterns with reference spectra and chemical knowledge; examine associated
    precursors.
  tool_slugs:
  - ms2lda
tools:
- slug: xcms
  role: Original preprocessing.
- name: MzMatch
  role: Original peak preprocessing.
- name: RMassBank
  role: Original MS1-MS2 pairing.
- slug: ms2lda
  role: Motif inference and exploration.
resources:
  method_available: true
  method_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5137707/
scope:
  designed_for:
  - Substructure hypotheses from collections of MS/MS spectra.
  requirements:
  - Precursor-linked fragmentation spectra and consistent fragment/loss representation.
  considerations:
  - A motif need not identify a unique substructure or complete molecule. Expert interpretation remains
    necessary.
implementations:
- title: Unsupervised Discovery and Comparison of Structural Families Across Multiple Samples in Untargeted
