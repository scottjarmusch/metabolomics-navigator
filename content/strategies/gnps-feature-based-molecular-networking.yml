- slug: ms-dial
  role: Compatible upstream feature processing and FBMN export.
- slug: xcms
  role: Compatible upstream feature processing and FBMN export.
- slug: openms
  role: Compatible upstream feature processing and FBMN export.
- slug: cytoscape
  role: Inspect and style exported networks while retaining edge-type and feature metadata.
resources:
  code_available: true
