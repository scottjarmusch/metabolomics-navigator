  method_available: true
  method_url: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/fbmn/
scope:
  designed_for:
  - Untargeted LC-MS/MS studies where chromatographic feature detection and quantitative feature tables are
    important for molecular-network interpretation.
  - Resolving isomeric or chromatographically separated features that would otherwise be combined in purely
    spectrum-centric networking.
  requirements:
  - An aligned feature quantification table and representative MS/MS spectra exported from a compatible preprocessing
    workflow.
  - Consistent feature identifiers across the quantification table and spectral export; raw files alone are
    not ready-to-use FBMN inputs.
  considerations:
  - The quality of the molecular network depends on upstream feature detection, alignment, MS/MS assignment,
    and preprocessing choices.
  - FBMN does not remove the need for independent structural validation; library matches and network propagation
    represent different levels of annotation evidence.
