slug: microfluidic-bioactivity-fractionation
name: Microfluidic fractionation for compound-resolved bioactivity
summary: Pair rapid chromatographic fraction collection with LC-MS/MS and luminescent bioreporters to connect chemical
  signals with antibacterial responses.
publication:
  title: High-Frequency Microfluidic Fractionation for Compound-Resolved Bioactivity-Based Metabolomics
  doi: 10.1021/acs.analchem.5c04612
  year: 2025
  journal: Analytical Chemistry
  citation: Geibel C, et al. Analytical Chemistry 97, 24093-24104 (2025).
purpose:
  primary: natural_product_discovery
  secondary:
  - phenotype_association
platforms:
- lc_ms
components:
- chromatography
- data_acquisition
- biological_validation
tools: []
workflow_steps:
- title: Collect fractions during LC-MS/MS
  description: Spot eluent onto a paper microfluidic device at approximately one fraction per second while acquiring
    spectra.
- title: Measure reporter responses
  description: Expose fractions to luminescent bioreporters and image the response.
- title: Align activity with chemistry
  description: Match reporter signals to chromatographic profiles to prioritize active compounds.
scope:
  designed_for:
  - Antibacterial activity screening of extracts or compound mixtures.
  requirements:
  - Custom rapid fractionation hardware and compatible paper devices.
  - LC-MS/MS, luminescent bioreporters and response imaging.
  - Reliable correspondence between fraction positions and retention times.
  considerations:
  - Reporter responses are assay-specific; confirm prioritized activity with follow-up experiments.
  - Coelution can complicate assigning activity to one compound.
