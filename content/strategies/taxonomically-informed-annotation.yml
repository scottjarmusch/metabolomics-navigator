slug: taxonomically-informed-annotation
name: Taxonomically informed metabolite annotation
summary: A metabolite-annotation strategy that reranks candidate natural-product structures by combining spectral
  or in-silico annotation evidence with the taxonomic distance between the study organism and known producers of
  candidate compounds.
description: Taxonomically informed scoring adds biological provenance to conventional candidate ranking. Candidate
  structures are first generated from spectral libraries or in-silico annotation. Known organism–compound associations
  are then used to calculate taxonomic relevance, allowing candidates reported from related organisms to receive
  additional support without treating taxonomy as structural proof.
publication:
  title: Taxonomically Informed Scoring Enhances Confidence in Natural Products Annotation
  doi: 10.3389/fpls.2019.01329
  url: https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2019.01329/full
  citation: Rutz A, Dounoue-Kubo M, Ollivier S, et al. Taxonomically Informed Scoring Enhances Confidence in Natural
    Products Annotation. Frontiers in Plant Science 10, 1329 (2019).
  journal: Frontiers in Plant Science
  year: 2019
