workflow_steps:
- title: Generate candidate structural annotations
  description: Use spectral-library or in-silico annotation to generate ranked candidate structures for MS/MS features.
- title: Retrieve candidate biological-source information
  description: Collect taxonomic provenance for candidate natural products from curated structure–organism resources.
  tool_slugs:
  - lotus
  - natural-products-atlas
- title: Calculate taxonomic relevance
  description: Compare the taxonomy of the analyzed organism with reported producers of each candidate and convert
    the distance into an annotation-support score.
- title: Rerank candidates
  description: Combine chemical and taxonomic evidence while retaining the original annotation evidence and uncertainty.
tools:
- slug: lotus
  role: Structure–organism occurrence context.
- slug: natural-products-atlas
  role: Natural-product taxonomic provenance, especially microbial compounds.
resources:
  code_available: true
  code_url: https://github.com/oolonek/taxo_scorer
  method_available: true
  method_url: https://doi.org/10.3389/fpls.2019.01329
scope:
  designed_for:
  - Improving candidate ranking when reliable organism identity and candidate source-occurrence information are
    available.
  requirements:
  - A taxonomically identified source organism.
  - Candidate structures with linked biological-source metadata.
  considerations:
  - Taxonomy is supporting evidence and cannot establish structure.
  - Published occurrence databases are incomplete and biased toward studied taxa.
  - The linked contemporary resources illustrate ways to implement the strategy; they are not all software used
    in the original publication.
