- data_acquisition
- statistics
ask_keywords:
- kinetic flux profiling
- KFP
- isotope labeling
- metabolic flux
- turnover
- time course
- pool size
workflow_steps:
- title: Switch nutrient isotope labeling
  description: Change the isotopic nutrient source while preserving the intended culture conditions.
- title: Sample the labeling time course
  description: Quench and extract replicate samples at times that resolve metabolite turnover.
- title: Measure labeling and pool sizes
  description: Use chromatography-MS to quantify unlabeled fractions and intracellular metabolite concentrations.
- title: Fit the specified kinetic model
  description: Estimate turnover and flux using equations appropriate to precursor labeling and pathway
    structure.
tools: []
resources:
  method_available: true
  method_url: https://doi.org/10.1038/nprot.2008.131
scope:
  designed_for:
  - Flux estimation in cultured cells with experimentally resolved labeling kinetics.
  requirements:
  - Rapid nutrient switching, timed quenching, isotope-resolved measurements and pool-size quantification.
  considerations:
  - Basic interpretation assumes metabolic steady state; dynamic variants require additional modeling.
  - Reliable quantification requires resolving turnover relative to upstream precursor labeling.
  - A single endpoint or labeling half-time without pool-size and model context does not establish absolute
    flux.
