slug: kinetic-flux-profiling
name: Kinetic flux profiling from isotope-labeling time courses
summary: Combine isotope-label incorporation kinetics with metabolite pool sizes to estimate cellular
  fluxes under an explicit kinetic model.
description: Kinetic flux profiling follows replacement of unlabeled metabolites after switching a nutrient
  source to its isotope-labeled equivalent. The original demonstration used nitrogen assimilation in cultured
  E. coli; the transferable contribution is the link between labeling dynamics, pool sizes and flux.
publication:
  title: Kinetic flux profiling of nitrogen assimilation in Escherichia coli
  doi: 10.1038/nchembio816
  year: 2006
  journal: Nature Chemical Biology
  citation: Yuan et al. Kinetic flux profiling of nitrogen assimilation in Escherichia coli. Nature Chemical
    Biology (2006).
purpose:
  primary: flux_analysis
  secondary:
  - stable_isotope_tracing
platforms:
