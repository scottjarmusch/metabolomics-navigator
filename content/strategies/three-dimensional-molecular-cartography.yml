slug: three-dimensional-molecular-cartography
name: 3D molecular cartography
summary: A spatial metabolomics strategy that combines systematic surface sampling, LC-MS/MS, coordinate-aware metadata
  and 2D/3D molecular mapping to reconstruct the distribution of metabolites and environmental chemicals across
  physical objects.
description: 3D molecular cartography extends metabolomics beyond conventional bulk samples by attaching each extraction
  to a physical coordinate. LC-MS data are processed and annotated, then mapped onto photographs or 3D surface models
  so chemical distributions can be explored spatially. Cartographical snapshots preserve visualization settings
  for reproducibility.
publication:
