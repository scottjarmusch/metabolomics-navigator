workflow_steps:
- title: Define a spatial sampling scheme
  description: Record coordinates for reproducible sampling across a surface, organism or object.
- title: Extract and profile each location
  description: Analyze spatially indexed extracts by LC-MS/MS with appropriate blanks and quality controls.
- title: Process and annotate features
  description: Generate a quantitative feature table and molecular annotations while preserving spatial sample identifiers.
- title: Map molecular features onto the physical model
  description: Join feature abundance to sampling coordinates and visualize the chemical distribution on a 2D image
    or 3D model.
