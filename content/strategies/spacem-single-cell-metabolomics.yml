slug: spacem-single-cell-metabolomics
name: Spatially registered single-cell metabolomics
aliases:
- SpaceM
summary: A single-cell metabolomics strategy that registers microscopy-derived cell boundaries and morphologic information with MALDI imaging mass spectrometry so spatial ion signals can be assigned to individual cells.
description: SpaceM combines light microscopy, image segmentation, MALDI mass spectrometry imaging, and spatial registration to convert tissue- or culture-level ion images into per-cell metabolic profiles. The key methodological step is aligning optical cell information with MSI ablation coordinates so metabolite signals can be associated with individual cells while retaining morpho-spatial context.
publication:
  title: SpaceM reveals metabolic states of single cells
  doi: 10.1038/s41592-021-01198-0
  url: https://doi.org/10.1038/s41592-021-01198-0
