workflow_steps:
- title: Acquire microscopy of the same cells
  description: Record optical images that preserve cell morphology and spatial context before MALDI analysis.
- title: Segment individual cells
  description: Derive cell boundaries and image-derived features from the optical data.
- title: Acquire MALDI mass spectrometry imaging
  description: Collect spatially resolved metabolite signals across the same cellular field.
- title: Register optical and MSI coordinate systems
  description: Align cell masks with MALDI ablation locations so mass-spectral signals can be assigned to individual cells.
- title: Construct per-cell metabolic profiles
  description: Aggregate registered ion signals into a cell-by-metabolite matrix while retaining morphologic and spatial information.
- title: Identify metabolic cell states
  description: Analyze single-cell metabolic profiles to distinguish heterogeneous cell states and relate them to morphology or experimental conditions.
tools:
