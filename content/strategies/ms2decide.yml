workflow_steps:
- title: Prepare aligned inputs
  description: Provide a quantitative CSV table, MGF spectra and compatible SIRIUS annotation results
    with matching feature identifiers.
- title: Collect complementary annotations
  description: Obtain GNPS spectral matches and ISDB-LOTUS results alongside SIRIUS candidates.
  tool_slugs:
  - gnps
  - sirius
- title: Combine evidence and prioritize
  description: Use the documented K-estimation method to combine annotation evidence and export ranked
    results for review.
- title: Review candidates
  description: Inspect spectra, annotation disagreements and experimental context before selecting follow-up
    experiments.
tools:
- slug: gnps
- slug: sirius
- name: ISDB-LOTUS
