slug: ms2decide
name: MS2DECIDE
summary: Tandem mass spectrum to decision (MS2DECIDE) leverages decision theory and expert knowledge to
  aggregate the outputs of three widely used annotation tools (GNPS, Sirius, and ISDB-LOTUS) and compute
  a recommendation for targeting natural products with regard to their potential novelty.
publication:
  doi: 10.1002/cmtd.202400088
  url: https://doi.org/10.1002/cmtd.202400088
  title: 'MS2DECIDE: Aggregating Multiannotated Tandem Mass Spectrometry Data with Decision Theory Enhances
    Natural Products Prioritization'
  journal: Chemistry–Methods
  year: 2025
  citation: 'Mejri, Yassine et al. MS2DECIDE: Aggregating Multiannotated Tandem Mass Spectrometry Data
    with Decision Theory Enhances Natural Products Prioritization. Chemistry–Methods (2025). DOI: 10.1002/cmtd.202400088.'
purpose:
  primary: natural_product_discovery
  secondary: []
