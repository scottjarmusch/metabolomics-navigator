scope:
  designed_for:
  - Prioritizing natural-product features using multiple annotation sources.
  requirements:
  - Compatible feature tables, MS/MS spectra and annotation files; Python and access to the services used
    by the chosen implementation.
  considerations:
  - Scores depend on annotation coverage and the decision model; they are not experimental identification
    or proof of novelty.
  - Follow the repository documentation for supported SIRIUS and GNPS versions.
