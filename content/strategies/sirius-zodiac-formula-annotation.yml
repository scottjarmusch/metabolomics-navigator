$schema: ../../schemas/strategy.schema.json
slug: sirius-zodiac-formula-annotation
name: Molecular-formula annotation with SIRIUS and ZODIAC
summary: A high-resolution MS/MS workflow that generates molecular-formula candidates with SIRIUS and optionally
  re-ranks formula assignments across a dataset using ZODIAC.
description: SIRIUS uses isotope patterns and fragmentation trees to score molecular-formula candidates. ZODIAC
  adds dataset-level re-ranking by exploiting shared fragments and neutral losses between fragmentation trees, using
  Bayesian inference and Gibbs sampling to improve formula assignments across related spectra.
publication:
  title: Database-independent molecular formula annotation using Gibbs sampling through ZODIAC
  doi: 10.1038/s42256-020-00234-6
  url: https://www.nature.com/articles/s42256-020-00234-6
  citation: Ludwig M, Nothias L-F, Dührkop K, et al. Database-independent molecular formula annotation using Gibbs
    sampling through ZODIAC. Nature Machine Intelligence 2, 629–641 (2020).
  journal: Nature Machine Intelligence
  year: 2020
purpose:
  primary: metabolite_annotation
  secondary:
