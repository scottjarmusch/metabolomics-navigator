workflow_steps:
- title: Import centroided spectra or LC-MS runs
  description: Import preprocessed .ms/.mgf/.msp-style spectra or centroided mzML/mzXML runs. SIRIUS 6 can create
    a project space and perform its built-in LC-MS feature detection/alignment for mzML/mzXML inputs.
  tool_slugs:
  - sirius
- title: Generate formula candidates with SIRIUS
  description: Use accurate precursor mass, isotope-pattern evidence, and fragmentation trees to score candidate
    molecular formulas and annotate fragment formulas.
  tool_slugs:
  - sirius
- title: Apply ZODIAC when dataset-level re-ranking is useful
  description: Use ZODIAC to jointly re-rank formula candidates across a collection of spectra based on shared fragmentation-tree
    fragments and losses.
  tool_slugs:
  - sirius
- title: Review formula confidence and ambiguity
  description: Inspect top formula candidates, scores, adduct assumptions, isotope/fragmentation support, and alternative
    candidates before downstream structural annotation.
  tool_slugs:
  - sirius
tools:
- slug: sirius
  role: Integrated formula, fingerprint, class, database-search, confidence, and de novo structure workflows.
resources:
  code_available: true
  code_url: https://github.com/sirius-ms/sirius
  method_available: true
  method_url: https://v6.docs.sirius-ms.io/
scope:
  designed_for:
  - High-resolution MS/MS formula annotation, including unknowns whose formulas may not be represented in structure
    databases.
  - Dataset-level molecular-formula re-ranking when multiple fragmentation trees can provide shared evidence.
  requirements:
  - Accurate precursor mass and preferably informative MS/MS; isotope-pattern quality improves formula annotation.
  considerations:
  - Molecular-formula annotation is an intermediate step, not complete structural identification.
  - ZODIAC is most useful when processing collections of compounds/spectra because its re-ranking uses relationships
    across fragmentation trees.
