workflow_steps:
- title: Construct target and decoy assays
  description: Build assays from DDA spectra with fragment annotations.
  tool_slugs:
  - openms
  - sirius
- title: Extract DIA chromatograms
  description: Use the assay library to extract candidate peak groups.
  tool_slugs:
  - openms
- title: Score and filter results
  description: Estimate false-discovery rates before interpreting quantified features.
  tool_slugs:
  - openms
