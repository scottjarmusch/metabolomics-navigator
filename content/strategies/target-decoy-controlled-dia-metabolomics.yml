slug: target-decoy-controlled-dia-metabolomics
name: Target-decoy-controlled DIA metabolomics
summary: Use DDA-derived assay libraries and decoy scoring to control false discoveries during targeted
  DIA extraction.
description: DIAMetAlyzer links assay construction, chromatographic extraction and statistical validation.
  Its distinguishing contribution is error-controlled extraction, rather than merely combining acquisition
  modes.
publication:
  title: DIAMetAlyzer allows automated false-discovery rate-controlled analysis for data-independent acquisition
    in metabolomics
  doi: 10.1038/s41467-022-29006-z
  year: 2022
  journal: Nature Communications
  citation: Alka et al. DIAMetAlyzer allows automated false-discovery rate-controlled analysis for data-independent
    acquisition in metabolomics. Nature Communications (2022).
purpose:
  primary: metabolite_annotation
  secondary: []
