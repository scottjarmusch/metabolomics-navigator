$schema: ../../schemas/strategy.schema.json
slug: dadia-hybrid-acquisition
name: DDA-assisted DIA metabolomics
aliases:
- DaDIA
summary: A hybrid untargeted acquisition strategy that analyzes individual samples by DIA for broad feature and MS/MS coverage while using pooled quality-control samples by DDA to obtain cleaner fragmentation spectra for annotation.
description: DaDIA deliberately separates the strengths of two acquisition modes across the study design. Biological samples are acquired using data-independent acquisition to maximize feature and fragmentation coverage, while pooled QC samples are acquired using data-dependent acquisition to generate higher-quality, less multiplexed MS/MS spectra. Computational integration then associates the complementary DDA and DIA evidence for metabolite annotation.
publication:
  title: 'DaDIA: Hybridizing Data-Dependent and Data-Independent Acquisition Modes for Generating High-Quality Metabolomic Data'
  doi: 10.1021/acs.analchem.0c05022
  url: https://doi.org/10.1021/acs.analchem.0c05022
  citation: Guo J, Shen S, Xing S, Huan T. DaDIA Hybridizing Data-Dependent and Data-Independent Acquisition Modes for Generating High-Quality Metabolomic Data. Analytical Chemistry 93, 2669-2677 (2021).
  journal: Analytical Chemistry
  year: 2021
purpose:
  primary: metabolite_annotation
  secondary:
  - molecular_discovery
platforms:
- lc_ms
analysis_types:
- untargeted
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - dda
