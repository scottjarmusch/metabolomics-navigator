workflow_steps:
- title: Prepare representative pooled QC material
  description: Pool study material so the QC contains a broad representation of metabolites observed across the sample set.
- title: Acquire individual study samples by DIA
  description: Use DIA on individual biological samples to maximize feature detection and fragmentation coverage.
- title: Acquire pooled QC samples by DDA
  description: Use DDA on pooled QC material to obtain cleaner precursor-specific fragmentation spectra.
- title: Integrate DDA and DIA information
  description: Associate feature-level quantitative data and DIA coverage with higher-quality DDA spectra from the pooled QC.
  external_tools:
  - name: DaDIA.R
    url: https://github.com/HuanLab/DaDIA
- title: Annotate and interpret the combined dataset
  description: Use integrated evidence for metabolite annotation and downstream statistical interpretation.
tools:
- name: DaDIA.R
  url: https://github.com/HuanLab/DaDIA
  role: Computational integration and annotation of the hybrid DDA/DIA dataset.
resources:
  code_available: true
  code_url: https://github.com/HuanLab/DaDIA
  method_available: true
  method_url: https://doi.org/10.1021/acs.analchem.0c05022
scope:
  designed_for:
  - Untargeted LC-MS studies seeking broad DIA coverage without sacrificing access to cleaner DDA spectra.
  - Studies already using pooled QC samples and able to dedicate additional injections to complementary acquisition.
  requirements:
  - A representative pooled QC sample.
  - Instrument support for both DIA and DDA acquisition.
  considerations:
  - The workflow increases acquisition and computational complexity relative to one acquisition mode.
  - Spectra obtained from pooled QC material must be mapped appropriately back to features in individual samples.
