slug: stable-isotope-labeling-molecular-networking
name: Stable-isotope labeling–assisted molecular networking
summary: A biosynthetic discovery strategy that combines stable-isotope precursor feeding with LC-MS/MS molecular
  networking to identify structurally related metabolites that incorporate a defined biosynthetic building block.
description: Stable-isotope labeling–assisted molecular networking layers biosynthetic incorporation information
  onto MS/MS similarity. A labeled precursor such as a stable-isotope amino acid is supplied to a producing organism,
  labeled mass shifts are detected in metabolite features, and molecular networking groups related MS/MS spectra.
  The combination helps distinguish biosynthetically connected analogues and can provide sequence or building-block
  information that molecular networking alone does not supply.
publication:
  title: Combining Stable Isotope Labeling and Molecular Networking for Biosynthetic Pathway Characterization
  doi: 10.1021/acs.analchem.5b01934
  url: https://pubs.acs.org/doi/10.1021/acs.analchem.5b01934
  citation: Klitgaard A, Nielsen JB, Frandsen RJN, Andersen MR, Nielsen KF. Combining Stable Isotope Labeling and
    Molecular Networking for Biosynthetic Pathway Characterization. Analytical Chemistry 87, 6520–6526 (2015).
  journal: Analytical Chemistry
  year: 2015
