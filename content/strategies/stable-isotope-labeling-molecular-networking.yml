workflow_steps:
- title: Select and feed a stable-isotope precursor
  description: Add a labeled biosynthetic building block to the culture under conditions that permit incorporation
    into specialized metabolites, while retaining appropriate unlabeled controls.
- title: Detect isotope incorporation
  description: Compare labeled and unlabeled LC-MS data to identify features with mass shifts consistent with incorporation
    of the supplied precursor.
- title: Acquire and compare MS/MS spectra
  description: Collect fragmentation spectra for candidate labeled and related metabolites.
- title: Build a molecular network
  description: Organize structurally related spectra by MS/MS similarity and overlay isotope-incorporation evidence
    to recognize families sharing the labeled building block.
  tool_slugs:
  - gnps
- title: Infer biosynthetic or structural relationships
  description: Use the combined label pattern and fragmentation relationships to prioritize analogues, infer building-block
    composition, and guide targeted structural validation.
tools:
- slug: gnps
  role: Molecular networking of related MS/MS spectra.
resources:
  method_available: true
  method_url: https://pubs.acs.org/doi/10.1021/acs.analchem.5b01934
scope:
  designed_for:
  - Linking natural-product analogues to a supplied biosynthetic precursor.
  - Characterizing families of peptide or other metabolites where isotope incorporation provides interpretable biosynthetic
    information.
  requirements:
  - A biologically plausible labeled precursor and culture system capable of incorporating it.
  - Matched labeled and unlabeled controls and sufficient mass accuracy to resolve the expected isotope shift.
  considerations:
  - Label incorporation may be incomplete, diluted by metabolism, or redistributed into downstream metabolites.
  - Molecular similarity and label incorporation support a biosynthetic relationship but do not by themselves establish
    complete pathway genetics or final structure.
provenance:
