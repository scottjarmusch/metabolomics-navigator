workflow_steps:
- title: Acquire MALDI protein fingerprints from individual isolates
  description: Analyze colony material in the higher mass range to generate replicate protein fingerprints suitable
    for similarity grouping.
  tool_slugs: []
  external_tools:
  - name: IDBac
    url: https://idbac.org/
- title: Group taxonomically similar isolates
  description: Use protein-profile clustering to organize the collection into operational groups of closely related
    isolates.
  tool_slugs: []
  external_tools:
  - name: IDBac
    url: https://idbac.org/
- title: Acquire specialized-metabolite profiles
  description: Analyze the lower mass region from the same isolate collection to capture differences in specialized-metabolite
    production.
  tool_slugs: []
  external_tools:
  - name: IDBac
    url: https://idbac.org/
- title: Compare chemical overlap within taxonomic groups
  description: Use metabolite association patterns to identify isolates that add distinct chemistry rather than
    duplicating existing profiles.
  tool_slugs: []
  external_tools:
  - name: IDBac
    url: https://idbac.org/
- title: Select a reduced but diverse library
  description: Prioritize representatives that retain taxonomic breadth and specialized-metabolite diversity for
    fermentation, extraction, and downstream discovery.
tools:
- role: Protein-profile grouping, specialized-metabolite comparison, and isolate prioritization.
  name: IDBac
  url: https://idbac.org/
resources:
  method_available: true
  method_url: https://pubs.acs.org/doi/10.1021/acs.jnatprod.9b00168
scope:
  designed_for:
  - Building or reducing bacterial isolate libraries for natural-product discovery.
  - Prioritizing isolates before scale-up using both relatedness and chemical phenotype.
  requirements:
  - Cultured bacterial isolates and reproducible MALDI protein and small-molecule acquisitions.
  considerations:
  - Culture conditions strongly influence specialized-metabolite profiles, so observed chemical redundancy is condition-dependent.
  - Protein spectral similarity is an operational grouping method and does not replace sequence-based taxonomy when
    definitive identification is required.
