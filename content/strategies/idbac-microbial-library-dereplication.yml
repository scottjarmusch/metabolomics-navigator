slug: idbac-microbial-library-dereplication
name: Taxonomy- and metabolite-aware microbial library prioritization with IDBac
summary: A microbial natural-product discovery strategy that combines MALDI protein fingerprinting with specialized-metabolite
  overlap to reduce taxonomic and chemical redundancy when constructing or downsizing isolate libraries.
description: This strategy uses two complementary MALDI information spaces before scale-up. Protein-region spectra
  group bacterial isolates by taxonomic or strain-level similarity, while lower-mass specialized-metabolite spectra
  reveal chemical overlap within those groups. Isolates can then be selected to preserve phylogenetic breadth while
  minimizing redundant natural-product profiles, shifting strain prioritization from morphology or taxonomy alone
  to combined biological and chemical evidence.
publication:
