slug: bioactivity-based-molecular-networking
name: Bioactivity-Based Molecular Networking
summary: A transferable natural-product discovery strategy that overlays quantitative bioassay results onto LC-MS
  feature abundance and MS/MS molecular networks to prioritize molecular families and individual features associated
  with biological activity.
description: Bioactivity-Based Molecular Networking adds an orthogonal biological evidence layer to molecular networking.
  Fractionated samples are profiled by LC-MS/MS and tested in a quantitative bioassay. Feature abundances across
  fractions are correlated with bioactivity, producing a bioactivity score that is mapped onto the molecular network.
  This allows active molecular families and candidate analogues to be prioritized before isolation while preserving
  molecular-network annotation and dereplication context.
publication:
  title: Bioactivity-Based Molecular Networking for the Discovery of Drug Leads in Natural Product Bioassay-Guided
    Fractionation
  doi: 10.1021/acs.jnatprod.7b00737
  url: https://pubs.acs.org/doi/10.1021/acs.jnatprod.7b00737
  citation: Nothias L-F, Nothias-Esposito M, da Silva R, et al. Bioactivity-Based Molecular Networking for the Discovery
