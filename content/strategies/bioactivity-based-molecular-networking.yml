  method_available: true
  method_url: https://pubs.acs.org/doi/10.1021/acs.jnatprod.7b00737
scope:
  designed_for:
  - Bioassay-guided natural-product discovery where the same fractions or samples have quantitative LC-MS feature
    data and biological activity measurements.
  - Prioritizing active analogues within molecular families before purification.
  requirements:
  - Reproducible quantitative bioassay values matched to metabolomics samples.
  - Sufficient variation in both feature abundance and bioactivity across the sample or fraction series.
  - The supplied implementation uses MZmine 2 or Optimus exports and an R script or R-kernel Jupyter notebook; check
    current export compatibility.
  considerations:
  - Correlation between a feature and bioactivity is prioritization evidence, not proof that the feature causes
    the phenotype.
  - Coeluting or covarying metabolites can receive similar activity scores and require follow-up isolation or orthogonal
    validation.
