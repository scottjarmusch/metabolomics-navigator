workflow_steps:
- title: Generate fractions and quantitative bioassay data
  description: Fractionate the bioactive extract or sample set and measure a quantitative biological response for
    the same fractions used for metabolomics.
- title: Acquire untargeted LC-MS/MS profiles
  description: Profile the fractions by LC-MS/MS so that feature abundance across fractions and fragmentation spectra
    are available.
- title: Detect and quantify features
  description: Process the LC-MS/MS data to generate aligned feature intensities across the fraction series.
  tool_slugs:
  - mzmine
  - openms
- title: Calculate feature–bioactivity associations
  description: Correlate feature abundance across fractions with the quantitative bioassay response to calculate
    a bioactivity score for each feature.
  external_tools:
  - name: Bioactive Molecular Networks Jupyter workflow
    url: https://github.com/DorresteinLaboratory/Bioactive_Molecular_Networks
- title: Build and annotate the molecular network
  description: Generate a molecular network from MS/MS similarity and attach the bioactivity scores as node attributes
    so active molecular families can be recognized in chemical context.
  tool_slugs:
  - gnps
- title: Prioritize and validate active chemistry
  description: Select high-scoring features or molecular families for isolation, orthogonal structural work, and
    direct activity confirmation.
tools:
- slug: mzmine
  role: One supported route for aligned LC-MS/MS feature detection and quantification.
- slug: openms
  role: Alternative supported preprocessing route used by the original workflow through Optimus/OpenMS.
- slug: gnps
  role: MS/MS molecular networking and library-based dereplication.
- name: Bioactive Molecular Networks Jupyter workflow
  url: https://github.com/DorresteinLaboratory/Bioactive_Molecular_Networks
  role: Calculates and maps feature–bioactivity association scores.
- role: Visualization of molecular networks with bioactivity attributes.
  name: Cytoscape
  url: https://cytoscape.org/
resources:
