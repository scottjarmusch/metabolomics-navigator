slug: maldi-fish
name: Correlative metabolite and microbial imaging with MALDI-FISH
aliases:
- (MA)LDI-FISH
- MALDI-FISH
- metaFISH
summary: Combine mass spectrometry imaging with taxon-specific fluorescence labeling to associate spatial chemistry
  with microbial identity.
publication:
  title: Linking metabolite production to taxonomic identity in environmental samples by (MA)LDI-FISH
  doi: 10.1038/ismej.2015.122
  year: 2016
  journal: The ISME Journal
  citation: Kaltenpoth M, Strupat K, Svatos A. The ISME Journal 10, 527-531 (2016); first published online 14 July
    2015.
purpose:
  primary: spatial_metabolomics
  secondary:
  - host_microbe_interaction
platforms:
- imaging_ms
components:
- sample_preparation
- data_acquisition
- metadata_analysis
tools: []
workflow_steps:
- title: Preserve spatial correspondence
  description: Prepare material compatible with both fluorescence labeling and MSI.
- title: Measure chemistry and microbial identity
  description: Acquire ion images and taxon-specific FISH fluorescence using the sequence specified by the selected
    published method.
- title: Register and compare images
  description: Align the two measurements to assess which chemical distributions coincide with labeled microbes.
scope:
  designed_for:
  - Spatial association of metabolites with microbes in heterogeneous samples.
  requirements:
  - MS imaging and taxon-specific FISH microscopy from corresponding material.
  - Validated preparation, imaging order and spatial registration.
  considerations:
  - Colocalization alone does not establish biosynthesis or metabolite exchange.
  - Resolution depends on both modalities; the original method should not be described as universally single-cell.
