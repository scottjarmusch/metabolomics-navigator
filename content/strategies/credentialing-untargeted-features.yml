workflow_steps:
- title: Generate matched unlabeled and uniformly 13C-labeled biological material
  description: Grow a model biological system in natural-abundance and uniformly 13C-enriched media.
- title: Prepare defined isotope mixtures
  description: Mix labeled and unlabeled extracts at known ratios so true biological features have predictable isotope
    spacing and intensity relationships.
- title: Run the candidate untargeted workflow
  description: Process the mixtures using the extraction, chromatography, instrument and feature-detection workflow
    to be benchmarked.
- title: Credential biological features
  description: Identify feature pairs that satisfy the expected mass shifts, retention-time agreement and isotope-intensity
    ratios.
- title: Optimize the workflow
  description: Compare the number and behavior of credentialed features rather than total feature count when tuning
    experimental or computational parameters.
