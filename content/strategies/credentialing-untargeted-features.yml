  citation: 'Mahieu NG, Huang X, Chen Y-J, Patti GJ. Credentialing Features: A Platform to Benchmark and Optimize
    Untargeted Metabolomic Methods. Analytical Chemistry 86, 9583–9589 (2014).'
  journal: Analytical Chemistry
  year: 2014
