slug: credentialing-untargeted-features
name: Credentialing untargeted metabolomics features
summary: A method-development strategy that uses mixtures of natural-abundance and uniformly 13C-labeled biological
  extracts to distinguish genuine biological features from artifacts and benchmark untargeted metabolomics workflows.
description: Credentialing creates an experimental ground truth for whether untargeted LC-MS features arise from
  biological metabolites. Natural-abundance and uniformly 13C-labeled material are mixed at defined ratios; expected
  isotope spacing and intensity relationships are used to label credible biological features. The number and quality
  of credentialed features can then be used to optimize extraction, chromatography, acquisition or feature-processing
  parameters.
publication:
  title: 'Credentialing Features: A Platform to Benchmark and Optimize Untargeted Metabolomic Methods'
  doi: 10.1021/ac503092d
