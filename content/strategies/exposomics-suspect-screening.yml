slug: exposomics-suspect-screening
name: Suspect screening of exposome-related xenobiotics
summary: An exposomics strategy that interrogates untargeted UHPLC-HRMS/MS data with curated lists of plausible xenobiotics and metabolites, then applies chromatographic, spectral, and error-control evidence to prioritize candidate exposures.
description: Suspect screening occupies the space between targeted analysis and fully non-target screening. Rather than requiring authentic standards for every analyte or searching every detected feature without prior hypotheses, the workflow begins with curated suspect lists and tests whether those candidates are supported by accurate mass, chromatographic peak quality, fragmentation evidence, and matrix-aware filtering. The 2024 workflow evaluated this approach across multiple human biofluids and explicitly measured false-positive and false-negative behavior.
publication:
  title: Development and evaluation of a comprehensive workflow for suspect screening of exposome-related xenobiotics and phase II metabolites in diverse human biofluids
  doi: 10.1016/j.chemosphere.2024.141221
