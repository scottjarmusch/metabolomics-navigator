workflow_steps:
- title: Build suspect lists
  description: Assemble plausible parent xenobiotics and phase-II metabolites relevant to the exposure question and sample matrix.
- title: Acquire UHPLC-HRMS/MS data
  description: Analyze biofluids using high-resolution MS with fragmentation information suitable for candidate assessment.
- title: Filter chromatographic features for peak quality
  description: Apply automated peak-quality criteria to reduce poor chromatographic candidates before manual review.
- title: Compare candidates with suspect and endogenous lists
  description: Evaluate expected xenobiotic candidates while accounting for endogenous molecules that may create annotation interference.
- title: Evaluate structural evidence
  description: Combine accurate mass, isotope/adduct behavior, fragmentation evidence, and available reference information to annotate candidates.
- title: Estimate identification errors
  description: Assess false positives and false negatives using standards or spiked samples where available.
tools:
- name: Compound Discoverer
  role: Software used in the published implementation for peak-quality assessment and suspect-screening processing.
resources:
  method_available: true
  method_url: https://doi.org/10.1016/j.chemosphere.2024.141221
scope:
  designed_for:
  - Screening broad but hypothesis-informed sets of environmental or exogenous chemicals in human biofluids.
  - Exposomics studies where fully targeted assays would be too narrow but unconstrained non-target identification is impractical.
  requirements:
  - Curated suspect lists appropriate to the study question.
  - High-resolution MS data and enough spectral/chromatographic evidence to evaluate candidates.
  considerations:
  - Suspect-list composition determines which exposure space is visible.
  - Matrix interferences and endogenous molecules can create both false positives and false negatives.
