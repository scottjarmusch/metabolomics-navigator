  submitted_by: curator
  author_verified: false
  notes: >-
    Primary indexed methods, official SECIM documentation and author code repository reviewed
    on 2026-09-21. DOI/title/year checked against Crossref. The 2017 paper formalizes this
    automated metabolomics workflow, not the invention of iterative exclusion. No instrument
    or software execution validation performed.
