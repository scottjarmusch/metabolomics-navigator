$schema: ../../schemas/strategy.schema.json
slug: ozid-structural-lipidomics
name: Ozone-induced dissociation for structural lipidomics
summary: A structural-lipidomics strategy that uses ozone-induced dissociation to generate diagnostic fragments
  for carbon–carbon double-bond positions that conventional CID-based lipidomics often cannot resolve.
description: Ozone-induced dissociation (OzID) adds gas-phase chemical reactivity to lipid analysis. Reactions of
  mass-selected unsaturated lipid ions produce diagnostic fragments that locate carbon–carbon double bonds. The
  method complements collision-induced fragmentation. Later implementations can combine separation and automated
  interpretation, but their acquisition and software requirements are implementation-specific.
publication:
  title: 'Ozone-Induced Dissociation: Elucidation of Double Bond Position within Mass-Selected Lipid Ions'
  doi: 10.1021/ac7017684
  url: https://doi.org/10.1021/ac7017684
  citation: 'Thomas MC, Mitchell TW, Harman DG, Deeley JM, Nealon JR, Blanksby SJ. Ozone-Induced Dissociation: Elucidation
    of Double Bond Position within Mass-Selected Lipid Ions. Analytical Chemistry 80, 303–311 (2008).'
  journal: Analytical Chemistry
  year: 2008
