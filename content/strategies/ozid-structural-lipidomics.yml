workflow_steps:
- title: Acquire lipids under OzID-compatible conditions
  description: Introduce ozone into a compatible MS workflow so unsaturated lipid ions undergo diagnostic gas-phase
    oxidation.
- title: Collect diagnostic OzID fragments
  description: Acquire fragment pairs that encode the location of carbon–carbon double bonds.
- title: Resolve and score double-bond assignments
  description: Interpret diagnostic fragment pairs; a later tool such as LipidOz can automate this for its supported
    OzID–ion mobility MS acquisition format.
  tool_slugs: []
  external_tools:
  - name: LipidOz
    url: https://github.com/PNNL-m-q/lipidoz
- title: Validate structural isomers
  description: Confirm critical assignments with standards, retention/ion-mobility behavior or orthogonal structural
    evidence when available.
tools:
- role: Later automated interpretation for compatible OzID–ion mobility MS data; not part of the original 2008 implementation.
  name: LipidOz
  url: https://github.com/PNNL-m-q/lipidoz
resources:
  method_available: true
  method_url: https://doi.org/10.1021/ac7017684
scope:
  designed_for:
  - Resolving lipid double-bond positional isomers beyond conventional sum-composition or acyl-chain annotation.
  requirements:
  - Instrumentation or reaction setup capable of ozone-induced dissociation.
  - Appropriate acquisition methods and candidate lipid context.
  considerations:
  - OzID adds structural specificity but does not automatically resolve every lipid stereochemical ambiguity.
  - Instrumentation and reaction implementation are platform-dependent.
  - The primary source introduces OzID. LipidOz is a later software implementation; OzFAD and other variants are
    not treated as interchangeable methods here.
