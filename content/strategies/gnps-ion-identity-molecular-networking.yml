workflow_steps:
- title: Detect and align LC-MS/MS features
  description: Generate an aligned feature table with representative MS/MS spectra using a compatible preprocessing
    tool.
  tool_slugs:
  - mzmine
- title: Annotate ion identities
  description: In a documented ion-identity workflow, group chromatographic features and annotate plausible
    ion species using retention behavior, peak-shape correlation and expected mass relationships.
  tool_slugs:
  - mzmine
- title: Export FBMN and ion-identity edges
  description: Export the quantification table, representative MS/MS spectra and supplementary ion-identity
    pairs with matching feature identifiers. Follow the specific GNPS and preprocessing version documentation.
  tool_slugs:
  - mzmine
- title: Build the ion identity molecular network
  description: Run FBMN in GNPS with supplementary ion-identity relationships so that MS1 ion relationships
    and MS/MS spectral-similarity relationships are represented together.
  tool_slugs:
  - gnps
- title: Inspect compound-level ion groups and molecular families
  description: Distinguish ion-identity edges from spectral-similarity edges and review collapsed groups against
    the uncollapsed network. Check ambiguous assignments before propagating annotations.
  tool_slugs:
  - cytoscape
tools:
- slug: gnps
  role: Published GNPS FBMN/IIMN implementation; consult the linked IIMN documentation for the supported workflow.
- slug: mzmine
  role: Documented route for feature processing, ion-identity annotation and supplementary-pairs export.
- slug: cytoscape
  role: Inspect and style exported networks while retaining edge-type and feature metadata.
resources:
  code_available: true
  code_url: https://github.com/CCMS-UCSD/GNPS_Workflows
  method_available: true
  method_url: https://ccms-ucsd.github.io/GNPSDocumentation/fbmn-iin/
scope:
  designed_for:
  - LC-MS/MS datasets in which multiple ion species from the same molecule create redundant nodes or obscure
    molecular-family interpretation.
  - Combining chromatographic ion relationships with fragmentation-spectral relationships.
  requirements:
  - Feature-level chromatographic information, MS/MS spectra, and an ion-identity/supplementary-pairs export
    from a compatible preprocessing workflow.
  considerations:
  - Ion-identity assignments rely on chromatographic correlation and expected mass relationships and should
    be reviewed, particularly for crowded or poorly resolved chromatographic regions.
  - The original paper also describes MS-DIAL and XCMS with CAMERA export routes. Their version-specific scripts
    and formats must be checked before substituting them for the MZmine route shown here.
  - Features without MS/MS can participate through ion-identity edges when supported by the implementation;
    they do not thereby acquire an observed fragmentation spectrum.
  - Ion identity networking is not ion mobility networking and does not require ion mobility acquisition.
