slug: gnps-ion-identity-molecular-networking
name: Ion Identity Molecular Networking (IIMN)
summary: A strategy extending feature-based molecular networking with MS1-derived ion relationships, linking
  candidate ion species of the same molecule alongside MS/MS spectral-similarity edges.
description: 'Ion Identity Molecular Networking adds a second evidence layer to an FBMN network: relationships
  between candidate adducts, multimers and other ion species supported by chromatographic behavior and mass
  differences. MS1 ion-identity edges and MS/MS similarity edges have different meanings and should be interpreted
  separately. The published GNPS implementation can also collapse ion groups for visualization. These groupings
  are hypotheses about ion origin, not proof of a molecular structure.'
publication:
  title: Ion identity molecular networking for mass spectrometry-based metabolomics in the GNPS environment
  doi: 10.1038/s41467-021-23953-9
  url: https://www.nature.com/articles/s41467-021-23953-9
  citation: Schmid R, Petras D, Nothias L-F, et al. Ion identity molecular networking for mass spectrometry-based
    metabolomics in the GNPS environment. Nature Communications 12, 3832 (2021).
  journal: Nature Communications
  year: 2021
