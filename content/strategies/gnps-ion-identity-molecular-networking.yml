$schema: ../../schemas/strategy.schema.json
slug: gnps-ion-identity-molecular-networking
name: Ion Identity Molecular Networking (IIMN) in GNPS
summary: An extension of feature-based molecular networking that connects coeluting ion species of the same molecule
  using ion-identity relationships alongside MS/MS spectral similarity.
description: Ion Identity Molecular Networking adds MS1-derived relationships between adducts, multimers, in-source
  fragments, or other coeluting ion species to an FBMN network. These ion-identity edges reduce redundant disconnected
  representations of the same molecule and can improve network connectivity and annotation interpretation.
publication:
  title: Ion identity molecular networking for mass spectrometry-based metabolomics in the GNPS environment
  doi: 10.1038/s41467-021-23953-9
  url: https://www.nature.com/articles/s41467-021-23953-9
  citation: Schmid R, Petras D, Nothias L-F, et al. Ion identity molecular networking for mass spectrometry-based
    metabolomics in the GNPS environment. Nature Communications 12, 3832 (2021).
  journal: Nature Communications
  year: 2021
purpose:
  primary: metabolite_annotation
  secondary:
  - molecular_family_discovery
  - unknown_identification
  - molecular_discovery
platforms:
- lc_ms
analysis_types:
- untargeted
- metabolite_profiling
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - dda
  ion_mobility: supported
components:
- preprocessing
- annotation
- molecular_networking
- spectral_search
- data_sharing
workflow_steps:
- title: Detect and align LC-MS/MS features
  description: Generate an aligned feature table with representative MS/MS spectra using a compatible preprocessing
    tool.
  tool_slugs:
  - mzmine
  - ms-dial
  - xcms
- title: Annotate ion identities
  description: Group coeluting features using peak-shape/retention relationships and expected mass differences for
    adducts, multimers, or in-source products.
  tool_slugs:
  - mzmine
  - ms-dial
  - xcms
- title: Export FBMN and ion-identity edges
  description: Export the feature table, MS/MS spectra, and supplementary ion-identity pairs required by the GNPS
    FBMN/IIMN workflow.
  tool_slugs:
  - mzmine
  - ms-dial
  - xcms
- title: Build the ion identity molecular network
  description: Run FBMN in GNPS with supplementary ion-identity relationships so that MS1 ion relationships and
    MS/MS spectral-similarity relationships are represented together.
  tool_slugs:
  - gnps
- title: Inspect compound-level ion groups and molecular families
  description: Use the combined network to reduce redundant ion species, propagate annotations cautiously, and investigate
    unknown adduct or ion-ligand relationships.
  tool_slugs:
  - gnps
tools:
- slug: gnps
  role: FBMN/IIMN networking and network visualization.
- slug: mzmine
  role: Ion identity annotation, feature processing, and IIMN export.
- slug: ms-dial
  role: Compatible feature and ion/adduct annotation workflow.
- slug: xcms
  role: Compatible feature-processing ecosystem for ion-related preprocessing.
resources:
  code_available: true
  code_url: https://github.com/CCMS-UCSD/GNPS_Workflows
  method_available: true
  method_url: https://ccms-ucsd.github.io/GNPSDocumentation/fbmn-iin/
scope:
  designed_for:
  - LC-MS/MS datasets in which multiple ion species from the same molecule create redundant nodes or obscure molecular-family
    interpretation.
  - Combining chromatographic ion relationships with fragmentation-spectral relationships.
  requirements:
  - Feature-level chromatographic information, MS/MS spectra, and an ion-identity/supplementary-pairs export from
    a compatible preprocessing workflow.
  considerations:
  - Ion-identity assignments rely on chromatographic correlation and expected mass relationships and should be reviewed,
    particularly for crowded or poorly resolved chromatographic regions.
