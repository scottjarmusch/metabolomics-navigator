workflow_steps:
- title: Acquire paired molecular and optical images
  description: Measure MALDI ion images and microscopy of stained tissue from the same or an adjacent section. Preserve tissue
    coordinates and acquisition conditions.
- title: Register images and derive paired features
  description: Align tissue locations across modalities and derive microscopy descriptors such as hue, texture and entropy
    corresponding to the measured MS locations.
- title: Fit ion-specific cross-modal models
  description: Use partial least squares regression to model each ion intensity distribution from microscopy-derived predictors.
    Relationships and predictive performance differ between ions.
- title: Evaluate reconstruction and spatial reliability
  description: Examine reconstruction scores, absolute residual maps and bootstrap confidence-interval images for each ion.
    Do not use fusion to predict ions for which microscopy provides inadequate support.
- title: Predict supported molecular distributions
  description: Apply supported models to finer microscopy pixels or tissue regions with microscopy but no MS measurement.
    Label these outputs as predictions and retain the measured ion maps for comparison.
- title: Interpret with measurement-based checks
  description: Assess registration, sampling differences and model transfer before biological interpretation. Where feasible
    compare predictions with independent MS measurements; absence of optical support does not establish that an MS feature
    is noise.
tools:
- name: Molecular Image Fusion prototype
  url: https://fusion.vueinnovations.com/
  role: Published command-line implementation of IMS-microscopy predictive fusion; obtain the prototype and review its licensing
    and runtime requirements through the official distribution site.
resources:
  method_available: true
  method_url: https://doi.org/10.1038/nmeth.3296
scope:
  designed_for:
  - Linking lipid or small-molecule tissue distributions with optical morphology.
  - Predictive sharpening and spatial extrapolation when cross-modal relationships are supported.
  requirements:
  - Spatially registered microscopy and MSI measurements with corresponding tissue structures.
  - Ion-specific modeling and assessment of reconstruction, residuals and uncertainty.
  considerations:
  - Higher-resolution predictions do not increase the spatial resolution of the original MS measurements.
  - Some ion distributions have no usable microscopy relationship and should not be predicted.
  - Adjacent-section differences, registration errors and changed staining conditions can invalidate relationships.
  - Extrapolation to unmeasured regions requires scrutiny of model transfer and overfitting.
  - The original software is distributed through a licensing portal; open-source availability and execution have not been
    established.
