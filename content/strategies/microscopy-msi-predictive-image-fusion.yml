slug: microscopy-msi-predictive-image-fusion
name: Predictive fusion of microscopy and mass spectrometry imaging
aliases:
- IMS-microscopy image fusion
summary: Model spatial relationships between microscopy features and measured ion intensities, then use validated relationships
  to predict molecular distributions at finer spatial resolution or in unmeasured tissue regions.
description: 'This Strategy pairs registered microscopy with mass spectrometry imaging and fits a separate partial least squares
  relationship for each ion image. It goes beyond image overlays: optical features become predictors of molecular signals.
  The 2015 methodology formalizes this relationship for molecular tissue mapping, including lipid and small-molecule applications.
  Predicted distributions remain model outputs, not additional MS measurements or evidence of molecular identification.'
