workflow_steps:
- title: Acquire MS/MS spectra from complex extracts
  description: Generate tandem mass spectra from the natural-product mixture using a compatible ionization and acquisition workflow.
- title: Add reference spectra
  description: Include spectra from known standards, synthetic compounds, spectral libraries, or well-characterized organisms to provide dereplication anchors.
- title: Build a spectral molecular network
  description: Organize spectra according to fragmentation similarity so structurally related molecules cluster into molecular families.
  tool_slugs:
  - gnps
- title: Dereplicate known chemistry and related analogues
  description: Use reference-connected molecular families to recognize known compounds and prioritize related features that may represent analogues rather than rediscoveries.
- title: Prioritize chemistry for follow-up
  description: Advance molecular families that are poorly represented by known references or that contain features of specific biological or chemical interest.
tools:
- slug: gnps
  role: Contemporary implementation environment for MS/MS molecular networking and library searching.
resources:
  method_available: true
  method_url: https://doi.org/10.1021/np400413s
scope:
  designed_for:
  - Early-stage dereplication of natural-product extracts before time-intensive isolation.
  - Recognizing related analogues around known reference compounds through MS/MS similarity.
  requirements:
  - Reproducible MS/MS spectra from the sample set.
  - Suitable reference spectra or standards improve dereplication power.
  considerations:
  - Spectral similarity supports structural relatedness but is not complete structural confirmation.
  - Network structure depends on fragmentation quality, spectral preprocessing, and similarity thresholds.
