slug: molecular-networking-dereplication
name: Molecular networking as a dereplication strategy
summary: A natural-product dereplication strategy that organizes MS/MS spectra by fragmentation similarity and uses reference spectra, standards, or characterized organisms to recognize known molecules and related analogues before isolation.
description: This strategy uses spectral molecular networking as an early dereplication layer in natural-product discovery. Experimental MS/MS spectra from complex extracts are organized according to spectral similarity and compared with spectra from known standards, synthetic compounds, public libraries, or well-characterized organisms. Known chemistry can therefore seed molecular families and highlight related analogues that may not be present in reference databases, allowing novelty and redundancy to be assessed before lengthy purification.
