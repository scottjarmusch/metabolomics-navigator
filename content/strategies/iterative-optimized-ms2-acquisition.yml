$schema: ../../schemas/strategy.schema.json
slug: iterative-optimized-ms2-acquisition
name: Iterative optimized MS/MS acquisition
aliases:
- IODA
summary: Plan successive MS/MS acquisitions from an MS1 survey by optimizing precursor schedules across
  mass and retention time.
description: MS2Planner uses topological sorting on a feature graph to maximize scheduled coverage. Features
  selected for one path are excluded from the next planning iteration. This is computational scheduling
  of repeat acquisitions, rather than a requirement to measure fragmentation quality after every run.
publication:
  title: 'MS2Planner: improved fragmentation spectra coverage in untargeted mass spectrometry by iterative
    optimized data acquisition'
  doi: 10.1093/bioinformatics/btab279
  url: https://doi.org/10.1093/bioinformatics/btab279
  citation: 'Zuo Z, Cao L, et al. MS2Planner: improved fragmentation spectra coverage in untargeted mass
    spectrometry by iterative optimized data acquisition. Bioinformatics 37(Suppl 1), i231-i236 (2021).'
  journal: Bioinformatics
  year: 2021
purpose:
  primary: metabolite_annotation
  secondary:
  - molecular_discovery
  - unknown_identification
platforms:
- lc_ms
analysis_types:
- untargeted
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - dda
  - targeted_msms
  ion_mobility: unspecified
components:
- data_acquisition
- preprocessing
- annotation
workflow_steps:
- title: Acquire an MS1 survey
  description: The published IODA experiment begins with a full-scan MS1 measurement.
- title: Prepare features for scheduling
  description: Provide precursor masses, retention times and signals for the acquisition model.
- title: Optimize successive acquisition paths
  description: Use topological sorting; exclude scheduled features before computing the next path.
  external_tools:
  - name: MS2Planner
    url: https://github.com/mohimanilab/MS2Planner
- title: Export instrument inclusion lists
  description: The study provides companion scripts for inclusion-list generation.
  external_tools:
  - name: IODA_MS
    url: https://github.com/lfnothias/IODA_MS
- title: Acquire and assess scheduled spectra
  description: The paper tests inclusion-prioritized DDA and targeted-MS2 variants, with and without dynamic
    exclusion. Review coverage and spectral quality for the chosen mode.
tools:
- name: MS2Planner
  url: https://github.com/mohimanilab/MS2Planner
  role: Computes optimized paths over survey features for successive acquisitions.
- name: IODA_MS
  url: https://github.com/lfnothias/IODA_MS
  role: Companion inclusion-list generation scripts reported by the primary paper.
resources:
  code_available: true
  code_url: https://github.com/mohimanilab/MS2Planner
  method_available: true
  method_url: https://doi.org/10.1093/bioinformatics/btab279
scope:
  designed_for:
  - Increasing MS/MS coverage in untargeted LC-MS experiments when repeat injections are practical.
  - Building richer fragmentation coverage for annotation and discovery from representative or pooled
    samples.
  requirements:
  - Full-scan survey features and instrument support for the selected inclusion-list acquisition mode.
  - Sufficient sample for repeated injections and chromatography consistent with the planned retention-time
    windows.
  considerations:
  - Planning assumptions and acquisition timing must fit the instrument and chromatography.
  - This is not equivalent to a simple exclusion list updated after each measured DDA run; no universal
    coverage gain is promised.
