  method_available: true
  method_url: https://doi.org/10.1093/bioinformatics/btab279
scope:
  designed_for:
  - Increasing MS/MS coverage in untargeted LC-MS experiments when repeat injections are practical.
  - Building richer fragmentation coverage for annotation and discovery from representative or pooled samples.
  requirements:
  - Instrument control that supports precursor inclusion lists.
  - Sufficient sample quantity and reproducible chromatography across repeated injections.
  considerations:
  - Increased coverage requires additional acquisition time and sample.
  - Gains depend on feature detection quality and reproducibility between iterations.
