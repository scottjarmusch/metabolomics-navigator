$schema: ../../schemas/strategy.schema.json
slug: iterative-optimized-ms2-acquisition
name: Iterative optimized MS/MS acquisition
aliases:
- IODA
summary: A repeated-acquisition strategy that uses prior MS/MS coverage to generate optimized inclusion lists for subsequent injections, increasing the number of informative fragmentation spectra collected from an untargeted sample.
description: Conventional data-dependent acquisition repeatedly fragments abundant ions and can leave much of the detectable metabolome without MS/MS coverage. Iterative optimized data acquisition instead treats repeated injections as a planning problem. Features already covered are tracked, candidate precursors for the next injection are prioritized computationally, and successive acquisitions are used to increase nonredundant high-quality MS/MS coverage.
publication:
  title: 'MS2Planner: improved fragmentation spectra coverage in untargeted mass spectrometry by iterative optimized data acquisition'
  doi: 10.1093/bioinformatics/btab279
  url: https://doi.org/10.1093/bioinformatics/btab279
  citation: Dührkop K, Fleischauer M, Ludwig M, et al. MS2Planner improved fragmentation spectra coverage in untargeted mass spectrometry by iterative optimized data acquisition. Bioinformatics (2021).
  journal: Bioinformatics
  year: 2021
purpose:
  primary: metabolite_annotation
  secondary:
  - molecular_discovery
  - unknown_identification
platforms:
- lc_ms
analysis_types:
- untargeted
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - dda
  ion_mobility: unspecified
components:
- data_acquisition
- preprocessing
- annotation
workflow_steps:
- title: Acquire an initial untargeted LC-MS/MS run
  description: Collect MS1 and DDA MS/MS data from a representative sample or pooled sample.
- title: Determine existing MS/MS coverage
  description: Identify which detectable precursor features already have suitable fragmentation spectra and which remain uncovered.
- title: Optimize the next precursor list
  description: Use an iterative planning algorithm to select nonredundant precursor ions for the next acquisition.
  external_tools:
  - name: MS2Planner
    url: https://github.com/mohimanilab/MS2Planner
- title: Reacquire the sample with an optimized inclusion list
  description: Perform another LC-MS/MS acquisition targeting the selected precursor set.
- title: Repeat until coverage is sufficient
  description: Update the covered-feature set after each injection and iterate to increase cumulative MS/MS coverage.
tools:
- name: MS2Planner
  url: https://github.com/mohimanilab/MS2Planner
  role: Generates optimized precursor inclusion lists over iterative acquisitions.
resources:
  code_available: true
