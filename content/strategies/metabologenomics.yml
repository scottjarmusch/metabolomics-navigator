slug: metabologenomics
name: Metabologenomics
summary: A natural-product discovery strategy that correlates metabolite occurrence across a strain collection with
  biosynthetic gene-cluster or gene-cluster-family occurrence to connect chemistry with its likely genetic origin.
description: Metabologenomics treats a microbial strain collection as a panel of naturally varying experiments.
  Genome mining defines BGCs or GCFs, metabolomics defines spectra or molecular families, and co-occurrence across
  strains is scored to prioritize plausible BGC–metabolite links. The strategy can reveal both known and previously
  uncharacterized natural-product families without requiring a prior genetic hypothesis.
publication:
  title: 'Metabologenomics: Correlation of Microbial Gene Clusters with Metabolites Drives Discovery of a Nonribosomal
    Peptide with an Unusual Amino Acid Monomer'
  doi: 10.1021/acscentsci.5b00331
  url: https://pubs.acs.org/doi/10.1021/acscentsci.5b00331
  citation: 'Goering AW, McClure RA, Doroghazi JR, et al. Metabologenomics: Correlation of Microbial Gene Clusters
    with Metabolites Drives Discovery of a Nonribosomal Peptide with an Unusual Amino Acid Monomer. ACS Central
    Science (2016).'
  journal: ACS Central Science
  year: 2016
