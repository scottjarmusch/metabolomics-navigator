workflow_steps:
- title: Select a functional-group-specific probe
  description: Choose a chemoselective probe for the metabolite reactivity class of interest, such as carboxyl,
    amine, carbonyl or thiol groups.
- title: Encode metabolites by covalent derivatization
  description: React the sample under conditions designed to selectively label the targeted functional group.
- title: Capture and clean up the encoded submetabolome
  description: Use click chemistry and solid-phase capture to enrich tagged metabolites while reducing matrix background.
- title: Release and analyze derivatives by LC-MS/MS
  description: Profile enriched derivatives, using shared reporter behavior and functional-group information to
    aid classification and annotation.
- title: Reconstruct reactivity-resolved metabolome layers
  description: Compare the parallel functional-group-defined measurements to expand detectable chemical space and
    interpret metabolic changes.
