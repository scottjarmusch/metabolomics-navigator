slug: chemoselective-reactivity-resolved-metabolomics
name: Chemoselective reactivity-resolved metabolomics
summary: A functional-group-resolved metabolomics strategy that uses orthogonal chemoselective probes, covalent
  capture and diagnostic reporter chemistry to enrich and organize otherwise chemically heterogeneous metabolite
  subsets before LC-MS.
description: The modular reactivity-encoding platform (MREP) uses distinct alkyne-tagged probes for carboxyl, amine,
  carbonyl and thiol functionalities. Tagged metabolites are captured through click chemistry on a common resin,
  matrix is removed, and released derivatives share reporter-ion behavior. The strategy converts intrinsic chemical
  reactivity into an experimental annotation/enrichment dimension.
