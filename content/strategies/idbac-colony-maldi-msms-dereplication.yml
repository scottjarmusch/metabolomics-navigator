scope:
  designed_for:
  - Early dereplication and strain prioritization in microbial natural-product discovery before large-scale fermentation
    and extraction.
  - Linking colony-level metabolite production to MS/MS molecular families and tentative annotations.
  requirements:
  - MALDI instrumentation capable of the required MS1 and tandem-MS acquisition workflow.
  - Cultured microbial colonies and compatible IDBac/GNPS2 data preparation.
  considerations:
  - Colony-level production can differ from larger-scale fermentation, so prioritized chemistry should be reconfirmed
    after scale-up.
  - Spectral-library matches and molecular-network relationships provide dereplication evidence but do not replace
    full structure elucidation.
