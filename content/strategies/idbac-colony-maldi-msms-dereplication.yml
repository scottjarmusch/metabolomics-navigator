workflow_steps:
- title: Profile colonies by MALDI-MS1
  description: Acquire protein-region and specialized-metabolite spectra directly from microbial colonies and inspect
    the collection in IDBac.
  tool_slugs: []
  external_tools:
  - name: IDBac
    url: https://idbac.org/
- title: Select small-molecule precursors for fragmentation
  description: Use the colony-level specialized-metabolite data to choose precursor ions for MALDI tandem-MS acquisition
    while filtering matrix/background signals.
  tool_slugs: []
  external_tools:
  - name: IDBac
    url: https://idbac.org/
- title: Acquire MALDI-MS/MS spectra
  description: Fragment selected precursor ions directly from colony-derived samples to generate tandem spectra
    before fermentation scale-up.
- title: Run downstream GNPS2 molecular networking
  description: Submit compatible MALDI-MS/MS spectra to GNPS2 for molecular networking and spectral-library searching.
  tool_slugs:
  - gnps
- title: Prioritize strains and chemistry
  description: Combine colony identity, metabolite-production patterns, molecular-family context, and preliminary
    annotations to select strains and compounds for scale-up and orthogonal structural validation.
tools:
- role: Colony-level bacterial grouping, specialized-metabolite profiling, and precursor-selection context.
