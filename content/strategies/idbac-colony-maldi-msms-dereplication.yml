slug: idbac-colony-maldi-msms-dereplication
name: Colony-based MALDI-MS/MS dereplication with IDBac and GNPS2
summary: A miniaturized microbial natural-product strategy that adds MALDI tandem mass spectrometry and GNPS2 molecular
  networking to IDBac so metabolite families can be preliminarily annotated directly from colonies before fermentation
  scale-up and extraction.
description: This strategy extends colony-level IDBac screening beyond MALDI-MS1 chemical fingerprints. Protein
  and specialized-metabolite MS1 data are first used to understand isolate identity and metabolite-production potential.
  Selected precursor ions are then fragmented by MALDI-MS/MS, and the resulting spectra are passed to GNPS2 for
  molecular networking and library searching. The layered workflow adds preliminary structural context early enough
  to influence which strains are advanced to scale-up.
