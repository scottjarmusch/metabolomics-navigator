$schema: ../../schemas/strategy.schema.json
slug: mzmine-imaging-ms-processing
name: MS-imaging processing and annotation with MZmine
summary: A reproducible MZmine workflow for feature extraction, visualization, and annotation of mass-spectrometry
  imaging data, including ion-mobility-enabled imaging experiments.
description: The imaging procedure in the MZmine Nature Protocols workflow processes spatially resolved MS or IMS-MS
  data into features that can be visualized as ion images and linked to spectral/annotation evidence. The workflow
  is applicable to imaging modalities supported by MZmine and can integrate ion mobility where available.
publication:
  title: Reproducible mass spectrometry data processing and compound annotation in MZmine 3
  doi: 10.1038/s41596-024-00996-y
  url: https://www.nature.com/articles/s41596-024-00996-y
  citation: Heuckeroth S, Damiani T, Smirnov A, et al. Reproducible mass spectrometry data processing and compound
    annotation in MZmine 3. Nature Protocols 19, 2597–2641 (2024).
  journal: Nature Protocols
  year: 2024
purpose:
  primary: spatial_metabolomics
  secondary:
  - metabolite_annotation
  - molecular_discovery
platforms:
- imaging_ms
- maldi_ms
analysis_types:
- untargeted
- spatial_metabolomics
- lipidomics
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - full_scan
  - dda
  ion_mobility: supported
components:
- data_conversion
- preprocessing
- ion_mobility
- annotation
- data_sharing
workflow_steps:
- title: Import spatial MS data
  description: Import supported imaging data while preserving spatial coordinates and, where available, ion-mobility
    information.
  tool_slugs:
  - mzmine
- title: Detect and organize imaging features
  description: Apply mass detection and feature-processing steps appropriate to the imaging acquisition to generate
    spatially resolved ion features.
  tool_slugs:
  - mzmine
- title: Visualize spatial distributions
  description: Inspect ion images and, where available, mobility or spectral dimensions to assess localization and
    data quality.
  tool_slugs:
  - mzmine
- title: Annotate spatial features
  description: Use available MS/MS, spectral libraries, lipid annotation, or other MZmine annotation modules to
    add chemical context to spatially resolved features.
  tool_slugs:
  - mzmine
- title: Export reproducible results
  description: Save processing configurations, feature information, images, and compatible outputs for downstream
    statistical or annotation workflows.
  tool_slugs:
  - mzmine
tools:
- slug: mzmine
  role: Primary imaging-MS feature processing, visualization, annotation, and export environment.
resources:
  raw_data_available: true
  raw_data_url: https://massive.ucsd.edu/ProteoSAFe/dataset.jsp?task=MSV000090328
  code_available: true
  code_url: https://github.com/mzmine/mzmine
  method_available: true
  method_url: https://www.nature.com/articles/s41596-024-00996-y
scope:
  designed_for:
  - Untargeted MS-imaging data where spatial ion distributions need to be processed and connected to feature or
    annotation information.
  requirements:
  - Imaging-MS data in a format supported by MZmine; ion-mobility information is optional and instrument dependent.
  considerations:
  - Spatial resolution, normalization, matrix/background effects, and annotation confidence require imaging-specific
    quality assessment beyond generic LC-MS preprocessing.
  - The published procedure targets MZmine 3; consult current MZmine 4 imaging documentation for current module
    names and supported acquisition types.
