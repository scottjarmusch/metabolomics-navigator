$schema: ../../schemas/strategy.schema.json
slug: masst-repository-scale-search
name: Repository-scale MS/MS searching with MASST
summary: A repository-mining strategy that searches a query MS/MS spectrum across public metabolomics data to identify
  where the same or related spectral signal has been observed.
description: MASST turns a single tandem mass spectrum into a repository-scale query. Matches can reveal datasets,
  files, organisms, environments, or sample types in which the query spectrum or close analogues occur, providing
  a route from spectral observation to biological or environmental context.
publication:
  title: Mass spectrometry searches using MASST
  doi: 10.1038/s41587-019-0375-9
  url: https://www.nature.com/articles/s41587-019-0375-9
  citation: Wang M, Jarmusch AK, Vargas F, et al. Mass spectrometry searches using MASST. Nature Biotechnology 38,
    23–26 (2020).
  journal: Nature Biotechnology
  year: 2020
purpose:
  primary: phenotype_association
  secondary:
  - molecular_discovery
  - metabolite_annotation
  - environmental_metabolomics
platforms:
- multi_platform
analysis_types:
- untargeted
- metabolite_profiling
acquisition:
  ms_levels:
  - ms2
  strategies:
  - dda
  - targeted_msms
  - unspecified
  ion_mobility: not_required
components:
- spectral_search
- repository_mining
- metadata_analysis
- biological_validation
- data_sharing
workflow_steps:
- title: Choose a query MS/MS spectrum
  description: Select a representative centroided MS/MS spectrum for the molecule or unknown feature of interest
    and confirm precursor and fragment information.
- title: Configure the MASST search
  description: Submit the spectrum to MASST and set precursor/fragment tolerances and spectral-similarity thresholds
    appropriate to the data.
  tool_slugs:
  - masst
  - gnps
- title: Search public repositories and libraries
  description: Search public small-molecule MS/MS data and spectral libraries for related spectra and retrieve matching
    datasets/files.
  tool_slugs:
  - masst
  - massive
- title: Contextualize public matches
  description: Use dataset/sample metadata, optionally through ReDU, to examine organism, biospecimen, disease,
    environment, or other contexts associated with matches.
  tool_slugs:
  - redu
  - masst
- title: Validate the resulting hypothesis
  description: Confirm candidate occurrence or biological associations with orthogonal evidence, targeted analyses,
    standards, or independent samples as appropriate.
tools:
- slug: masst
  role: Repository-scale MS/MS search.
- slug: gnps
  role: GNPS2 infrastructure and spectral workflows.
- slug: massive
  role: Public repository contributing searchable MS/MS datasets.
- slug: redu
  role: Optional standardized metadata contextualization of public matches.
resources:
  code_available: true
  code_url: https://github.com/CCMS-UCSD/GNPS_Workflows/tree/master/search_single_spectrum
  method_available: true
  method_url: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/masst/
scope:
  designed_for:
  - Asking where a known or unknown MS/MS spectrum has been observed across public metabolomics datasets.
  - Generating biological, environmental, natural-product, or phenotype hypotheses from public-data occurrence patterns.
  requirements:
  - A representative centroided MS/MS query spectrum with suitable precursor information.
  considerations:
  - Repository composition and metadata completeness bias which contexts can be discovered.
  - Spectral similarity alone does not prove chemical identity; matches should be interpreted with mass accuracy,
    metadata, and orthogonal evidence.
