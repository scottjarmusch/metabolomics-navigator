slug: gnps-classical-molecular-networking
name: Classical molecular networking in GNPS
summary: A GNPS workflow that groups related MS/MS spectra by fragmentation similarity to visualize molecular families
  and propagate spectral-library annotations through untargeted datasets.
description: Classical molecular networking organizes MS/MS spectra into a graph in which nodes represent consensus
  fragmentation spectra and edges connect spectra above defined similarity thresholds. The workflow is useful when
  chromatographic feature tables are unavailable or when the analysis is centered directly on MS/MS spectral relationships.
