workflow_steps:
- title: Prepare centroided MS/MS data
  description: Convert or export tandem mass-spectrometry data in a GNPS-compatible open format and organize files
    and optional sample metadata for analysis.
- title: Select or upload data in GNPS2
  description: Choose uploaded files or reference public files using Universal Spectrum Identifiers (USIs) in the
    Classical Molecular Networking workflow.
  tool_slugs:
  - gnps
  - massive
- title: Filter and organize MS/MS spectra
  description: Apply precursor and fragment tolerances, minimum peak requirements, and networking filters appropriate
    to the instrument and experiment.
  tool_slugs:
  - gnps
- title: Construct the molecular network
  description: Connect spectra that pass the selected similarity and matched-fragment criteria, producing molecular
    families of spectrally related ions.
  tool_slugs:
  - gnps
- title: Search spectral libraries and inspect networks
  description: Overlay community spectral-library matches, review singletons and molecular families, and export
    or visualize network results.
  tool_slugs:
  - gnps
tools:
- slug: gnps
  role: Classical molecular-networking workflow, spectral-library search, and visualization.
- slug: massive
  role: Optional source or repository for public MS/MS datasets.
resources:
  code_available: true
  code_url: https://github.com/CCMS-UCSD/GNPS_Workflows
  method_available: true
  method_url: https://wang-bioinformatics-lab.github.io/GNPS2_Documentation/classical/
scope:
  designed_for:
  - Discovering molecular families directly from untargeted MS/MS spectra without requiring a chromatographic feature
    table.
  - Natural-product dereplication and exploratory organization of fragmentation-similar spectra.
  requirements:
  - Centroided MS/MS data with precursor information and instrument-appropriate mass tolerances.
  considerations:
  - Unlike FBMN, classical molecular networking is spectrum-centric and does not inherently preserve chromatographic
    feature quantification or resolve coeluting/isomeric features through an external feature table.
  - Network topology depends on filtering and similarity thresholds; these parameters should be reported together
    with the GNPS task identifier.
