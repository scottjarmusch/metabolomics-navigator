$schema: ../../schemas/strategy.schema.json
slug: mzmine-lc-ms-processing
name: Untargeted LC-(IMS)-MS processing and annotation with MZmine
summary: A reproducible MZmine workflow for feature detection, alignment, quality filtering, annotation, and downstream
  export of untargeted LC-MS or LC-IMS-MS data.
description: 'This strategy captures the LC-(IMS)-MS procedure published for MZmine 3: raw spectral data are converted
  into aligned quantitative features linked to isotope patterns, ion mobility where present, and MS/MS spectra,
  then annotated and exported for downstream tools. Current MZmine 4 uses the same broad processing logic while
  providing updated modules and wizard-driven workflows.'
publication:
  title: Reproducible mass spectrometry data processing and compound annotation in MZmine 3
  doi: 10.1038/s41596-024-00996-y
  url: https://www.nature.com/articles/s41596-024-00996-y
  citation: Heuckeroth S, Damiani T, Smirnov A, et al. Reproducible mass spectrometry data processing and compound
    annotation in MZmine 3. Nature Protocols 19, 2597–2641 (2024).
  journal: Nature Protocols
  year: 2024
purpose:
  primary: metabolite_annotation
  secondary:
  - molecular_discovery
  - molecular_family_discovery
platforms:
- lc_ms
analysis_types:
- untargeted
- metabolite_profiling
- lipidomics
acquisition:
  ms_levels:
  - ms1
  - ms2
  strategies:
  - dda
  ion_mobility: supported
components:
- data_conversion
- preprocessing
- quality_control
- annotation
- molecular_networking
- data_sharing
workflow_steps:
- title: Import and inspect LC-MS or LC-IMS-MS data
  description: Import supported vendor/open data, apply appropriate mass detection, and inspect chromatographic
    and spectral quality before feature processing.
  tool_slugs:
  - mzmine
- title: Build chromatograms and resolve features
  description: Construct extracted-ion chromatograms and resolve chromatographic peaks using experiment-appropriate
    intensity, mass-tolerance, retention-time, and peak-shape settings.
  tool_slugs:
  - mzmine
- title: Group isotopes/ions and align samples
  description: Group isotopic and related ion signals, align features across samples, perform gap filling where
    justified, and apply blank/QC or other quality filters.
  tool_slugs:
  - mzmine
- title: Annotate features
  description: Use spectral-library matching, local databases, lipid annotation, and ion-identity relationships
    as appropriate to generate feature annotations.
  tool_slugs:
  - mzmine
- title: Export to downstream annotation/networking tools
  description: Export aligned feature tables and spectra for GNPS FBMN/IIMN, SIRIUS, MetaboAnalyst, or other downstream
    analyses while retaining the MZmine batch configuration for reproducibility.
  tool_slugs:
  - mzmine
  - gnps
  - sirius
  - metaboanalyst
tools:
- slug: mzmine
  role: Primary LC-(IMS)-MS feature processing, annotation, visualization, and export environment.
- slug: gnps
  role: Optional downstream feature-based or ion-identity molecular networking.
- slug: sirius
  role: Optional downstream formula/class/structure annotation.
- slug: metaboanalyst
  role: Optional downstream statistical analysis.
resources:
  raw_data_available: true
  raw_data_url: https://massive.ucsd.edu/ProteoSAFe/dataset.jsp?task=MSV000091634
  code_available: true
  code_url: https://github.com/mzmine/mzmine
  method_available: true
  method_url: https://www.nature.com/articles/s41596-024-00996-y
scope:
  designed_for:
  - Untargeted LC-MS and LC-IMS-MS feature detection, alignment, annotation, and export to downstream tools.
  requirements:
  - Appropriate raw/open MS data and experiment-specific processing parameters; DDA MS/MS is especially useful for
    feature annotation.
  considerations:
  - The published procedure targets MZmine 3 and should be adapted using current MZmine 4 documentation and wizard
    defaults rather than copied blindly.
  - Batch files and software version should be retained and reported to support reproducibility.
