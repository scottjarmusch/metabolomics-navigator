workflow_steps:
- title: Establish candidate molecular formulas
  description: Run SIRIUS formula annotation and retain plausible precursor formulas for structure analysis.
  tool_slugs:
  - sirius
- title: Predict molecular fingerprints with CSI:FingerID
  description: Use fragmentation-tree-derived information and machine learning to predict structural fingerprint
    properties from the MS/MS spectrum.
  tool_slugs:
  - sirius
- title: Search molecular-structure databases
  description: Rank database candidates whose structural fingerprints agree with the predicted fingerprint and molecular
    formula.
  tool_slugs:
  - sirius
- title: Apply COSMIC confidence scoring
  description: Evaluate CSI:FingerID structure candidates with COSMIC to identify predictions that meet stronger
    confidence criteria and to separate high-confidence from ambiguous assignments.
  tool_slugs:
  - sirius
- title: Validate prioritized structures
  description: Review candidate structures and corroborate important annotations with spectral standards, retention
    behavior, orthogonal data, or other appropriate evidence.
tools:
- slug: sirius
  role: Integrated formula, fingerprint, class, database-search, confidence, and de novo structure workflows.
resources:
  code_available: true
  code_url: https://github.com/sirius-ms/sirius
  method_available: true
  method_url: https://v6.docs.sirius-ms.io/
scope:
  designed_for:
  - Annotating MS/MS features against molecular-structure databases when no matching reference spectrum is available.
  - Prioritizing structure candidates and identifying a subset of particularly confident database-search annotations.
  requirements:
  - A plausible molecular formula and informative high-resolution MS/MS spectrum; CSI:FingerID/COSMIC are webservice-backed
    SIRIUS features requiring appropriate account/license access.
  considerations:
  - The method is constrained by the candidate structure databases being searched; compounds absent from those databases
    cannot be returned as exact database candidates.
  - A high computational confidence score should still be reported as an annotation unless the identification level
    is supported by appropriate orthogonal evidence.
