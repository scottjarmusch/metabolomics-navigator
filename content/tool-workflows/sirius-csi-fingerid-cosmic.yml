$schema: ../../schemas/strategy.schema.json
slug: sirius-csi-fingerid-cosmic
name: Structure database search with CSI:FingerID and COSMIC
summary: A SIRIUS workflow that predicts a molecular fingerprint from MS/MS data, searches structure databases with
  CSI:FingerID, and uses COSMIC confidence scoring to prioritize high-confidence structural annotations.
description: CSI:FingerID predicts molecular fingerprints from fragmentation-tree information and uses them to rank
  candidate structures in molecular databases. The COSMIC workflow adds confidence estimation to help distinguish
  particularly trustworthy structure-database annotations from ambiguous candidate lists.
publication:
  title: High-confidence structural annotation of metabolites absent from spectral libraries
  doi: 10.1038/s41587-021-01045-9
  url: https://www.nature.com/articles/s41587-021-01045-9
  citation: Hoffmann MA, Nothias L-F, Ludwig M, et al. High-confidence structural annotation of metabolites absent
    from spectral libraries. Nature Biotechnology 40, 411–421 (2022).
  journal: Nature Biotechnology
  year: 2022
