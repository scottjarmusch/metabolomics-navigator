name: Create draft entry from submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-draft:
    # The Issue Form always prefixes valid submissions with this text.
    # We deliberately do not depend on labels because GitHub silently omits
    # template labels that do not yet exist in a new repository.
    if: startsWith(github.event.issue.title, '[Tool submission]:')
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure repository labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create tool-submission --color 0E8A16 --description "New catalogue tool submission" --force
          gh label create tool-update --color 1D76DB --description "Correction or update to an existing entry" --force
          gh label create needs-triage --color FBCA04 --description "Needs editorial review" --force
          gh label create automated-draft --color BFD4F2 --description "Draft generated by repository automation" --force
          gh issue edit "${{ github.event.issue.number }}" --add-label tool-submission --add-label needs-triage

      - name: Convert issue to tool record
        id: convert
        run: python scripts/issue_to_tool.py --event "$GITHUB_EVENT_PATH"

      - name: Validate catalogue
        run: |
          python scripts/validate_tools.py
          python scripts/check_form_sync.py

      - name: Create or refresh automation branch
        env:
          BRANCH: automation/tool-submission-${{ github.event.issue.number }}
          TOOL_PATH: ${{ steps.convert.outputs.path }}
          TOOL_NAME: ${{ steps.convert.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$TOOL_PATH"
          if git diff --cached --quiet; then
            echo "No generated change to commit."
          else
            git commit -m "Add draft entry for $TOOL_NAME"
          fi
          git push --force-with-lease --set-upstream origin "$BRANCH"

      - name: Create or reuse pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/tool-submission-${{ github.event.issue.number }}
          TOOL_NAME: ${{ steps.convert.outputs.name }}
          SOURCE_ISSUE: ${{ github.event.issue.html_url }}
        run: |
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_BODY=$(printf 'Automated draft generated from %s.\n\nEditorial review is required before publication.' "$SOURCE_ISSUE")
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Add $TOOL_NAME" \
              --label automated-draft \
              --label needs-triage \
              --body "$PR_BODY")
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on successful submission
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Thank you. A structured draft entry has been created for editorial review: $PR_URL"

      - name: Comment if automation fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "The automated draft could not be created. A maintainer should review the failed workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
