name: Create draft entry from submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-draft:
    if: contains(github.event.issue.title, '[Tool submission]:') || contains(github.event.issue.title, '[Strategy submission]:') || contains(github.event.issue.labels.*.name, 'tool-submission') || contains(github.event.issue.labels.*.name, 'strategy-submission')
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required submission fields and identify type
        id: kind
        run: python scripts/check_submission_completeness.py --event "$GITHUB_EVENT_PATH"

      - name: Preserve existing submission branches
        env:
          BRANCH: automation/${{ steps.kind.outputs.type }}-submission-${{ github.event.issue.number }}
        run: |
          if [ -n "$(git ls-remote --heads origin "refs/heads/$BRANCH")" ]; then
            echo "An existing submission branch needs maintainer review; it will not be overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Ensure repository labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_LABEL: ${{ steps.kind.outputs.label }}
        run: |
          gh label create tool-submission --color 0E8A16 --description "New catalogue tool submission" --force
          gh label create tool-update --color 1D76DB --description "Correction or update to a tool entry" --force
          gh label create strategy-submission --color 5319E7 --description "New catalogue strategy submission" --force
          gh label create strategy-update --color 7057FF --description "Correction or update to a strategy entry" --force
          gh label create needs-triage --color FBCA04 --description "Needs editorial review" --force
          gh label create automated-draft --color BFD4F2 --description "Draft generated by repository automation" --force
          gh issue edit "${{ github.event.issue.number }}" --add-label "$SUBMISSION_LABEL" --add-label needs-triage

      - name: Convert issue to structured record
        id: convert
        env:
          ENTRY_TYPE: ${{ steps.kind.outputs.type }}
        run: |
          if [ "$ENTRY_TYPE" = "strategy" ]; then
            python scripts/issue_to_strategy.py --event "$GITHUB_EVENT_PATH"
          else
            python scripts/issue_to_tool.py --event "$GITHUB_EVENT_PATH"
          fi

      - name: Create or refresh automation branch
        env:
          BRANCH: automation/${{ steps.kind.outputs.type }}-submission-${{ github.event.issue.number }}
          ENTRY_PATH: ${{ steps.convert.outputs.path }}
          ENTRY_NAME: ${{ steps.convert.outputs.name }}
          ENTRY_TYPE: ${{ steps.kind.outputs.type }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$ENTRY_PATH"
          if git diff --cached --quiet; then
            echo "No generated change to commit."
          else
            git commit -m "Add draft $ENTRY_TYPE entry for $ENTRY_NAME"
          fi
          git push --set-upstream origin "$BRANCH"

      - name: Create or reuse pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/${{ steps.kind.outputs.type }}-submission-${{ github.event.issue.number }}
          ENTRY_NAME: ${{ steps.convert.outputs.name }}
          ENTRY_TYPE: ${{ steps.kind.outputs.type }}
          SOURCE_ISSUE: ${{ github.event.issue.html_url }}
        run: |
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_BODY=$(printf 'Automated %s draft generated from %s.\n\nCloses %s.\n\nMaintainer acceptance is required before publication. Tool submissions can be accepted with editorial additions pending; Strategies retain their editorial inclusion requirements. Required catalogue validation must pass before merging. If GitHub is awaiting workflow approval, a maintainer must review and approve the run from the Actions tab. See docs/submission-maintainer-guide.md.' "$ENTRY_TYPE" "$SOURCE_ISSUE" "$SOURCE_ISSUE")
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Add $ENTRY_NAME" \
              --label automated-draft \
              --label needs-triage \
              --body "$PR_BODY")
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on successful submission
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          ENTRY_TYPE: ${{ steps.kind.outputs.type }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Thank you. A structured $ENTRY_TYPE draft has been created for editorial review: $PR_URL. Required catalogue validation must pass before merging; GitHub may require a maintainer to approve its workflow run. Acceptance and later editorial enrichment are separate."

      - name: Comment if draft generation fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "The automated draft could not be generated. A maintainer should review the completeness report and workflow summary here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
