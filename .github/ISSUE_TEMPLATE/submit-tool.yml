name: Submit a metabolomics tool
description: Add a tool, database, library, service, repository, or workflow to the Metabolomics Navigator.
title: '[Tool submission]: '
labels:
- tool-submission
- needs-triage
body:
- type: markdown
  attributes:
    value: 'Thank you for contributing. The required section is designed to take about two minutes. A maintainer can enrich the entry later.

      '
- type: checkboxes
  id: duplicate-check
  attributes:
    label: Existing entry
    options:
    - label: I searched the catalogue and did not find an existing entry for this tool.
      required: true
- type: input
  id: tool-name
  attributes:
    label: Tool name
    placeholder: e.g., MZmine
  validations:
    required: true
- type: input
  id: primary-link
  attributes:
    label: Best link for the tool
    description: Homepage, web application, documentation, repository, or download page.
    placeholder: https://...
  validations:
    required: true
- type: textarea
  id: summary
  attributes:
    label: What does the tool do?
    description: Give a neutral one- or two-sentence description. Avoid unsupported claims such as “best” or “most accurate.”
    placeholder: This tool helps researchers...
  validations:
    required: true
- type: dropdown
  id: resource-types
  attributes:
    label: What kind of resource is it?
    multiple: true
    options:
    - Software application
    - Programming package or library
    - Web application or service
    - Database or knowledgebase
    - Spectral library
    - Data repository
    - Workflow or pipeline
    - Workflow platform
    - API or programmatic service
    - Instrument-vendor suite
  validations:
    required: true
- type: dropdown
  id: primary-function
  attributes:
    label: What is its main function?
    options:
    - Data acquisition and instrument control
    - Data conversion and import
    - Preprocessing and feature extraction
    - Quality control and filtering
    - Normalization and batch correction
    - Quantification and targeted analysis
    - Metabolite annotation and identification
    - Spectral processing and comparison
    - Molecular networking and chemical similarity
    - Statistical analysis
    - Machine learning and prediction
    - Pathway and biological interpretation
    - Isotope tracing and flux analysis
    - Visualization and reporting
    - Data management and sharing
    - Workflow management and reproducibility
    - Reference data and database search
    - Multi-omics integration
  validations:
    required: true
- type: dropdown
  id: secondary-functions
  attributes:
    label: Other functions
    description: Optional. Select any other major tasks the tool supports.
    multiple: true
    options:
    - Data acquisition and instrument control
    - Data conversion and import
    - Preprocessing and feature extraction
    - Quality control and filtering
    - Normalization and batch correction
    - Quantification and targeted analysis
    - Metabolite annotation and identification
    - Spectral processing and comparison
    - Molecular networking and chemical similarity
    - Statistical analysis
    - Machine learning and prediction
    - Pathway and biological interpretation
    - Isotope tracing and flux analysis
    - Visualization and reporting
    - Data management and sharing
    - Workflow management and reproducibility
    - Reference data and database search
    - Multi-omics integration
- type: dropdown
  id: platforms
  attributes:
    label: Which analytical platforms does it support?
    multiple: true
    options:
    - LC-MS
    - GC-MS
    - CE-MS
    - Direct-infusion MS
    - MALDI-MS
    - Imaging mass spectrometry
    - Multiple analytical platforms
    - Platform-independent
  validations:
    required: true
- type: dropdown
  id: interfaces
  attributes:
    label: How do researchers use it?
    multiple: true
    options:
    - Web application
    - Desktop graphical interface
    - Command line
    - R package
    - Python package
    - MATLAB
    - Notebook
    - API
    - Galaxy
    - KNIME
    - Workflow language or engine
    - Instrument-vendor integration
  validations:
    required: true
- type: dropdown
  id: access-model
  attributes:
    label: How is it accessed?
    options:
    - Open source
    - Source available with restrictions
    - Free web service
    - Free for academic use
    - Freemium
    - Commercial
    - Institutional access required
    - Access model unclear
  validations:
    required: true
- type: dropdown
  id: submitter-role
  attributes:
    label: What is your relationship to the tool?
    options:
    - Developer or author
    - Current maintainer
    - Tool user
    - Database or community curator
    - Other contributor
  validations:
    required: true
- type: markdown
  attributes:
    value: '### Optional details

      These help us publish a richer entry, but you may leave them blank.

      '
- type: input
  id: aliases
  attributes:
    label: Other names or aliases
    description: Optional. Add common alternative names, spelling variants, or previous names separated by commas.
    placeholder: MSDIAL, MS Dial
- type: input
  id: publication
  attributes:
    label: Primary publication or DOI
    description: A paper introducing or substantially updating this resource. Do not submit an application study or a paper for a separate tool. Leave blank if no dedicated paper is known.
    placeholder: 10.xxxx/xxxxx or full citation
- type: textarea
  id: additional-links
  attributes:
    label: Additional links
    description: Documentation, repository, web app, tutorials, datasets, issue tracker, bio.tools, or WorkflowHub.
    placeholder: 'Documentation: https://...

      Repository: https://...

      '
- type: input
  id: submitter-name
  attributes:
    label: Contributor name
    description: Your name will be used for contribution provenance and, with the consent below, displayed in the public Contributor Directory.
    placeholder: Jane Doe
  validations:
    required: true
- type: input
  id: submitter-orcid
  attributes:
    label: ORCID iD
    description: Optional. Add your ORCID iD in the format 0000-0000-0000-0000. If provided, it will be linked from your Contributor Directory entry when you consent to public attribution.
    placeholder: 0000-0000-0000-0000
- type: textarea
  id: notes
  attributes:
    label: Anything else we should know?
    description: Versions, licenses, supported formats, limitations, related tools, or other useful context.
- type: checkboxes
  id: confirmation
  attributes:
    label: Submission confirmation
    options:
    - label: To the best of my knowledge, the information is accurate and suitable for public display.
      required: true
- type: checkboxes
  id: contributor-consent
  attributes:
    label: Contributor attribution and privacy
    options:
    - label: I consent to Metabolomics Navigator publishing my name and, if provided, my ORCID iD in the public Contributor Directory. I understand that this submission is made through a public GitHub issue and that the information I enter in this form will also be publicly visible on GitHub. I have read the [Metabolomics Navigator Privacy Policy](https://scottjarmusch.github.io/metabolomics-navigator/privacy/).
      required: true
