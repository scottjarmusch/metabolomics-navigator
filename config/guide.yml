- id: spatial-metabolomics
  title: Working with spatial metabolomics
  short_title: Spatial metabolomics
  caption: Explore molecular distributions in tissues and surfaces.
  introduction: Imaging mass spectrometry links molecular signals to spatial coordinates. Processing, visualization
    and annotation address different questions; an ion image alone does not establish molecular identity.
  selection: Start with the acquisition mode, spatial coordinates and available file formats. Keep biological replication
    distinct from the number of measured pixels.
