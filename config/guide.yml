- id: public-data
  title: Finding context in public data
  introduction: Public data can help you investigate where a spectrum, molecule, or chemical family has been observed.
    Some resources begin with a query spectrum; others use a structure or sample metadata. Domain-specific collections
    add context such as microbial taxonomy, plants, or foods.
  selection: Check what is indexed and inspect the original study metadata. A match supports further investigation;
    it does not by itself establish biological origin or absence from unmeasured samples.
  slugs:
