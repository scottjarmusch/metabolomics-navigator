- id: interpretation
  title: Inspecting and interpreting results
  introduction: Once data have been processed, researchers need to inspect signals, analyze variation across samples,
    and interpret results in biological context. An interactive viewer, a statistical platform, and a collection
    of downstream applications provide different kinds of support.
  selection: Start with your study design and the form of your input data. Preserve sample identifiers, preprocessing
    decisions, and analysis settings when moving between tools.
