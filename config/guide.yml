- id: reference-resources
  title: Sharing data and reference knowledge
  introduction: Repositories preserve experimental files, reference spectra support annotation, and knowledgebases
    connect molecular evidence to its reported context. These resources serve different purposes, but all depend
    on clear metadata and traceable evidence.
  selection: Distinguish depositing a dataset from preparing a reference spectrum or contributing a biological annotation.
    Keep the source files, identifiers, and supporting evidence connected.
