- id: annotation
  title: Annotating molecules
  introduction: Annotation tools help connect measured signals to molecular formulas, candidate structures, or chemical
    classes. These are different levels of information. A class prediction can be useful even when an exact structure
    remains unknown; a ranked structure candidate still needs supporting evidence.
  selection: 'Match the tool to the question you can answer with your data: formula, chemical class, database candidate,
    or a possible modification of a known molecule.'
